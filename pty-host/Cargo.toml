[package]
name = "attn-pty-host"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22.1"
libc = "0.2.177"
png = "0.18.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[build-dependencies]
cc = "1.2.43"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
