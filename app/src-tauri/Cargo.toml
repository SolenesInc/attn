[package]
name = "app"
version = "0.11.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# Thin on purpose: `generate_context!` embeds every frontend file into the crate
# that calls it, so this crate recompiles on every frontend change and app-core does not.
[workspace]
members = ["core"]
default-members = [".", "core"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.2", features = ["protocol-asset", "unstable"] }
app-core = { path = "core" }
# `generate_context!` expands to code that names serde_json in the calling crate.
serde_json = "1"
# Plugin permissions reach tauri-build only through this crate's direct
# dependencies, so the plugins app-core uses are listed here too.
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"

[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Named profiles build with this (scripts/build-app-profile.sh): release code paths,
# but the crate we edit skips LLVM optimization. Releases and the default profile stay `release`.
[profile.fast]
inherits = "release"

[profile.fast.package.app-core]
opt-level = 0
