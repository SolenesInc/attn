[package]
edition = "2021"
rust-version = "1.77"
name = "global-hotkey"
version = "0.8.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Global hotkeys for Desktop Applications"
documentation = "https://docs.rs/global-hotkey"
readme = "README.md"
keywords = [
    "windowing",
    "global",
    "global-hotkey",
    "hotkey",
]
categories = ["gui"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/tauri-apps/global-hotkey"

[features]
serde = ["dep:serde"]
tracing = ["dep:tracing"]

[lib]
name = "global_hotkey"
path = "src/lib.rs"

[dependencies.crossbeam-channel]
version = "0.5"

[dependencies.keyboard-types]
version = "0.7"

[dependencies.once_cell]
version = "1"

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

[dependencies.thiserror]
version = "2"

[dependencies.tracing]
version = "0.1"
optional = true

[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6.0"

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3.0"
features = [
    "std",
    "NSEvent",
]
default-features = false

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3"
default-features = false
features = ["std", "NSArray", "NSDictionary", "NSValue", "NSString", "NSEnumerator"]
