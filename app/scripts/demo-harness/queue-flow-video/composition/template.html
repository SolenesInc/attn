<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: Mona;
        src: url("assets/fonts/mona-sans.woff2") format("woff2");
        font-weight: 200 900;
        font-stretch: 75% 125%;
      }
      @font-face {
        font-family: JBM;
        src: url("assets/fonts/jetbrains-mono.woff2") format("woff2");
        font-weight: 100 800;
      }
      :root {
        --ground: #08080a;
        --line: #2a2a2d;
        --ink: #f1efe9;
        --mid: #a7a6a1;
        --accent: #ff6b35;
        --waiting: #f59e0b;
        --working: #3fb950;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: Mona, sans-serif;
        color: var(--ink);
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
      #stage {
        position: absolute;
        left: 240px;
        top: 12px;
        width: 1440px;
        height: 960px;
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid var(--line);
        background: #111113;
        opacity: 0;
      }
      #cam {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
      }
      #cam video {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
      }
      .mark {
        position: absolute;
        border: 2px solid var(--accent);
        border-radius: 7px;
        opacity: 0;
      }
      .mark-label {
        position: absolute;
        left: calc(100% + 10px);
        top: 50%;
        white-space: nowrap;
        background: var(--ground);
        border: 1px solid var(--accent);
        border-radius: 5px;
        padding: 5px 9px;
        font-size: 24px;
        font-weight: 600;
        line-height: 1;
        margin-top: -19px;
      }
      #band {
        position: absolute;
        left: 0;
        top: 972px;
        width: 1920px;
        height: 108px;
      }
      .caption {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 22px;
        font-size: 38px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .caption-inner {
        display: flex;
        align-items: center;
        gap: 22px;
        opacity: 0;
      }
      .keys {
        display: flex;
        gap: 8px;
      }
      .key {
        min-width: 58px;
        height: 58px;
        padding: 0 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1.5px solid #4a4a4f;
        border-bottom-width: 4px;
        border-radius: 10px;
        background: #1a1a1d;
        font-family: JBM, monospace;
        font-size: 30px;
        font-weight: 600;
      }
      .card {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 190px;
      }
      .card-quiet {
        font-size: 56px;
        font-weight: 400;
        color: var(--mid);
        letter-spacing: -0.02em;
      }
      .card-hero {
        margin-top: 18px;
        font-size: 150px;
        font-weight: 700;
        font-stretch: 112%;
        letter-spacing: -0.045em;
        line-height: 1.02;
      }
      .card-hero > span {
        display: block;
      }
      .word {
        display: inline-block;
        opacity: 0;
        white-space: pre;
      }
      .accent {
        color: var(--accent);
      }
      #end-foot {
        position: absolute;
        left: 190px;
        right: 190px;
        bottom: 96px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 34px;
        opacity: 0;
      }
      #end-logo {
        font-family: JBM, monospace;
        font-size: 46px;
        font-weight: 700;
        color: var(--accent);
      }
      #end-how {
        display: flex;
        align-items: center;
        gap: 18px;
        color: var(--mid);
      }
      #end-how .key {
        min-width: 50px;
        height: 50px;
        font-size: 26px;
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="__DURATION__"
      data-width="1920"
      data-height="1080"
    >
      <div id="ground"></div>
      <div id="stage">
        <div id="cam">
          <!--VIDEOS-->
          <!--MARKS-->
        </div>
      </div>
      <div id="band">
        <!--CAPTIONS-->
      </div>
      <!--CARDS-->
      <!--AUDIO-->
    </div>
    <script id="edit" type="application/json">
      __EDIT__
    </script>
    <script>
      const edit = JSON.parse(document.getElementById("edit").textContent);
      const tl = gsap.timeline({ paused: true });
      const STAGE = { width: 1440, height: 960 };
      const WINDOW = edit.window;
      gsap.set("#cam", { width: WINDOW.width, height: WINDOW.height });
      const BASE = STAGE.width / WINDOW.width;

      const framing = ({ cx, cy, z }) => {
        const scale = BASE * z;
        const clamp = (value, low) => Math.min(0, Math.max(low, value));
        return {
          scale,
          x: clamp(STAGE.width / 2 - cx * scale, STAGE.width - WINDOW.width * scale),
          y: clamp(STAGE.height / 2 - cy * scale, STAGE.height - WINDOW.height * scale),
        };
      };

      tl.set("#cam", framing(edit.camera[0]), 0);
      for (const move of edit.camera.slice(1)) {
        tl.to("#cam", { ...framing(move), duration: move.duration, ease: "power2.inOut" }, move.t);
      }

      tl.fromTo(
        "#stage",
        { opacity: 0, scale: 1.08, filter: "blur(14px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" },
        edit.stage.in,
      );
      tl.to(
        "#stage",
        { opacity: 0.16, scale: 0.92, filter: "blur(12px)", duration: 0.8, ease: "power2.inOut" },
        edit.stage.out,
      );

      for (const mark of edit.marks) {
        const el = `#${mark.id}`;
        tl.fromTo(
          el,
          { opacity: 0, scale: 1.06 },
          { opacity: 1, scale: 1, duration: 0.3, ease: "power4.out" },
          mark.start + 0.01,
        );
        tl.to(el, { opacity: 0, duration: 0.18, ease: "power2.in" }, mark.end - 0.2);
      }

      for (const caption of edit.captions) {
        const el = `#${caption.id} .caption-inner`;
        tl.fromTo(
          el,
          { opacity: 0, filter: "blur(8px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" },
          caption.start + 0.01,
        );
        for (const press of caption.presses) {
          tl.fromTo(
            `#${caption.id} .key`,
            { y: 0, borderBottomWidth: 4 },
            { y: 3, borderBottomWidth: 1.5, duration: 0.07, repeat: 1, yoyo: true, ease: "power2.out" },
            press,
          );
        }
        tl.to(el, { opacity: 0, filter: "blur(6px)", duration: 0.16, ease: "power2.in" }, caption.end - 0.18);
      }

      for (const card of edit.cards) {
        const words = gsap.utils.toArray(`#${card.id} .word`);
        words.forEach((word, index) => {
          if (card.wordTimes[index] < 0) {
            tl.set(word, { opacity: 1 }, 0);
            return;
          }
          tl.fromTo(
            word,
            { opacity: 0, filter: "blur(6px)" },
            { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power4.out" },
            card.wordTimes[index],
          );
        });
        if (card.out != null) {
          tl.to(`#${card.id} .card`, { opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power2.in" }, card.out);
        }
      }
      tl.fromTo(
        "#end-foot",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power2.out" },
        edit.endFoot,
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
