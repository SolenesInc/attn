[package]
name = "attn-speech"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
hound = "3.5.1"
rubato = "5.0.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
libc = "0.2.177"
transcribe-cpp = "=0.4.1"
ureq = { version = "3.5.0", default-features = false, features = ["native-tls"] }

[patch.crates-io]
transcribe-cpp = { git = "https://github.com/anomalyco/transcribe.cpp", rev = "7045d1c0fe7cee37747b2792977421d435e75fca" }
transcribe-cpp-sys = { git = "https://github.com/anomalyco/transcribe.cpp", rev = "7045d1c0fe7cee37747b2792977421d435e75fca" }

[profile.release]
strip = true
lto = true
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
