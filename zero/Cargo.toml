[workspace]
resolver = "3"
members = ["crates/spike0", "crates/zero", "crates/zero-gpui"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.dependencies]
# Fork with bindings regenerated at attn's Ghostty pin; see the plot's Receipts (s-p54fpa).
libghostty-vt = { git = "https://github.com/victorarias/libghostty-rs.git", rev = "3bb5320a7bbf80ff27d38cac0ee207463a5fc60d" }
libghostty-vt-sys = { git = "https://github.com/victorarias/libghostty-rs.git", rev = "3bb5320a7bbf80ff27d38cac0ee207463a5fc60d", default-features = false, features = ["kitty-graphics"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tungstenite = "0.26"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "crossterm_0_29", "underline-color"] }
crossterm = "0.29"
portable-pty = "0.9"
crossbeam-channel = "0.5"
rand = "0.9"
futures = "0.3"
# runtime_shaders: the Metal toolchain is not installed here; gpui compiles its shaders at launch instead.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }

[profile.release]
debug = 1
