[package]
name = "attn-app"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
attn-automation = { path = "../attn-automation" }
attn-client = { path = "../attn-client" }
attn-protocol = { path = "../../../cli/protocol" }
attn-term = { path = "../attn-term" }
attn-ui = { path = "../attn-ui" }
base64 = "0.22"
libc = "0.2"
percent-encoding = "2.3"
qrcodegen = "1.8"
pulldown-cmark = { version = "0.13", default-features = false }
rune = { workspace = true, features = ["native-file-dialog"] }
rune-kit = { workspace = true, features = ["markdown", "mermaid"] }
rune-mac.workspace = true
serde = "1.0.229"
serde_json = "1.0.154"
uuid = { version = "1.29", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSAlert", "NSBitmapImageRep", "NSControl", "NSEvent", "NSImage", "NSImageRep", "NSResponder", "NSRunningApplication", "NSTextField", "NSView", "NSWindow"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSData", "NSDate", "NSDictionary", "NSError", "NSGeometry", "NSHTTPCookie", "NSKeyValueObserving", "NSObject", "NSString", "NSURL", "NSURLRequest", "NSUUID"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKContentWorld", "WKFrameInfo", "WKHTTPCookieStore", "WKNavigation", "WKPDFConfiguration", "WKSnapshotConfiguration", "WKUIDelegate", "WKUserContentController", "WKUserScript", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore"] }
raw-window-handle = "0.6"
rusqlite = "0.42"
tempfile = "3"

[dev-dependencies]
attn-testkit = { path = "../attn-testkit" }
sha2 = "0.10"
skrifa = "0.44"
tempfile = "3"

[lints]
workspace = true
