disallowed-methods = [
  { path = "std::thread::sleep", reason = "wait on a signal, or move the Runtime's clock in a test" },
  { path = "std::time::Instant::now", reason = "read time through an injected clock, so tests can move it" },
  { path = "std::time::SystemTime::now", reason = "read time through an injected clock, so tests can move it" },
  { path = "rune::color::hex", reason = "take colors from attn_ui::colors" },
  { path = "rune::color::oklch", reason = "take colors from attn_ui::colors" },
  { path = "rune::color::oklcha", reason = "take colors from attn_ui::colors" },
  { path = "rune::color::Color::from_oklab", reason = "take colors from attn_ui::colors" },
]
allow-unwrap-in-tests = true
allow-expect-in-tests = true
