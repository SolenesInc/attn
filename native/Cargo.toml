[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
rune = { git = "https://github.com/SolenesInc/rune", rev = "a9c9bd6ce5d4ef171e5c4b6aac90038a0cb5b819" }
rune-kit = { git = "https://github.com/SolenesInc/rune", rev = "a9c9bd6ce5d4ef171e5c4b6aac90038a0cb5b819" }
rune-mac = { git = "https://github.com/SolenesInc/rune", rev = "a9c9bd6ce5d4ef171e5c4b6aac90038a0cb5b819" }

# Rune's own [patch.crates-io], repeated: cargo ignores a dependency's [patch].
# Keep this list equal to Rune's at the pinned rev.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/SolenesInc/rune", rev = "a9c9bd6ce5d4ef171e5c4b6aac90038a0cb5b819" }
winit = { git = "https://github.com/SolenesInc/rune", rev = "a9c9bd6ce5d4ef171e5c4b6aac90038a0cb5b819" }
parley_engine = { git = "https://github.com/SolenesInc/rune", rev = "a9c9bd6ce5d4ef171e5c4b6aac90038a0cb5b819" }
accesskit_windows = { git = "https://github.com/SolenesInc/rune", rev = "a9c9bd6ce5d4ef171e5c4b6aac90038a0cb5b819" }

# Named instances' app: release, with the app's own crate unoptimized, so an
# edit to it rebuilds fast. What ships is always release.
[profile.fast]
inherits = "release"

[profile.fast.package.attn-app]
opt-level = 0

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
disallowed_methods = "deny"
