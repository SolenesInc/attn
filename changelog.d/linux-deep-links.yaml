kind: internal
area: linux
change: >
  Deep links and the file opener work on Linux. `attn open` hands the
  `<scheme>://spawn` URL to the profile's own app executable instead of shelling
  out to macOS `open`, and the app registers the single-instance plugin so that
  second process passes the URL to the app already running rather than opening a
  second window. `make install` writes a per-profile scheme handler
  (`<XDG_DATA_HOME>/applications/attn-<profile>-handler.desktop`) so anything else
  on the box can open an attn link too, `attn profile register-scheme` rewrites it
  on demand, `attn profile resolve --field desktopEntry` reports it, and `attn
  profile clean` removes it. The Markdown reader's local links and the seed
  artifact open/reveal actions now route through tauri-plugin-opener on every
  platform instead of returning "only supported on macOS". macOS behavior is
  unchanged.
