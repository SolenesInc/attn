kind: internal
area: sessions
change: >
  Shared Codex (still behind `codex_shared_enabled`): when a terminal moves to
  another conversation with /new, /resume or /agents, the session it left stays
  open and hidden, keeps its queue state, and takes attn's input (annotations,
  messages, inbox doorbells) through the app-server; every shared session's
  attn input goes that way, so no terminal's draft is touched. Several
  terminals can show one session; closing a tile ends only its terminal until
  the last one goes, which archives the conversation in Codex, settles its
  usage and closes the session into the ledger. `desktop_show_session` opens a
  tile that resumes a hidden session, approvals included; resuming from the
  ledger unarchives first. attn's label and Codex's conversation name follow
  each other, a plain Codex refuses to resume a conversation a shared session
  holds, ⌘W on a session another tile shows closes only that tile, and an
  app-server nothing uses stops. Sessions and ledger rows carry `hidden`
  (protocol 352) for the app to show.
