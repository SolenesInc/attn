kind: internal
area: testing
change: >
  The real-app harness's mock agent can now hold a conversation across a
  restart. A fixture marked resumable writes its transcript where the daemon's
  own finders walk — codex rollouts under the codex sessions tree, claude
  transcripts under the tool home's project folder, and claude's only once the
  session takes a turn — so a resume launch finds it, and the mock replays the
  earlier turns into the pane and appends to that same file. Codex `/new` binds
  a successor rollout, and both flavors record token usage the way the daemon's
  cost ledger reads it.
