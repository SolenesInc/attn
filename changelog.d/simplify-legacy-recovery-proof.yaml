kind: fixed
area: tickets
change: >
  Closed-ticket recovery now accepts JavaScript ticket-status evidence only from
  direct tool calls. Commands inside branches, loops, or function bodies cannot
  create a recovered transcript-only ticket unless that direct invocation is
  present in the recorded tool call.
symptom: >
  A transcript containing an unexecuted ticket-status command and matching text
  could be mistaken for proof that the command had run.
