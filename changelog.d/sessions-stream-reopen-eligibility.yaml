kind: changed
area: sessions
change: Closed session rows appear immediately while their reopen eligibility resolves independently in the background.
symptom: A slow Git metadata lookup held back the entire Sessions page and every closed row on it.
notes: >
  The stored page now renders first, each closed generation receives one
  terminal result, and slow repositories no longer hold up faster rows.
  Protocol 318 streams reopen eligibility over WebSocket through the new
  session_reopen_resolved event, keeps inline verdicts on the Unix socket,
  preserves the existing refreshed event, and drops the unused checking flag
  from reopen verdicts. Closing a session checks reopen eligibility only while
  a Sessions view is open; the app sends session_reopen_unsubscribe when the
  view closes.
