kind: changed
area: sessions
change: Closed session rows appear immediately while their reopen eligibility resolves independently in the background.
symptom: A slow Git metadata lookup held back the entire Sessions page and every closed row on it.
notes: >
  The stored page now renders first, each closed generation receives one
  terminal result, and slow repositories no longer hold up faster rows.
  Protocol 318 adds streamed reopen delivery and the
  session_reopen_resolved event while preserving the existing refreshed event.
