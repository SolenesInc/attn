kind: fixed
area: daemon
change: >
  Idle transcript watchers now keep session state in memory and open a
  transcript only when the file moves. Codex watchers no longer enter the
  classification path they are designed to skip, and SQLite keeps a bounded
  pool of connections ready for legitimate concurrent work instead of parsing
  the schema again for every burst.
symptom: >
  The daemon could consume most of a CPU core with one agent working because
  every restored Codex session kept querying SQLite and logging twice a second,
  including sessions whose transcripts had not changed.
