kind: changed
area: agents
change: >
  Claude sessions launched by attn get their SendMessage tool back.
  Disabling both ListAgents and SendMessage together also broke a running
  session's native subagents: SendMessage is how an orchestrating session
  continues one it already started (an Agent tool followup), so disabling it
  made every subagent one-shot. ListAgents stays off — it exposed a second
  address book of Claude sessions named by working directory, and
  `attn agent list`/`attn agent msg` remain the way across. Set
  ATTN_CLAUDE_PEER_MESSAGING=1 to launch with ListAgents back too.
