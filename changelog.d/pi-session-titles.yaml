kind: fixed
area: sessions
change: >
  Pi sessions get an automatic title like the native agents do.
  Their initial prompt and steered turns now reach the title path, and the
  title is generated through the first available native CLI (Claude, then
  Codex, then Copilot) since plugin agents have no headless mode of their own.
symptom: >
  A pi session kept its directory name as its label forever, while a Claude
  session doing the same work got a descriptive title after its first prompt.
