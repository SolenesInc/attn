kind: added
area: delegation
change: A maintained Prototyper role builds two or more options for a UI or for the shape of an interface, compares them, and recommends one. Pathfinders delegate prototypes to it when it is enabled, so a Prototyper alternative can route visual work to a different model. Any agent can also work as a Prototyper or Orchestrator in the current conversation, as it already could as a Pathfinder. The attn-workflow skill adds a refactor-first principle (unify existing paths that do the same job before building beside them) applied in planning, prototyping, implementation, review, and orchestration, and gains Prototype and Design references; Design gives interface-design checks drawn from the API design literature. Settings > Delegation names any maintained role missing from an existing table so it can be added in one click.
