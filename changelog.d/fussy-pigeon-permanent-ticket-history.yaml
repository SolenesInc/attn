kind: fixed
area: tickets
change: >
  Closed user tickets, including their activity and attachments, now remain in
  the archive forever. A one-time, create-only upgrade recovers terminal tickets
  from attn-owned local backups and proven transcripts, then represents done
  work as harvested seeds and failed or crashed work as withered seeds. Existing
  rows, seeds, and files always win. The retention sweep is limited to tickets
  with relational proof that attn's Automation feature created them, such as
  scheduled runs or pull-request updates; user-created tickets and tickets of
  unknown origin are never deleted.
symptom: >
  Closed tickets disappeared after the retention window and were not migrated
  when the Garden replaced the ticket board.
