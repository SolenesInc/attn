kind: added
area: analytics
change: >
  With analytics on, Attn now records whether an agent woken by a notification
  stopped on something you needed to read. It asks the small model that judges
  session states, once per stop, at about $0.0012 per call, and stores only the
  answer. This measures how often such stops hide results, and it never opens a
  turn. Run records also say whether the agent asked for your turn, whether your
  queue shows the agent after the stop, and when you first typed during the run.
