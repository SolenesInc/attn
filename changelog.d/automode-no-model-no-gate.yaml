kind: changed
area: automode
change: >
  Auto mode ships with no classifier model, and stays off until you name one.
  It used to default to two models on a specific provider, so a machine that
  had never configured one either judged calls through somebody else's catalog
  or blocked everything when that catalog was unreachable. Settings now says
  auto mode is off while no model is set, and `/auto on` in a session says the
  same instead of turning on a gate that cannot judge.
  `attn automode model --none` proposes going back to no model at all, so the
  way in has a way out. Upgrading clears the old pair too, unless you promoted
  a model yourself: a machine that never picked one comes up with auto mode
  off rather than keeping models it inherited.
