kind: fixed
area: daemon
change: >
  A write-stalled WebSocket client is now told why it was disconnected when it
  reconnects, even when the daemon is under CPU contention. The write pump uses
  the write context's deadline result as its stall receipt, so scheduler delay
  before the write cannot make the elapsed-time check miss an expired deadline
  and lose the eviction notice.
notes: >
  Found when TestWriteStallEndsTheConnectionAndIsRemembered closed the first
  connection in CI but timed out waiting for client_eviction_notice on the
  second. The test now waits for the eviction record before reconnecting.
