kind: added
area: sessions
change: "The Sessions panel and `attn session list --reopen` judge every closed row of a page in the read that fetched it, and print what would bring each one back. A page costs one call instead of one `attn session show` per closed row. The judgement stays free of the repository, exactly as `show` is: rows answer from what the daemon already knows and sharpen once the branch check behind them lands."
