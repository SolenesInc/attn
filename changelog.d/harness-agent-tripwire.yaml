kind: internal
area: harness
change: >
  The real-app harness now proves a scenario called no model. It puts shims for
  `claude`, `codex`, `copilot` and `pi` first on the PATH the app, the daemon it
  spawns, and the harness's own `attn` calls inherit, and pins them through
  `ATTN_<AGENT>_EXECUTABLE` so they survive into session PTYs, where the login
  shell rebuilds PATH. A shim records the scenario and the argv in the run's
  `agent-tripwire.ledger` and refuses to run; the scenario runner, the serial
  matrix, the soak and the bridge smoke fail on a non-empty ledger and print
  what ran. A scenario that legitimately drives a real agent binary says so with
  `allowRealAgents` in the catalog, and every run logs which binaries it allowed.
