kind: added
area: automode
change: >
  Auto mode now works out which repository a session runs in by itself. The
  trusted-repo slot fills with the repository the session starts in and every
  remote it pushes to, and the visibility slot with what GitHub says about that
  repository, so the classifier can tell a push home from a push somewhere else
  on a machine nobody has configured. Anything you set yourself wins over both,
  and Settings marks those two rows as filled per session rather than leaving
  them looking forgotten. `attn automode env` shows what a session started in
  the current directory would detect.
