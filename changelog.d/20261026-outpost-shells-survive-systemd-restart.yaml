kind: fixed
area: outposts
change: Shells on an outpost keep running when its daemon restarts, crashes or is updated under the documented systemd unit, which now sets KillMode=process and Restart=on-failure.
symptom: Restarting or stopping the outpost's attn service ended every shell on it, and the home showed them as recoverable.
notes: Existing outposts need KillMode=process and Restart=on-failure added to ~/.config/systemd/user/attn.service, then systemctl --user daemon-reload. Update the binary with install instead of cp, since cp fails while shells run from it.
