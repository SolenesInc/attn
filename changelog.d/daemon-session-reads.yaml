kind: changed
area: daemon
change: >
  An active agent turn runs about half as many database statements, and the
  idle daemon about a third fewer. Session reads come from memory until the
  next write to the session, the job queue stops polling the database while
  no job is due, and a session's last-seen time is written at most every
  five seconds.
notes: >
  Measured in a wire world with five Claude sessions, after the WAL change:
  a 30-second turn went from about 477 to 208 statements and 47,000 to 19,700
  allocations; an idle minute went from 148 to 97 statements.
