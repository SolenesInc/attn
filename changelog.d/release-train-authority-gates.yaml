kind: internal
area: release
change: >
  Make accepted-main workflow dispatch the only release entrypoint and validate
  every promotion candidate's source, baseline, version, and release-only diff
  in CI before it can merge. Require the originating candidate's exact-head app
  receipt before tagging or retrying a release, always load publication from
  protected main, bind app receipts to the protected workflow rather than the
  candidate, prove compiled notes against a digest of the frozen fragments,
  create current-main tags with one atomic compare-and-swap, grant each gate
  only the receipt permissions it uses, pin builds to the validated SHA,
  serialize each tag, let GitHub atomically preserve semantic latest-version
  ordering across overlapping releases, and close the one-time bootstrap route
  when next is created.
