kind: changed
area: settings
change: >
  With Usage analytics on, the local record holds one entry per attn command,
  named by the command as you type it (such as `seed check report`), with its
  exit code and, when the daemon refused it, why: invalid input, a limit, not
  found, the wrong state, someone else tending the seed, or a conflict.
notes: >
  The cli stream changes shape. Records were one per daemon request, named by
  the socket command (`seed_show`, `query`, `state`); they are now one per attn
  invocation, named by the command path with spaces, hooks under their own
  name (`_hook-state`), with `exit_code` and, for a refusal, `refusal`. The
  identity lookup no longer writes a `query` record. Older builds keep sending
  the old shape, so analysis that spans versions must tell the two apart by
  build.
