kind: changed
area: desktops
change: Selecting an agent or a tile is one request to the daemon, and the app shows whatever leaf the daemon made active; a tile no longer borrows an agent, so agent actions wait for an agent, and ⌘[ ⌘] walk tiles as well as agents. Quick clicks, history steps and launches keep the keyboard where the last gesture asked, because the daemon marks each client's own changes.
notes: The "Tile-only desktops" sidebar setting is gone; every desktop is listed.
