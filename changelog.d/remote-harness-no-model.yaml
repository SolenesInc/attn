kind: internal
area: testing
change: >
  The four remote probe scenarios now carry the no-model harness contract
  across SSH. Remote provisioning installs the mock agent and tripwire shims
  without provider credentials; the remote daemon starts with headless tasks
  off and every real agent executable pinned to a shim. Each run copies the
  remote ledger into its artifacts and refuses to pass unless the daemon
  environment proves the shims and switch were active. TR-502 and TR-504 run
  their session panes on the mock agent, while both TR-205 vocabulary variants
  keep using the deterministic probe TUI.
