name: Ensure ghostty-vt artifacts
description: >-
  Put the pinned native libghostty-vt archive, and optionally the browser
  ghostty-vt.wasm, on disk from a cache, so no later build or test step depends
  on a release-asset download.
inputs:
  include-wasm:
    description: Also cache app/vendor/ghostty-vt/ghostty-vt.wasm, for jobs that build or serve the frontend.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    # Fetch and save here rather than leaving it to the build step that needs
    # the artifact: actions/cache only saves post-job on success, and the jobs
    # this runs in fail often enough that the entry would rarely populate.
    - name: Restore native libghostty-vt
      id: native
      uses: actions/cache/restore@v4
      with:
        path: third_party/ghostty-vt
        key: ${{ runner.os }}-${{ runner.arch }}-libghostty-vt-${{ hashFiles('ghostty-vt.pin', 'ghostty-vt-native.lock') }}

    - name: Fetch native libghostty-vt
      if: steps.native.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ github.workspace }}
      run: ./scripts/build-libghostty-vt.sh

    # Concurrent jobs in one run race for this key; the loser logs that the
    # cache already exists and carries on, which is the outcome we want.
    - name: Save native libghostty-vt
      if: steps.native.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: third_party/ghostty-vt
        key: ${{ runner.os }}-${{ runner.arch }}-libghostty-vt-${{ hashFiles('ghostty-vt.pin', 'ghostty-vt-native.lock') }}

    # A separate entry from the native archive on purpose: cache keys are
    # write-once, so one shared key would seal with whatever the first job had.
    - name: Restore browser ghostty-vt.wasm
      id: wasm
      if: inputs.include-wasm == 'true'
      uses: actions/cache/restore@v4
      with:
        path: app/vendor/ghostty-vt
        key: ${{ runner.os }}-ghostty-vt-wasm-${{ hashFiles('ghostty-vt-wasm.lock') }}

    - name: Fetch browser ghostty-vt.wasm
      if: inputs.include-wasm == 'true' && steps.wasm.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ github.workspace }}
      run: bash app/scripts/ensure-ghostty-vt-wasm.sh

    - name: Save browser ghostty-vt.wasm
      if: inputs.include-wasm == 'true' && steps.wasm.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: app/vendor/ghostty-vt
        key: ${{ runner.os }}-ghostty-vt-wasm-${{ hashFiles('ghostty-vt-wasm.lock') }}
