name: Install App acceptance tree
description: Prepare a runner and install a packaged App acceptance tree.

inputs:
  instance:
    description: Non-production instance to install
    required: true
  archive:
    description: Path to the packed application tree
    required: true

runs:
  using: composite
  steps:
    - name: Install Linux desktop dependencies
      if: runner.os == 'Linux'
      uses: ./.github/actions/setup-linux-app-deps
      with:
        role: run

    - name: Install macOS shell dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: brew install fish neovim

    - name: Set up Go and Node.js
      uses: ./.github/actions/setup-toolchains
      with:
        go: 'true'
        go-cache: 'false'
        node: 'true'

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Install harness dependencies
      shell: bash
      run: pnpm --dir app install --frozen-lockfile

    - name: Install the packaged app
      shell: bash
      run: |
        tar -xzf "${{ inputs.archive }}"
        make install-staged INSTANCE="${{ inputs.instance }}"

    - name: Install Linux URL opener
      if: runner.os == 'Linux'
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/attn-harness-bin"
        install -m 0755 app/scripts/real-app-harness/ci-xdg-open "$RUNNER_TEMP/attn-harness-bin/xdg-open"
        echo "$RUNNER_TEMP/attn-harness-bin" >> "$GITHUB_PATH"
