name: Build App acceptance tree
description: Build and pack the application tree used by App acceptance runners.

inputs:
  profile:
    description: Non-production profile to package
    required: true

outputs:
  archive:
    description: Path to the packed application tree
    value: ${{ steps.pack.outputs.archive }}

runs:
  using: composite
  steps:
    - name: Install Linux desktop dependencies
      if: runner.os == 'Linux'
      uses: ./.github/actions/setup-linux-app-deps
      with:
        role: build

    - name: Set up macOS signing tools
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install openssl@3
        echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"

    - name: Set up Go and Node.js
      uses: ./.github/actions/setup-toolchains
      with:
        go: 'true'
        # setup-go's key is content-only, so every Go job shares it and the
        # first one to finish seals it. This action owns its entry below.
        go-cache: 'false'
        node: 'true'

    - name: Resolve Go cache paths
      id: go-cache-paths
      shell: bash
      run: |
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

    - name: Restore Go build cache
      id: go-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ steps.go-cache-paths.outputs.build }}
          ${{ steps.go-cache-paths.outputs.modules }}
        key: go-app-acceptance-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: '1.95.0'

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Read bun pin
      id: bun
      shell: bash
      run: echo "version=$(awk '/^bun / { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

    - name: Set up bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ steps.bun.outputs.version }}

    - name: Ensure ghostty-vt artifacts
      uses: ./.github/actions/cache-ghostty-vt
      with:
        include-wasm: 'true'

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          app/src-tauri
          pty-host

    - name: Build the packaged app
      shell: bash
      env:
        CI: 'true'
        # Acceptance tests what ships, not the unoptimized app-core named profiles get locally.
        ATTN_APP_CARGO_PROFILE: release
        MACOS_CODESIGN_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
      run: make build-app PROFILE="${{ inputs.profile }}"

    - name: Save Go build cache
      if: steps.go-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ steps.go-cache-paths.outputs.build }}
          ${{ steps.go-cache-paths.outputs.modules }}
        key: ${{ steps.go-cache.outputs.cache-primary-key }}

    # tar preserves the executable bit that upload-artifact drops.
    - name: Pack the app tree
      id: pack
      shell: bash
      run: |
        app_name="$(./attn profile resolve --profile "${{ inputs.profile }}" --field appName)"
        case "$RUNNER_OS" in
          Linux) app_tree="app/src-tauri/target/staged/linux-tree/$app_name" ;;
          macOS) app_tree="app/src-tauri/target/staged/$app_name.app" ;;
          *) echo "Unsupported acceptance runner: $RUNNER_OS" >&2; exit 1 ;;
        esac
        archive="$RUNNER_TEMP/app-tree.tar.gz"
        tar -czf "$archive" \
          attn \
          "$app_tree" \
          plugins/attn-pi/node_modules
        echo "archive=$archive" >> "$GITHUB_OUTPUT"
        ls -l "$archive"
