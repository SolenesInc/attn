name: Set up Linux app dependencies
description: Install the packaged app's apt packages from a frozen layer in the GitHub cache. Only a job with build-on-miss may reach the Ubuntu mirror.
inputs:
  build-on-miss:
    description: '"true" for the one job in a run that builds the layer on a cache miss. Every other job fails on a miss.'
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Resolve layer key
      id: key
      shell: bash
      env:
        LIST_HASH: ${{ hashFiles('.github/actions/setup-linux-app-deps/packages.txt', '.github/actions/setup-linux-app-deps/apt-layer.sh') }}
      run: echo "key=apt-layer-$ImageOS-$RUNNER_ARCH-$LIST_HASH" >> "$GITHUB_OUTPUT"

    - name: Restore apt layer
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/apt-layer
        key: ${{ steps.key.outputs.key }}
        fail-on-cache-miss: ${{ inputs.build-on-miss != 'true' }}

    - name: Build apt layer from the Ubuntu mirror
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: ${{ github.action_path }}/apt-layer.sh build "$RUNNER_TEMP/apt-layer"

    - name: Save apt layer
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/apt-layer
        key: ${{ steps.key.outputs.key }}

    - name: Install from apt layer
      shell: bash
      env:
        APT_LAYER_KEY: ${{ steps.key.outputs.key }}
      run: ${{ github.action_path }}/apt-layer.sh install "$RUNNER_TEMP/apt-layer"
