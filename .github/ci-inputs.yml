# CI's job groups and the tracked files none of their jobs read. A group's
# inputs key hashes every other tracked file, so a path belongs here only when
# no job in the group can read it. A '!' entry keeps a path that a broader entry
# leaves out. Files under .github/ are inputs of every group.
#
# CI macOS keeps its own pass records, because a Linux pass does not prove
# macOS. native_macos and pty_upgrade_macos also leave out paths their jobs read
# but that behave the same on Linux, where CI proves them: native_macos keeps
# only the code that compiles or behaves differently on macOS, which
# scripts/native-host-reads holds native code to, and pty_upgrade_macos only
# the PTY paths. The nightly run covers the rest.
every_group:
  - 'website/**'
  - 'docs/internal/**'
  - '.agents/**'
  - '.claude/**'
  - '.codex/**'
  - '.kass/**'
  - 'Casks/**'
  - 'README.md'
  - 'AGENTS.md'
  - 'CLAUDE.md'
  - 'land.toml'
  - 'CONTRIBUTING.md'
  - 'CODE_OF_CONDUCT.md'
  - 'LICENSE'
  - 'CHANGELOG.md'
cli:
  - 'app/**'
  - 'native/**'
  - 'mobile/**'
  - 'cmd/**'
  - 'internal/**'
  - 'pty-host/**'
  - 'sdk/**'
  - 'test/**'
  - 'tools/**'
  - 'docs/**'
  - 'lint/**'
  - '.oxlintrc.json'
generated:
  - 'native/**'
  - 'pty-host/**'
  - 'sdk/**'
  - 'test/**'
  - 'app/**'
  - 'mobile/**'
  - '!mobile/src/homeGateway/**'
  - 'lint/**'
  - '.oxlintrc.json'
