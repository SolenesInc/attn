name: CI

on:
  pull_request:

jobs:
  app-acceptance-macos:
    name: Quick capture proof ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        variant: [old-delayed, new-delayed, new-repeat]
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 120
    env:
      ATTN_INSTANCE: app-acceptance
      ATTN_HARNESS_INSTANCE: app-acceptance
      ATTN_HARNESS_PARK_VISIBLE_PX: '0'
    steps:
      - name: Configure artifact directory
        run: echo "ATTN_REAL_APP_ARTIFACTS_DIR=$RUNNER_TEMP/attn-real-app-harness" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Report runner class
        run: ./scripts/ci-runner-class.sh

      - name: Build the App acceptance tree
        id: build-app
        uses: ./.github/actions/build-app-acceptance
        with:
          instance: ${{ env.ATTN_INSTANCE }}

      - name: Install the App acceptance tree
        uses: ./.github/actions/install-app-acceptance
        with:
          instance: ${{ env.ATTN_INSTANCE }}
          archive: ${{ steps.build-app.outputs.archive }}

      - name: Use the main-branch harness
        if: matrix.variant == 'old-delayed'
        run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- app/scripts/real-app-harness/scenario-quick-capture.mjs app/scripts/real-app-harness/InputDriver.swift

      - name: Run quick capture
        env:
          ATTN_SPIKE_HOTKEY_DELAY_MS: ${{ matrix.variant != 'new-repeat' && '150' || '' }}
          REPEAT: ${{ matrix.variant == 'new-repeat' && '6' || matrix.variant == 'new-delayed' && '3' || '1' }}
        run: |
          pass=0; fail=0
          for i in $(seq 1 "$REPEAT"); do
            if pnpm --dir app run real-app:serial-matrix -- --scenario quick-capture; then pass=$((pass+1)); else fail=$((fail+1)); fi
            grep -rh -A4 "failing step" "$ATTN_REAL_APP_ARTIFACTS_DIR"/quick-capture-*/failure-digest.txt 2>/dev/null | tail -8 || true
            echo "PROOF iteration $i: pass=$pass fail=$fail"
          done
          echo "PROOF ${{ matrix.variant }} delay=${ATTN_SPIKE_HOTKEY_DELAY_MS:-0} pass=$pass fail=$fail of $REPEAT"

      - name: Collect daemon and worker logs
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/attn-real-app-harness
        run: |
          data_dir="$(./attn instance resolve --field dataDir 2>/dev/null || true)"
          mkdir -p "$EVIDENCE_DIR/daemon"
          if [ -d "$data_dir" ]; then
            find "$data_dir" -name '*.log' -exec cp {} "$EVIDENCE_DIR/daemon/" \;
          fi

      - name: Upload macOS acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-capture-proof-${{ matrix.variant }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/attn-real-app-harness/**/*.txt
            ${{ runner.temp }}/attn-real-app-harness/**/*.png
            ${{ runner.temp }}/attn-real-app-harness/**/*.mp4
            ${{ runner.temp }}/attn-real-app-harness/**/*.json
            ${{ runner.temp }}/attn-real-app-harness/**/app-launch-*.log
            ${{ runner.temp }}/attn-real-app-harness/**/native-*.log
            ${{ runner.temp }}/attn-real-app-harness/daemon/*.log

      - name: Clean instance
        if: always()
        run: ./attn instance clean "$ATTN_INSTANCE"

