name: CI

env:
  GH_TOKEN: ${{ github.token }}

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Changes
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    outputs:
      force_all: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/v')) }}
      daemon: ${{ steps.filter.outputs.daemon }}
      generated: ${{ steps.filter.outputs.generated }}
      frontend: ${{ steps.filter.outputs.frontend }}
      tauri: ${{ steps.filter.outputs.tauri }}
      plugins: ${{ steps.filter.outputs.plugins }}
      release_preflight: ${{ steps.filter.outputs.release_preflight }}
      app_acceptance: ${{ steps.filter.outputs.app_acceptance }}
    steps:
      - name: Report API quota
        continue-on-error: true
        run: >-
          gh api rate_limit --jq '.resources.core |
          "GitHub API quota: \(.used)/\(.limit) used, resets \(.reset | todate)"'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # PR API quota is shared by the installation. Full history lets the
          # action use git instead, so an unrelated busy repo cannot break CI.
          token: ''
          filters: |
            daemon:
              - '**/*.go'
              - 'pty-host/**'
              - 'cmd/**'
              - 'internal/**'
              - 'test/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'scripts/**'
              - '.github/workflows/app-acceptance.yml'
              - '.github/workflows/ci.yml'
              - '.tool-versions'
              - '.github/actions/setup-toolchains/**'
            frontend:
              - 'internal/prompts/**'
              - 'cmd/promptgen/**'
              - 'cmd/prompt-editor/**'
              - 'app/src/**'
              - 'app/e2e/**'
              - 'app/scripts/**'
              - 'app/test-harness/**'
              - 'app/public/**'
              - 'app/index.html'
              - 'app/package.json'
              - 'app/pnpm-lock.yaml'
              - 'app/playwright.config.ts'
              - 'app/tsconfig*.json'
              - 'app/vite.config.ts'
              - 'app/lint/**'
              - '.oxlintrc.json'
              - 'plugins/**'
              - 'app/pnpm-workspace.yaml'
              - 'internal/protocol/schema/**'
              - 'ghostty-vt.pin'
              - 'ghostty-vt-wasm.lock'
              - '.github/workflows/ci.yml'
              - '.tool-versions'
              - '.github/actions/setup-toolchains/**'
            # Every input to the type pipeline plus its generated outputs. The
            # outputs are listed so a hand-edit is gated even when no schema
            # moved — that edit is exactly what this catches.
            generated:
              - 'cmd/db-migrations/**'
              - 'internal/store/**'
              - 'scripts/generate-schema/**'
              - 'internal/protocol/schema/**'
              - 'internal/protocol/generated.go'
              - 'internal/protocol/placement_generated.go'
              - 'internal/protocol/protocol_version.go'
              - 'app/src/types/generated.ts'
              - 'app/src/types/protocolVersion.ts'
              - 'scripts/generate-protocol-version.mjs'
              - 'Makefile'
              - '.github/workflows/ci.yml'
              - '.tool-versions'
              - '.github/actions/setup-toolchains/**'
            tauri:
              - 'app/src-tauri/**'
              - 'pty-host/**'
              - 'internal/ptyhost/**'
              - 'scripts/rust-zig-linker.sh'
              - 'scripts/rust-zig-ar.sh'
              - 'ghostty-vt.pin'
              - 'ghostty-vt-native.lock'
              - 'Makefile'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-toolchains/**'
            # The plugin tests read Go sources and fixtures verbatim, and attn-pi
            # speaks the daemon's plugin-driver and conversation-host wire.
            plugins:
              - 'plugins/**'
              - 'internal/prompts/**'
              - 'cmd/promptgen/**'
              - 'scripts/build-bundled-plugins.sh'
              - '.tool-versions'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-toolchains/**'
              - 'internal/automode/environment.go'
              - 'internal/hooks/testdata/pull-request-extraction.json'
              - 'internal/hostsession/**'
              - 'internal/daemon/host_*'
              - 'internal/daemon/plugin_*'
            app_acceptance:
              - 'app/**'
              - 'cmd/**'
              - 'internal/**'
              - 'plugins/**'
              - 'pty-host/**'
              - 'sdk/**'
              - 'test/**'
              - 'scripts/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.tool-versions'
              - 'ghostty-vt.pin'
              - 'ghostty-vt-native.lock'
              - 'ghostty-vt-wasm.lock'
              - '.github/actions/**'
              - '.github/workflows/app-acceptance.yml'
              - '.github/workflows/acceptance-soak.yml'
              - '.github/workflows/ci.yml'
            release_preflight:
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/release-after-acceptance.yml'
              - '.github/workflows/release-health.yml'
              - '.github/workflows/release-preflight.yml'
              - 'Makefile'
              - 'go.mod'
              - 'go.sum'
              - 'cmd/**'
              - 'internal/**'
              - 'pty-host/**'
              - 'ghostty-vt.pin'
              - 'ghostty-vt-native.lock'
              - 'scripts/rust-zig-linker.sh'
              - 'scripts/rust-zig-ar.sh'
              - '.github/actions/setup-toolchains/**'
  changelog:
    name: Changelog
    # Waits on app-acceptance because candidate-gate.sh reads that job's result,
    # and !cancelled() keeps the gate running when the job is filtered out.
    needs: [changes, app-acceptance]
    if: >-
      !cancelled() &&
      (github.event_name == 'pull_request' || needs.changes.outputs.force_all == 'true')
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: ./.github/actions/setup-toolchains
        with:
          go: 'true'

      - name: Gate pull request
        if: github.event_name == 'pull_request'
        run: >-
          ./scripts/changelog-gate.sh
          "${{ github.base_ref }}"
          "${{ github.head_ref }}"
          "${{ github.event.pull_request.head.sha }}"

      - name: Validate pending fragments
        if: github.event_name == 'push'
        run: go run ./cmd/changelog-check

  script-tests:
    name: Script tests, Plugins, and Tauri (ubuntu-24.04)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go and Node.js
        uses: ./.github/actions/setup-toolchains
        with:
          go: 'true'
          node: 'true'

      - name: Script tests
        run: make test-scripts

      # The bundled plugins are compiled by the packaged-app build, which no CI job
      # runs — so a plugin that only builds on a machine with warm node_modules got
      # all the way to a contributor's fresh clone. This stages them the way the app
      # build does, from a checkout that has nothing installed.
      - name: Plugins — set up Linux sandbox
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.plugins == 'true'
        uses: ./.github/actions/setup-linux-sandbox

      - name: Plugins — read bun pin
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.plugins == 'true'
        id: bun
        run: echo "version=$(awk '/^bun / { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Plugins — set up bun
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.plugins == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Plugins — check prompt catalog freshness
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.plugins == 'true'
        run: go run ./cmd/promptgen --check

      - name: Plugins — stage bundled plugins
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.plugins == 'true'
        run: ./scripts/build-bundled-plugins.sh "${RUNNER_TEMP}/bundled-plugins"

      - name: Plugins — test plugins
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.plugins == 'true'
        run: |
          for plugin in plugins/*/; do
            [ -f "${plugin}package.json" ] || continue
            echo ">>> ${plugin}"
            (cd "$plugin" && bun test)
          done

      - name: Tauri (ubuntu-24.04) — report runner class
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.tauri == 'true'
        run: ./scripts/ci-runner-class.sh

      - name: Tauri (ubuntu-24.04) — install Linux webview deps
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.tauri == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libgtk-3-dev libxdo-dev libssl-dev patchelf

      - name: Tauri (ubuntu-24.04) — resolve Go cache paths
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.tauri == 'true'
        id: tauri-go-cache-paths
        run: |
          echo "build=${RUNNER_TEMP}/tauri-go-build-cache" >> "$GITHUB_OUTPUT"
          echo "modules=${RUNNER_TEMP}/tauri-go-mod-cache" >> "$GITHUB_OUTPUT"

      - name: Tauri (ubuntu-24.04) — restore Go build cache
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.tauri == 'true'
        id: tauri-go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.tauri-go-cache-paths.outputs.build }}
            ${{ steps.tauri-go-cache-paths.outputs.modules }}
          key: go-build-github-hosted-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}

      - name: Tauri (ubuntu-24.04) — set up Rust
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.tauri == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: clippy, rustfmt

      - name: Tauri (ubuntu-24.04) — cache Rust build
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.tauri == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            pty-host
          # Saving on PRs too would copy this cache into every branch scope and
          # evict the rest of the repo's entries.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Tauri (ubuntu-24.04) — ensure ghostty-vt artifacts
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.tauri == 'true'
        uses: ./.github/actions/cache-ghostty-vt

      - name: Tauri (ubuntu-24.04) — build attn binary
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.tauri == 'true'
        working-directory: app/src-tauri
        env:
          GOCACHE: ${{ steps.tauri-go-cache-paths.outputs.build }}
          GOMODCACHE: ${{ steps.tauri-go-cache-paths.outputs.modules }}
        run: |
          cd ../..
          ./scripts/build-libghostty-vt.sh
          go build -o /tmp/attn ./cmd/attn
          make build-pty-host
          target_triple="$(rustc -vV | awk '/host:/ {print $2}')"
          mkdir -p app/src-tauri/binaries
          cp /tmp/attn "app/src-tauri/binaries/attn-${target_triple}"
          cp pty-host/target/release/attn-pty-host "app/src-tauri/binaries/attn-pty-host-${target_triple}"
          cd app/src-tauri

      - name: Tauri (ubuntu-24.04) — PTY host fmt, clippy, and test
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.tauri == 'true'
        working-directory: app/src-tauri
        run: |
          cd ../..
          cargo fmt --manifest-path pty-host/Cargo.toml -- --check
          cargo clippy --manifest-path pty-host/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path pty-host/Cargo.toml

      - name: Tauri (ubuntu-24.04) — cargo fmt
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.tauri == 'true'
        working-directory: app/src-tauri
        run: cargo fmt -- --check

      # The pre-commit hook has always run clippy; CI never did, so a lint that
      # only the hook rejects reached main and blocked every local commit. Same
      # pinned toolchain on both sides, so they cannot disagree.
      - name: Tauri (ubuntu-24.04) — cargo clippy
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.tauri == 'true'
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tauri (ubuntu-24.04) — cargo test
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.tauri == 'true'
        working-directory: app/src-tauri
        run: cargo test

      - name: Tauri (ubuntu-24.04) — save Go build cache
        if: >-
          always() &&
          (needs.changes.outputs.force_all == 'true' || needs.changes.outputs.tauri == 'true') &&
          steps.tauri-go-cache.outcome == 'success' &&
          steps.tauri-go-cache.outputs.cache-hit != 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.tauri-go-cache-paths.outputs.build }}
            ${{ steps.tauri-go-cache-paths.outputs.modules }}
          key: ${{ steps.tauri-go-cache.outputs.cache-primary-key }}

  # generated.go and generated.ts are compiled from internal/protocol/schema, and
  # nothing was checking that the committed copies match. The other jobs cannot:
  # the generated TS interfaces carry an `any` index signature, so `tsc` accepts a
  # file with a wire field deleted from it — measured, exit 0. This regenerates
  # from the schema and fails on any difference.
  generated-pty-daemon:
    name: Generated types, PTY upgrade (ubuntu-24.04), and Daemon
    needs: changes
    if: >-
      needs.changes.outputs.force_all == 'true' ||
      needs.changes.outputs.generated == 'true' ||
      needs.changes.outputs.daemon == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generated types — set up Go and Node.js
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.generated == 'true'
        uses: ./.github/actions/setup-toolchains
        with:
          go: 'true'
          node: 'true'

      - name: Daemon — set up Go
        if: >-
          (needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true') &&
          needs.changes.outputs.force_all != 'true' &&
          needs.changes.outputs.generated != 'true'
        uses: ./.github/actions/setup-toolchains
        with:
          go: 'true'
          go-cache: 'false'

      - name: PTY upgrade (ubuntu-24.04) and Daemon — resolve Go cache paths
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
        id: go-cache-paths
        run: |
          echo "build=${RUNNER_TEMP}/go-build-cache" >> "$GITHUB_OUTPUT"
          echo "modules=${RUNNER_TEMP}/go-mod-cache" >> "$GITHUB_OUTPUT"

      - name: PTY upgrade (ubuntu-24.04) and Daemon — restore Go build cache
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.build }}
            ${{ steps.go-cache-paths.outputs.modules }}
          key: go-build-github-hosted-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}

      - name: Daemon — report runner class
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
        run: ./scripts/ci-runner-class.sh

      - name: Daemon — ensure ghostty-vt artifacts
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
        uses: ./.github/actions/cache-ghostty-vt

      # internal/ghosttyvt links libghostty-vt via cgo on Linux; fetch the
      # prebuilt native archive (download-first, no zig) so vet/build/test link.
      - name: Daemon — ensure native VT library
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
        run: ./scripts/build-libghostty-vt.sh

      - name: Daemon — read bun pin
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
        id: bun
        run: echo "version=$(awk '/^bun / { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      # Bundled Pi and plugin runtime checks need the pinned Bun toolchain.
      - name: Daemon — set up bun
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Daemon — check formatting
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files are not formatted. Run 'gofmt -w .'"
            gofmt -d .
            exit 1
          fi

      - name: Daemon — vet
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
        env:
          GOCACHE: ${{ steps.go-cache-paths.outputs.build }}
          GOMODCACHE: ${{ steps.go-cache-paths.outputs.modules }}
        run: go vet ./...

      - name: Daemon — lint
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
        env:
          GOCACHE: ${{ steps.go-cache-paths.outputs.build }}
          GOMODCACHE: ${{ steps.go-cache-paths.outputs.modules }}
        run: make lint-go

      - name: Daemon — start ClickHouse for the attn-ingest tests
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
        run: echo "ATTN_TEST_CLICKHOUSE_URL=$(./scripts/ingest-clickhouse.sh start)" >> "$GITHUB_ENV"

      - name: Daemon — test
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
        env:
          GOCACHE: ${{ steps.go-cache-paths.outputs.build }}
          GOMODCACHE: ${{ steps.go-cache-paths.outputs.modules }}
        run: ./scripts/test-go.sh

      - name: Daemon — check prompt catalog and scenarios
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
        env:
          GOCACHE: ${{ steps.go-cache-paths.outputs.build }}
          GOMODCACHE: ${{ steps.go-cache-paths.outputs.modules }}
        run: |
          make check-prompts
          go run ./cmd/prompt-editor check

      - name: PTY upgrade (ubuntu-24.04) — report runner class
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
        run: ./scripts/ci-runner-class.sh

      - name: PTY upgrade (ubuntu-24.04) — set up Rust
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: PTY upgrade (ubuntu-24.04) — ensure ghostty-vt artifacts
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
        uses: ./.github/actions/cache-ghostty-vt

      - name: PTY upgrade (ubuntu-24.04) — build host and native terminal library
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
        run: make build-pty-host

      - name: PTY upgrade (ubuntu-24.04) — install listener discovery tool
        if: >-
          (needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true') &&
          runner.os == 'Linux'
        run: command -v lsof >/dev/null || (sudo apt-get update && sudo apt-get install -y lsof)

      - name: PTY upgrade (ubuntu-24.04) — verify old daemon and mixed host generations
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
        env:
          GOCACHE: ${{ steps.go-cache-paths.outputs.build }}
          GOMODCACHE: ${{ steps.go-cache-paths.outputs.modules }}
        run: bash scripts/test-pty-upgrade.sh

      - name: PTY upgrade (ubuntu-24.04) — verify shared host protocol and lifecycle
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
        env:
          GOCACHE: ${{ steps.go-cache-paths.outputs.build }}
          GOMODCACHE: ${{ steps.go-cache-paths.outputs.modules }}
        run: ATTN_TEST_PTY_HOST="$PWD/pty-host/target/release/attn-pty-host" go test -race ./internal/ptybackend -run '^Test(SharedHost_|MigratingHost_)' -count=1

      - name: PTY upgrade (ubuntu-24.04) — verify instance cleanup with live host generations
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
        env:
          GOCACHE: ${{ steps.go-cache-paths.outputs.build }}
          GOMODCACHE: ${{ steps.go-cache-paths.outputs.modules }}
        run: ATTN_TEST_PTY_HOST="$PWD/pty-host/target/release/attn-pty-host" go test -race ./cmd/attn -run '^(TestInstanceClean.*SharedHost|TestBufferedEscapeSequencesKeepOutputEventsBoundedAndTheScreenExact|TestAProgramInAShellTile|TestAgentsUseTheChosenLaunchMode|TestTheLaunchExperimentChanges|TestRestartNowLetsARunningTurnFinish|TestASharedCodexTerminalOpenedAfterADaemonRestart)' -count=1

      - name: Generated types — install pnpm
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.generated == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # The TypeSpec compiler the recipe invokes as `pnpm exec tsp`.
      - name: Generated types — install schema toolchain
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.generated == 'true'
        working-directory: internal/protocol/schema
        run: pnpm install --frozen-lockfile

      - name: Generated types — check migration history
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.generated == 'true'
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make check-migrations

      - name: Generated types — regenerate and diff
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.generated == 'true'
        run: make check-types check-schema

      - name: PTY upgrade (ubuntu-24.04) and Daemon — save Go build cache
        if: >-
          always() &&
          (needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true') &&
          steps.go-cache.outcome == 'success' &&
          steps.go-cache.outputs.cache-hit != 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.build }}
            ${{ steps.go-cache-paths.outputs.modules }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  frontend:
    name: Frontend and Frontend E2E
    needs: changes
    if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go and Node.js
        uses: ./.github/actions/setup-toolchains
        with:
          go: 'true'
          node: 'true'

      - name: Frontend — check generated prompt catalogs
        working-directory: .
        run: go run ./cmd/promptgen --check

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Frontend — type check
        working-directory: app
        run: pnpm run build

      - name: Frontend — lint
        working-directory: app
        run: pnpm run lint

      - name: Frontend — test
        working-directory: app
        run: pnpm test

      - name: Frontend — test prompt editor helpers
        working-directory: .
        run: |
          node --test cmd/prompt-editor/test/compare.test.mjs
          app/node_modules/.bin/oxlint --deny-warnings cmd/prompt-editor/web cmd/prompt-editor/test

      - name: Frontend E2E — ensure ghostty-vt artifacts
        uses: ./.github/actions/cache-ghostty-vt
        with:
          include-wasm: 'true'

      - name: Frontend E2E — build attn binary
        working-directory: app
        run: |
          cd ..
          ./scripts/build-libghostty-vt.sh
          go build -o /tmp/attn ./cmd/attn

      - name: Frontend E2E — get Playwright version
        id: playwright-version
        working-directory: app
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Frontend E2E — cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}

      # `install --with-deps` hung past 25 minutes on 2026-09-26 without saying
      # whether apt or the download stalled; bounded steps name the one that does.
      - name: Frontend E2E — bound apt network waits
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-timeouts

      # The suite only runs chromium (no projects configured), so skip the
      # firefox/webkit downloads.
      - name: Frontend E2E — install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        working-directory: app
        run: pnpm exec playwright install chromium

      - name: Frontend E2E — install Playwright OS deps
        timeout-minutes: 10
        working-directory: app
        run: pnpm exec playwright install-deps chromium

      - name: Frontend E2E (1/3)
        working-directory: app
        env:
          ATTN_E2E_BIN: /tmp/attn
        run: pnpm exec playwright test --shard=1/3

      - name: Test prompt editor in Chromium
        working-directory: .
        run: |
          node cmd/prompt-editor/test/browser.mjs
          node cmd/prompt-editor/test/collaboration.mjs

      - name: Frontend E2E (2/3)
        working-directory: app
        env:
          ATTN_E2E_BIN: /tmp/attn
        run: pnpm exec playwright test --shard=2/3

      - name: Frontend E2E (3/3)
        working-directory: app
        env:
          ATTN_E2E_BIN: /tmp/attn
        run: pnpm exec playwright test --shard=3/3

  pty-tauri-macos:
    name: PTY upgrade and Tauri (macos-14)
    needs: changes
    if: >-
      needs.changes.outputs.force_all == 'true' ||
      needs.changes.outputs.daemon == 'true' ||
      needs.changes.outputs.tauri == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: ./.github/actions/setup-toolchains
        with:
          go: 'true'
          go-cache: 'false'

      - name: Resolve Go cache paths
        id: go-cache-paths
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore Go build cache
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.build }}
            ${{ steps.go-cache-paths.outputs.modules }}
          key: go-build-github-hosted-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}

      - name: PTY upgrade (macos-14) — report runner class
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
        run: ./scripts/ci-runner-class.sh

      - name: PTY upgrade (macos-14) — set up Rust
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: PTY upgrade (macos-14) — ensure ghostty-vt artifacts
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
        uses: ./.github/actions/cache-ghostty-vt

      - name: PTY upgrade (macos-14) — build host and native terminal library
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/pty-upgrade-target
        run: make build-pty-host

      - name: PTY upgrade (macos-14) — verify old daemon and mixed host generations
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
        env:
          ATTN_TEST_PTY_HOST: ${{ runner.temp }}/pty-upgrade-target/release/attn-pty-host
        run: bash scripts/test-pty-upgrade.sh

      - name: PTY upgrade (macos-14) — verify shared host protocol and lifecycle
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
        env:
          ATTN_TEST_PTY_HOST: ${{ runner.temp }}/pty-upgrade-target/release/attn-pty-host
        run: go test -race ./internal/ptybackend -run '^Test(SharedHost_|MigratingHost_)' -count=1

      - name: PTY upgrade (macos-14) — verify instance cleanup with live host generations
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
        env:
          ATTN_TEST_PTY_HOST: ${{ runner.temp }}/pty-upgrade-target/release/attn-pty-host
        run: go test -race ./cmd/attn -run '^(TestInstanceClean.*SharedHost|TestBufferedEscapeSequencesKeepOutputEventsBoundedAndTheScreenExact|TestAProgramInAShellTile|TestAgentsUseTheChosenLaunchMode|TestTheLaunchExperimentChanges|TestRestartNowLetsARunningTurnFinish|TestASharedCodexTerminalOpenedAfterADaemonRestart)' -count=1

      - name: Tauri (macos-14) — report runner class
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.tauri == 'true'
        run: ./scripts/ci-runner-class.sh

      - name: Tauri (macos-14) — set up Rust
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.tauri == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: clippy, rustfmt

      - name: Tauri (macos-14) — cache Rust build
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.tauri == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            pty-host
          # Saving on PRs too would copy this cache into every branch scope and
          # evict the rest of the repo's entries.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Tauri (macos-14) — ensure ghostty-vt artifacts
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.tauri == 'true'
        uses: ./.github/actions/cache-ghostty-vt

      - name: Tauri (macos-14) — build attn binary
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.tauri == 'true'
        working-directory: app/src-tauri
        run: |
          cd ../..
          ./scripts/build-libghostty-vt.sh
          go build -o /tmp/attn ./cmd/attn
          make build-pty-host
          target_triple="$(rustc -vV | awk '/host:/ {print $2}')"
          mkdir -p app/src-tauri/binaries
          cp /tmp/attn "app/src-tauri/binaries/attn-${target_triple}"
          cp pty-host/target/release/attn-pty-host "app/src-tauri/binaries/attn-pty-host-${target_triple}"
          cd app/src-tauri

      - name: Tauri (macos-14) — PTY host fmt, clippy, and test
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.tauri == 'true'
        working-directory: app/src-tauri
        run: |
          cd ../..
          cargo fmt --manifest-path pty-host/Cargo.toml -- --check
          cargo clippy --manifest-path pty-host/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path pty-host/Cargo.toml

      - name: Tauri (macos-14) — cargo fmt
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.tauri == 'true'
        working-directory: app/src-tauri
        run: cargo fmt -- --check

      # The pre-commit hook has always run clippy; CI never did, so a lint that
      # only the hook rejects reached main and blocked every local commit. Same
      # pinned toolchain on both sides, so they cannot disagree.
      - name: Tauri (macos-14) — cargo clippy
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.tauri == 'true'
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tauri (macos-14) — cargo test
        if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.tauri == 'true'
        working-directory: app/src-tauri
        run: cargo test

      - name: Save Go build cache
        if: >-
          always() && steps.go-cache.outcome == 'success' &&
          steps.go-cache.outputs.cache-hit != 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.build }}
            ${{ steps.go-cache-paths.outputs.modules }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  app-acceptance-build:
    name: App acceptance build
    needs: changes
    if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.app_acceptance == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    # 202s on run 34060183460; 30m leaves room for a cold Rust cache.
    timeout-minutes: 30
    env:
      ATTN_INSTANCE: app-acceptance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Report runner class
        run: ./scripts/ci-runner-class.sh

      - name: Build the App acceptance tree
        id: build-app
        uses: ./.github/actions/build-app-acceptance
        with:
          instance: ${{ env.ATTN_INSTANCE }}

      - name: Upload the app tree
        uses: actions/upload-artifact@v4
        with:
          name: app-acceptance-tree
          path: ${{ steps.build-app.outputs.archive }}
          retention-days: 1
          compression-level: 0
          overwrite: true

  app-acceptance-shard:
    name: App acceptance shard ${{ matrix.shard }}/5
    needs: [changes, app-acceptance-build]
    if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.app_acceptance == 'true'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    # No concurrency group: a shared one cancels unrelated waiting checks.
    runs-on: ubuntu-24.04
    # Heaviest shard 199.4s of a 785.7s matrix (run 34067680122); 40m is slack.
    timeout-minutes: 40
    env:
      ATTN_INSTANCE: app-acceptance
      ATTN_HARNESS_INSTANCE: app-acceptance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Report runner class
        run: ./scripts/ci-runner-class.sh

      - name: Download the app tree
        uses: actions/download-artifact@v4
        with:
          name: app-acceptance-tree
          path: ${{ runner.temp }}

      - name: Install the App acceptance tree
        uses: ./.github/actions/install-app-acceptance
        with:
          instance: ${{ env.ATTN_INSTANCE }}
          archive: ${{ runner.temp }}/app-tree.tar.gz

      - name: Run serial matrix shard
        id: matrix
        continue-on-error: true
        env:
          ATTN_REAL_APP_ARTIFACTS_DIR: ${{ runner.temp }}/attn-real-app-harness
        run: >-
          xvfb-run -a -s '-noreset -screen 0 1600x1000x24'
          pnpm --dir app run real-app:serial-matrix -- --shard ${{ matrix.shard }}/5

      - name: Collect daemon and worker logs
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/attn-real-app-harness
        run: |
          data_dir="$(./attn instance resolve --field dataDir 2>/dev/null || true)"
          mkdir -p "$EVIDENCE_DIR/daemon"
          if [ -f "$data_dir/daemon.log" ]; then
            cp "$data_dir/daemon.log" "$EVIDENCE_DIR/daemon/daemon.log"
          fi
          if [ -d "$data_dir/workers" ]; then
            find "$data_dir/workers" -name '*.log' -exec cp {} "$EVIDENCE_DIR/daemon/" \;
          fi
          if [ -d "$data_dir/pty-hosts" ]; then
            find "$data_dir/pty-hosts" -name '*.log' -exec cp {} "$EVIDENCE_DIR/daemon/" \;
          fi
          ls "$EVIDENCE_DIR/daemon"

      - name: Upload app acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-acceptance-evidence-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/attn-real-app-harness/matrix-digest.txt
            ${{ runner.temp }}/attn-real-app-harness/**/*.txt
            ${{ runner.temp }}/attn-real-app-harness/**/*.png
            ${{ runner.temp }}/attn-real-app-harness/**/*.json
            ${{ runner.temp }}/attn-real-app-harness/**/app-launch-*.log
            ${{ runner.temp }}/attn-real-app-harness/**/native-*.log
            ${{ runner.temp }}/attn-real-app-harness/**/fixture.log
            ${{ runner.temp }}/attn-real-app-harness/**/other-fixture.log
            ${{ runner.temp }}/attn-real-app-harness/**/*idle*.txt
            ${{ runner.temp }}/attn-real-app-harness/daemon/*.log

      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-acceptance-result-shard-${{ matrix.shard }}
          if-no-files-found: error
          path: ${{ runner.temp }}/attn-real-app-harness/last-matrix.json
          overwrite: true

      - name: Clean instance
        if: always()
        run: ./attn instance clean "$ATTN_INSTANCE"

      - name: Report the shard verdict
        if: always()
        env:
          MATRIX_OUTCOME: ${{ steps.matrix.outcome }}
        run: |
          if [ "$MATRIX_OUTCOME" = success ]; then
            exit 0
          fi
          echo "shard ${{ matrix.shard }}/5: the serial matrix is $MATRIX_OUTCOME;" \
            "the App acceptance job aggregates every shard's digest" >&2
          exit 1

  app-acceptance:
    name: App acceptance
    needs: [changes, app-acceptance-build, app-acceptance-shard, app-acceptance-macos]
    # !cancelled() so a red shard still reaches the aggregate instead of skipping.
    if: >-
      !cancelled() &&
      (needs.changes.outputs.force_all == 'true' || needs.changes.outputs.app_acceptance == 'true')
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: ./.github/actions/setup-toolchains
        with:
          node: 'true'

      - name: Download shard results
        if: needs.app-acceptance-build.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: app-acceptance-result-shard-*
          path: ${{ runner.temp }}/shard-results

      - name: Aggregate the shard digests
        id: matrix
        if: needs.app-acceptance-build.result == 'success'
        continue-on-error: true
        run: >-
          node app/scripts/real-app-harness/aggregate-shards.mjs
          --results-dir "$RUNNER_TEMP/shard-results" --shard-count 5
          --out "$RUNNER_TEMP/matrix-digest.txt"

      - name: Upload the aggregated digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-acceptance-digest-${{ github.run_attempt }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/matrix-digest.txt

      - name: Gate app acceptance
        if: always()
        env:
          BUILD_RESULT: ${{ needs.app-acceptance-build.result }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MATRIX_OUTCOME: ${{ steps.matrix.outcome }}
          SHARD_RESULT: ${{ needs.app-acceptance-shard.result }}
          MACOS_RESULT: ${{ needs.app-acceptance-macos.result }}
        run: |
          if [ "$MACOS_RESULT" != success ]; then
            echo "app acceptance: macOS native clipboard and keyboard verification is $MACOS_RESULT for $HEAD_SHA" >&2
            exit 1
          fi
          if [ "$MATRIX_OUTCOME" = success ] && [ "$SHARD_RESULT" = success ]; then
            echo "app acceptance: Linux serial matrix and macOS native clipboard and keyboard are green for $HEAD_SHA"
            exit 0
          fi
          if [[ "$EVENT_NAME/$HEAD_BRANCH" =~ ^pull_request/release/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || \
            [ "$EVENT_NAME/$GITHUB_REF" = push/refs/heads/main ]; then
            ./scripts/workflow-job-gate.sh \
              app-acceptance.yml "$HEAD_SHA" workflow_dispatch main 'App acceptance'
            echo "app acceptance: manual receipt covers $HEAD_SHA"
            exit 0
          fi
          if [ "$BUILD_RESULT" != success ]; then
            echo "app acceptance: the app tree failed to build for $HEAD_SHA ($BUILD_RESULT);" \
              "no shard ran, so this is setup or build, not a scenario verdict" >&2
          elif [ -z "$MATRIX_OUTCOME" ]; then
            echo "app acceptance: the aggregate never ran for $HEAD_SHA;" \
              "this is setup, not a scenario verdict" >&2
          elif [ "$MATRIX_OUTCOME" = success ]; then
            echo "app acceptance: every scenario passed for $HEAD_SHA, but a shard job ended" \
              "$SHARD_RESULT; open the shard jobs, this is not a scenario verdict" >&2
          else
            echo "app acceptance: the aggregated Linux serial matrix is $MATRIX_OUTCOME for $HEAD_SHA" >&2
          fi
          exit 1

  app-acceptance-macos:
    name: App acceptance macOS
    needs: changes
    if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.app_acceptance == 'true'
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 40
    env:
      ATTN_INSTANCE: app-acceptance
      ATTN_HARNESS_INSTANCE: app-acceptance
      ATTN_HARNESS_PARK_VISIBLE_PX: '0'
    steps:
      - name: Configure artifact directory
        run: echo "ATTN_REAL_APP_ARTIFACTS_DIR=$RUNNER_TEMP/attn-real-app-harness" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Report runner class
        run: ./scripts/ci-runner-class.sh

      - name: Build the App acceptance tree
        id: build-app
        uses: ./.github/actions/build-app-acceptance
        with:
          instance: ${{ env.ATTN_INSTANCE }}

      - name: Install the App acceptance tree
        uses: ./.github/actions/install-app-acceptance
        with:
          instance: ${{ env.ATTN_INSTANCE }}
          archive: ${{ steps.build-app.outputs.archive }}

      - name: Run native clipboard, keyboard and capture scenarios
        run: pnpm --dir app run real-app:serial-matrix -- --scenario terminal-block-copy --scenario terminal-input --scenario quick-capture

      - name: Require executed macOS coverage
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const { results } = JSON.parse(fs.readFileSync(`${process.env.ATTN_REAL_APP_ARTIFACTS_DIR}/last-matrix.json`, 'utf8'));
          assert.deepEqual(results.map(({ id, code, skipped = false }) => ({ id, code, skipped })), [
            { id: 'terminal-block-copy', code: 0, skipped: false },
            { id: 'terminal-input', code: 0, skipped: false },
            { id: 'quick-capture', code: 0, skipped: false },
          ]);
          NODE

      - name: Collect daemon and worker logs
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/attn-real-app-harness
        run: |
          data_dir="$(./attn instance resolve --field dataDir 2>/dev/null || true)"
          mkdir -p "$EVIDENCE_DIR/daemon"
          if [ -d "$data_dir" ]; then
            find "$data_dir" -name '*.log' -exec cp {} "$EVIDENCE_DIR/daemon/" \;
          fi

      - name: Upload macOS acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-acceptance-macos-evidence-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/attn-real-app-harness/**/*.txt
            ${{ runner.temp }}/attn-real-app-harness/**/*.png
            ${{ runner.temp }}/attn-real-app-harness/**/*.mp4
            ${{ runner.temp }}/attn-real-app-harness/**/*.json
            ${{ runner.temp }}/attn-real-app-harness/**/app-launch-*.log
            ${{ runner.temp }}/attn-real-app-harness/**/native-*.log
            ${{ runner.temp }}/attn-real-app-harness/daemon/*.log

      - name: Clean instance
        if: always()
        run: ./attn instance clean "$ATTN_INSTANCE"

  release-preflight:
    name: Release preflight
    needs: changes
    if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.release_preflight == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/release-preflight.yml

  pr-gate:
    name: PR gate
    if: always() && github.event_name == 'pull_request'
    needs:
      - changes
      - changelog
      - script-tests
      - generated-pty-daemon
      - frontend
      - pty-tauri-macos
      - app-acceptance-build
      - app-acceptance-shard
      - app-acceptance-macos
      - app-acceptance
      - release-preflight
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Report API quota
        continue-on-error: true
        run: >-
          gh api rate_limit --jq '.resources.core |
          "GitHub API quota: \(.used)/\(.limit) used, resets \(.reset | todate)"'

      - name: Aggregate checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS_JSON"

  acceptance:
    name: Acceptance
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - changes
      - changelog
      - script-tests
      - generated-pty-daemon
      - frontend
      - pty-tauri-macos
      - app-acceptance-build
      - app-acceptance-shard
      - app-acceptance-macos
      - app-acceptance
      - release-preflight
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate exact-SHA acceptance
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS_JSON"

  branch-health:
    name: Report branch health
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: acceptance
    permissions:
      contents: read
      issues: write
    concurrency:
      group: branch-health-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Update branch-health issue
        id: branch-health-issue
        continue-on-error: true
        env:
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
          BRANCH_HEALTH_ASSIGNEE: victorarias
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          ./scripts/ci-branch-health.sh "$ACCEPTANCE_RESULT"
          "${{ github.ref_name }}" "${{ github.sha }}" "$RUN_URL"

      - name: Report issue-update failure
        if: steps.branch-health-issue.outcome == 'failure'
        run: >-
          echo "::warning title=Branch health reporting failed::Acceptance is
          authoritative; the branch-health issue could not be updated."
