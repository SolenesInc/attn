name: CI

env:
  GH_TOKEN: ${{ github.token }}

on:
  push:
    branches: [main, next, 'epic/**']
  pull_request:
    branches: [main, next, 'epic/**']

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Changes
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    outputs:
      force_all: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')) || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
      daemon: ${{ steps.filter.outputs.daemon }}
      generated: ${{ steps.filter.outputs.generated }}
      frontend: ${{ steps.filter.outputs.frontend }}
      tauri: ${{ steps.filter.outputs.tauri }}
      plugins: ${{ steps.filter.outputs.plugins }}
      release_preflight: ${{ steps.filter.outputs.release_preflight }}
      harness: ${{ steps.filter.outputs.harness }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # PR API quota is shared by the installation. Full history lets the
          # action use git instead, so an unrelated busy repo cannot break CI.
          token: ''
          filters: |
            daemon:
              - '**/*.go'
              - 'pty-host/**'
              - 'cmd/**'
              - 'internal/**'
              - 'test/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'scripts/**'
              - '.github/workflows/app-acceptance.yml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'internal/prompts/**'
              - 'cmd/promptgen/**'
              - 'cmd/prompt-editor/**'
              - 'app/src/**'
              - 'app/e2e/**'
              - 'app/scripts/**'
              - 'app/test-harness/**'
              - 'app/public/**'
              - 'app/index.html'
              - 'app/package.json'
              - 'app/pnpm-lock.yaml'
              - 'app/playwright.config.ts'
              - 'app/tsconfig*.json'
              - 'app/vite.config.ts'
              - 'app/lint/**'
              - '.oxlintrc.json'
              - 'plugins/**'
              - 'app/pnpm-workspace.yaml'
              # The app SDK is a workspace package of the frontend and the source
              # its committed declarations are emitted from, so an edit to either
              # has to reach the typecheck and the drift check.
              - 'sdk/attn-app/**'
              - 'internal/appbuild/sdkdist/**'
              - 'internal/protocol/schema/**'
              - '.github/workflows/ci.yml'
            # Every input to the type pipeline plus both of its outputs. The
            # outputs are listed so a hand-edit is gated even when no schema
            # moved — that edit is exactly what this catches.
            generated:
              - 'internal/protocol/schema/**'
              - 'internal/protocol/generated.go'
              - 'app/src/types/generated.ts'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            tauri:
              - 'app/src-tauri/**'
              - 'pty-host/**'
              - 'internal/ptyhost/**'
              - 'scripts/rust-zig-linker.sh'
              - 'scripts/rust-zig-ar.sh'
              - 'ghostty-vt.pin'
              - 'ghostty-vt-native.lock'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            # The plugin tests read Go sources and fixtures verbatim, and attn-pi
            # speaks the daemon's plugin-driver and conversation-host wire.
            plugins:
              - 'plugins/**'
              - 'internal/prompts/**'
              - 'cmd/promptgen/**'
              - 'scripts/build-bundled-plugins.sh'
              - '.tool-versions'
              - '.github/workflows/ci.yml'
              - 'internal/automode/environment.go'
              - 'internal/hooks/testdata/pull-request-extraction.json'
              - 'internal/hostsession/**'
              - 'internal/daemon/host_*'
              - 'internal/daemon/plugin_*'
            harness:
              - 'app/scripts/real-app-harness/**'
              - 'app/src-tauri/**'
              - 'apphost/**'
              - 'scripts/build-app-runtime-host.sh'
              - 'scripts/install-app-tree.sh'
              - '.github/actions/**'
              - '.github/workflows/app-acceptance.yml'
              - '.github/workflows/ci.yml'
            release_preflight:
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/release-after-acceptance.yml'
              - '.github/workflows/release-health.yml'
              - '.github/workflows/release-preflight.yml'
              - 'Makefile'
              - 'go.mod'
              - 'go.sum'
              - 'cmd/**'
              - 'internal/**'
              - 'apphost/**'
              - 'pty-host/**'
              - 'ghostty-vt.pin'
              - 'ghostty-vt-native.lock'
              - 'scripts/rust-zig-linker.sh'
              - 'scripts/rust-zig-ar.sh'
              - 'scripts/build-app-runtime-host.sh'
  changelog:
    name: Changelog
    # Waits on app-acceptance because candidate-gate.sh reads that job's result,
    # and !cancelled() keeps the gate running when the job is filtered out.
    needs: [changes, app-acceptance]
    if: >-
      !cancelled() &&
      (github.event_name == 'pull_request' || needs.changes.outputs.force_all == 'true')
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Gate pull request
        if: github.event_name == 'pull_request'
        run: >-
          ./scripts/changelog-gate.sh
          "${{ github.base_ref }}"
          "${{ github.head_ref }}"
          "${{ github.event.pull_request.head.sha }}"

      - name: Validate pending fragments
        if: github.event_name == 'push'
        run: go run ./cmd/changelog-check

  main-route:
    name: Main route
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch route
        run: >-
          ./scripts/main-route.sh "${{ github.event_name }}"
          "${{ github.base_ref }}" "${{ github.head_ref }}"

  # generated.go and generated.ts are compiled from internal/protocol/schema, and
  # nothing was checking that the committed copies match. The other jobs cannot:
  # the generated TS interfaces carry an `any` index signature, so `tsc` accepts a
  # file with a wire field deleted from it — measured, exit 0. This regenerates
  # from the schema and fails on any difference.
  generated-types:
    name: Generated types
    needs: changes
    if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.generated == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # The TypeSpec compiler the recipe invokes as `pnpm exec tsp`.
      - name: Install schema toolchain
        working-directory: internal/protocol/schema
        run: pnpm install --frozen-lockfile

      - name: Regenerate and diff
        run: make check-types

  backend:
    name: Daemon
    needs: changes
    if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      # Blacksmith's /etc/profile.d resets HOME for the runner user, which skips the
      # login-shell overlay the shell integration tests launch bash with.
      - name: Keep login shells from resetting HOME
        run: sudo sed -i '/export HOME="\$RUNNER_HOME"/d' /etc/profile.d/blacksmith.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Ensure ghostty-vt artifacts
        uses: ./.github/actions/cache-ghostty-vt

      # internal/ghosttyvt links libghostty-vt via cgo on Linux; fetch the
      # prebuilt native archive (download-first, no zig) so vet/build/test link.
      - name: Ensure native VT library
        run: ./scripts/build-libghostty-vt.sh

      - name: Read bun pin
        id: bun
        run: echo "version=$(awk '/^bun / { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      # internal/appbuild typechecks and bundles an app with the real toolchain.
      # Without bun those tests skip themselves, so CI would go green on a
      # pipeline it never ran.
      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files are not formatted. Run 'gofmt -w .'"
            gofmt -d .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go tool staticcheck ./...

      - name: Lint comments
        run: go run ./cmd/commentlint ./...

      - name: Test
        run: ./scripts/test-go.sh

      - name: Check prompt catalog and scenarios
        run: |
          make check-prompts
          go run ./cmd/prompt-editor check

      # Repository Claude Code hooks are shell, so the Go suite cannot see them.
      - name: Test repository hooks
        run: bash ./scripts/claude/attn-profile-nudge_test.sh

      - name: Test repository scripts
        run: make test-scripts

  pty-compatibility:
    name: PTY upgrade (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.daemon == 'true'
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            runs_on: macos-14
          - os: ubuntu-24.04
            runs_on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Ensure ghostty-vt artifacts
        uses: ./.github/actions/cache-ghostty-vt
      - name: Build host and native terminal library
        run: make build-pty-host
      - name: Verify old daemon and mixed host generations
        run: bash scripts/test-pty-upgrade.sh
      - name: Verify shared host protocol and lifecycle
        run: ATTN_TEST_PTY_HOST="$PWD/pty-host/target/release/attn-pty-host" go test -race ./internal/ptybackend -run '^Test(SharedHost_|MigratingHost_)' -count=1
      - name: Verify profile cleanup with live host generations
        run: ATTN_TEST_PTY_HOST="$PWD/pty-host/target/release/attn-pty-host" go test -race ./cmd/attn -run '^TestProfileClean.*SharedHost' -count=1

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check generated prompt catalogs
        working-directory: .
        run: go run ./cmd/promptgen --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      # The declarations the attn binary embeds are emitted from sdk/attn-app by
      # the same TypeScript this job just installed. Committed, so //go:embed can
      # read them — and therefore able to go stale.
      - name: Check app SDK declarations
        working-directory: .
        run: make check-sdk

      - name: Test
        run: pnpm test

      - name: Test prompt editor helpers
        working-directory: .
        run: |
          node --test cmd/prompt-editor/test/compare.test.mjs
          app/node_modules/.bin/oxlint --deny-warnings cmd/prompt-editor/web cmd/prompt-editor/test

  # E2E runs apart from the unit job so the two overlap instead of stacking.
  # Each shard is its own runner with its own throwaway daemon + Vite server,
  # so the shared-daemon constraint that forces workers:1 in playwright.config
  # still holds within a shard.
  frontend-e2e:
    name: Frontend E2E (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Ensure ghostty-vt artifacts
        uses: ./.github/actions/cache-ghostty-vt
        with:
          include-wasm: 'true'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build attn binary
        run: |
          cd ..
          ./scripts/build-libghostty-vt.sh
          go build -o /tmp/attn ./cmd/attn

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}

      # The suite only runs chromium (no projects configured), so skip the
      # firefox/webkit downloads. On a cache hit only the OS packages are needed.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright OS deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: E2E
        env:
          ATTN_E2E_BIN: /tmp/attn
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/3

      - name: Test prompt editor in Chromium
        if: matrix.shard == 1
        working-directory: .
        run: |
          node cmd/prompt-editor/test/browser.mjs
          node cmd/prompt-editor/test/collaboration.mjs

  # Single stable check name over the shard matrix, for branch-protection
  # rulesets. Green when all shards pass or the frontend filter skipped them.
  frontend-e2e-gate:
    name: Frontend E2E
    needs: frontend-e2e
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check shard results
        run: |
          result="${{ needs.frontend-e2e.result }}"
          echo "shards result: $result"
          [ "$result" = "success" ] || [ "$result" = "skipped" ]

  rust:
    name: Tauri (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.tauri == 'true'
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            runs_on: macos-14
          - os: ubuntu-24.04
            runs_on: ubuntu-24.04
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libgtk-3-dev libxdo-dev libssl-dev patchelf

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            pty-host
          # Saving on PRs too would copy this cache into every branch scope and
          # evict the rest of the repo's entries.
          save-if: ${{ github.ref == 'refs/heads/next' || github.ref == 'refs/heads/main' }}

      - name: Ensure ghostty-vt artifacts
        uses: ./.github/actions/cache-ghostty-vt

      - name: Build attn binary
        run: |
          cd ../..
          ./scripts/build-libghostty-vt.sh
          go build -o /tmp/attn ./cmd/attn
          make build-pty-host
          target_triple="$(rustc -vV | awk '/host:/ {print $2}')"
          mkdir -p app/src-tauri/binaries
          cp /tmp/attn "app/src-tauri/binaries/attn-${target_triple}"
          cp pty-host/target/release/attn-pty-host "app/src-tauri/binaries/attn-pty-host-${target_triple}"
          cd app/src-tauri

      - name: PTY host fmt, clippy, and test
        run: |
          cd ../..
          cargo fmt --manifest-path pty-host/Cargo.toml -- --check
          cargo clippy --manifest-path pty-host/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path pty-host/Cargo.toml

      - name: Cargo fmt
        run: cargo fmt -- --check

      # The pre-commit hook has always run clippy; CI never did, so a lint that
      # only the hook rejects reached main and blocked every local commit. Same
      # pinned toolchain on both sides, so they cannot disagree.
      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test

  # Single stable check name over the os matrix, for branch-protection
  # rulesets. Green when both legs pass or the tauri filter skipped them.
  rust-gate:
    name: Tauri
    needs: rust
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check matrix results
        run: |
          result="${{ needs.rust.result }}"
          echo "matrix result: $result"
          [ "$result" = "success" ] || [ "$result" = "skipped" ]

  # The bundled plugins are compiled by the packaged-app build, which no CI job
  # runs — so a plugin that only builds on a machine with warm node_modules got
  # all the way to a contributor's fresh clone. This stages them the way the app
  # build does, from a checkout that has nothing installed.
  plugins:
    name: Plugins
    needs: changes
    if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.plugins == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Linux sandbox
        uses: ./.github/actions/setup-linux-sandbox

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Read bun pin
        id: bun
        run: echo "version=$(awk '/^bun / { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Check prompt catalog freshness
        run: go run ./cmd/promptgen --check

      - name: Stage bundled plugins
        run: ./scripts/build-bundled-plugins.sh "${RUNNER_TEMP}/bundled-plugins"

      - name: Test plugins
        run: |
          for plugin in plugins/*/; do
            [ -f "${plugin}package.json" ] || continue
            echo ">>> ${plugin}"
            (cd "$plugin" && bun test)
          done

  app-acceptance-build:
    name: App acceptance build
    needs: changes
    # main-route.sh admits only release/hotfix onto main, so force_all covers them.
    if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.harness == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    # 202s on run 34060183460's GitHub-hosted runner, plus the tar and upload.
    # 30m leaves room for a cold Rust cache on the slower runner class.
    timeout-minutes: 30
    env:
      ATTN_PROFILE: app-acceptance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Report runner class
        run: ./scripts/ci-runner-class.sh

      - name: Install Linux desktop dependencies
        uses: ./.github/actions/setup-linux-app-deps
        with:
          role: build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # setup-go's key is content-only, so every Go job shares it and the
          # first one to finish seals it. This job owns its entry below instead.
          cache: false

      - name: Restore Go build cache
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-app-acceptance-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Read bun pin
        id: bun
        run: echo "version=$(awk '/^bun / { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Ensure ghostty-vt artifacts
        uses: ./.github/actions/cache-ghostty-vt
        with:
          include-wasm: 'true'

      # Install step: 399s cold, 143s warm incl. a 10s restore (run 33975425685).
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            pty-host

      - name: Build the packaged app
        env:
          CI: 'true'
        run: make build-app PROFILE="$ATTN_PROFILE"

      - name: Save Go build cache
        if: steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      # tar, not the artifact zip: upload-artifact drops the executable bit, and
      # every shard installs and launches these binaries.
      - name: Pack the app tree
        run: |
          app_name="$(./attn profile resolve --profile "$ATTN_PROFILE" --field appName)"
          tar -czf "$RUNNER_TEMP/app-tree.tar.gz" \
            attn \
            "app/src-tauri/target/release/linux-tree/$app_name" \
            plugins/attn-pi/node_modules
          ls -l "$RUNNER_TEMP/app-tree.tar.gz"

      - name: Upload the app tree
        uses: actions/upload-artifact@v4
        with:
          name: app-acceptance-tree-${{ github.run_attempt }}
          path: ${{ runner.temp }}/app-tree.tar.gz
          retention-days: 1
          # Already gzipped; zipping it again buys nothing and costs a minute.
          compression-level: 0

  app-acceptance-shard:
    name: App acceptance shard ${{ matrix.shard }}/4
    needs: [changes, app-acceptance-build]
    if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.harness == 'true'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Each hosted job owns its VM and display; only scenarios within a shard run
    # serially. A shared concurrency group would cancel unrelated waiting checks.
    runs-on: ubuntu-24.04
    # The heaviest of four balanced shards was 190.5s of the 761.5s matrix in run
    # 34060183460. 40m leaves room for the slower runner class and a hung scenario.
    timeout-minutes: 40
    env:
      ATTN_PROFILE: app-acceptance
      ATTN_HARNESS_PROFILE: app-acceptance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Report runner class
        run: ./scripts/ci-runner-class.sh

      - name: Set up Linux sandbox
        uses: ./.github/actions/setup-linux-sandbox

      - name: Install Linux desktop dependencies
        uses: ./.github/actions/setup-linux-app-deps
        with:
          role: run

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install harness dependencies
        run: pnpm --dir app install --frozen-lockfile

      - name: Download the app tree
        uses: actions/download-artifact@v4
        with:
          name: app-acceptance-tree-${{ github.run_attempt }}
          path: ${{ runner.temp }}

      - name: Install the packaged app and bundled plugin
        run: |
          tar -xzf "$RUNNER_TEMP/app-tree.tar.gz"
          make install-staged PROFILE="$ATTN_PROFILE"
          ./attn plugin install-bundled attn-pi
          mkdir -p "$RUNNER_TEMP/attn-harness-bin"
          install -m 0755 app/scripts/real-app-harness/ci-xdg-open "$RUNNER_TEMP/attn-harness-bin/xdg-open"
          echo "$RUNNER_TEMP/attn-harness-bin" >> "$GITHUB_PATH"
          echo "$PWD/plugins/attn-pi/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run serial matrix shard
        id: matrix
        continue-on-error: true
        env:
          ATTN_REAL_APP_ARTIFACTS_DIR: ${{ runner.temp }}/attn-real-app-harness
        run: >-
          xvfb-run -a -s '-screen 0 1600x1000x24'
          pnpm --dir app run real-app:serial-matrix -- --shard ${{ matrix.shard }}/4

      - name: Collect daemon and worker logs
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/attn-real-app-harness
        run: |
          data_dir="$(./attn profile resolve --field dataDir 2>/dev/null || true)"
          mkdir -p "$EVIDENCE_DIR/daemon"
          if [ -f "$data_dir/daemon.log" ]; then
            cp "$data_dir/daemon.log" "$EVIDENCE_DIR/daemon/daemon.log"
          fi
          if [ -d "$data_dir/workers" ]; then
            find "$data_dir/workers" -name '*.log' -exec cp {} "$EVIDENCE_DIR/daemon/" \;
          fi
          if [ -d "$data_dir/pty-hosts" ]; then
            find "$data_dir/pty-hosts" -name '*.log' -exec cp {} "$EVIDENCE_DIR/daemon/" \;
          fi
          ls "$EVIDENCE_DIR/daemon"

      - name: Upload app acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-acceptance-evidence-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/attn-real-app-harness/matrix-digest.txt
            ${{ runner.temp }}/attn-real-app-harness/**/*.txt
            ${{ runner.temp }}/attn-real-app-harness/**/*.png
            ${{ runner.temp }}/attn-real-app-harness/**/*.json
            ${{ runner.temp }}/attn-real-app-harness/daemon/*.log

      # The aggregate is the gate; it reads this and nothing else, so a shard
      # that dies before writing one is a missing shard there, not a silent pass.
      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-acceptance-result-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          if-no-files-found: error
          path: ${{ runner.temp }}/attn-real-app-harness/last-matrix.json

      - name: Clean profile
        if: always()
        run: ./attn profile clean "$ATTN_PROFILE"

      - name: Report the shard verdict
        if: always()
        env:
          MATRIX_OUTCOME: ${{ steps.matrix.outcome }}
        run: |
          if [ "$MATRIX_OUTCOME" = success ]; then
            exit 0
          fi
          echo "shard ${{ matrix.shard }}/4: the serial matrix is $MATRIX_OUTCOME;" \
            "the App acceptance job aggregates every shard's digest" >&2
          exit 1

  app-acceptance:
    name: App acceptance
    needs: [changes, app-acceptance-build, app-acceptance-shard]
    # !cancelled() so a red shard still reaches the aggregate: the digest names
    # which scenario failed, and a missing shard reds this job by name.
    if: >-
      !cancelled() &&
      (needs.changes.outputs.force_all == 'true' || needs.changes.outputs.harness == 'true')
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download shard results
        if: needs.app-acceptance-build.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: app-acceptance-result-${{ github.run_attempt }}-shard-*
          path: ${{ runner.temp }}/shard-results

      - name: Aggregate the shard digests
        id: matrix
        if: needs.app-acceptance-build.result == 'success'
        continue-on-error: true
        run: >-
          node app/scripts/real-app-harness/aggregate-shards.mjs
          --results-dir "$RUNNER_TEMP/shard-results" --shard-count 4
          --out "$RUNNER_TEMP/matrix-digest.txt"

      - name: Upload the aggregated digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-acceptance-digest-${{ github.run_attempt }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/matrix-digest.txt

      - name: Gate app acceptance
        if: always()
        env:
          BUILD_RESULT: ${{ needs.app-acceptance-build.result }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MATRIX_OUTCOME: ${{ steps.matrix.outcome }}
          SHARD_RESULT: ${{ needs.app-acceptance-shard.result }}
        run: |
          if [ "$MATRIX_OUTCOME" = success ] && [ "$SHARD_RESULT" = success ]; then
            echo "app acceptance: every Linux serial matrix shard is green for $HEAD_SHA"
            exit 0
          fi
          if [[ "$EVENT_NAME/$HEAD_BRANCH" =~ ^pull_request/(release/v[0-9]+\.[0-9]+\.[0-9]+|hotfix/.+)$ ]]; then
            ./scripts/workflow-job-gate.sh \
              app-acceptance.yml "$HEAD_SHA" workflow_dispatch main 'App acceptance'
            echo "app acceptance: protected-main manual override is green for $HEAD_SHA"
            exit 0
          fi
          if [ "$EVENT_NAME/$GITHUB_REF" = push/refs/heads/main ]; then
            ./scripts/app-acceptance-gate.sh "$HEAD_SHA"
            echo "app acceptance: candidate receipt covers main $HEAD_SHA"
            exit 0
          fi
          if [ "$BUILD_RESULT" != success ]; then
            echo "app acceptance: the app tree failed to build for $HEAD_SHA ($BUILD_RESULT);" \
              "no shard ran, so this is setup or build, not a scenario verdict" >&2
          elif [ -z "$MATRIX_OUTCOME" ]; then
            echo "app acceptance: the aggregate never ran for $HEAD_SHA;" \
              "this is setup, not a scenario verdict" >&2
          elif [ "$MATRIX_OUTCOME" = success ]; then
            echo "app acceptance: every scenario passed for $HEAD_SHA, but a shard job ended" \
              "$SHARD_RESULT; open the shard jobs, this is not a scenario verdict" >&2
          else
            echo "app acceptance: the aggregated Linux serial matrix is $MATRIX_OUTCOME for $HEAD_SHA" >&2
          fi
          exit 1

  release-preflight:
    name: Release preflight
    needs: changes
    if: needs.changes.outputs.force_all == 'true' || needs.changes.outputs.release_preflight == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/release-preflight.yml

  pr-gate:
    name: PR gate
    if: always() && github.event_name == 'pull_request'
    needs:
      - changes
      - main-route
      - changelog
      - generated-types
      - backend
      - pty-compatibility
      - frontend
      - frontend-e2e
      - frontend-e2e-gate
      - rust
      - rust-gate
      - plugins
      - app-acceptance
      - release-preflight
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Aggregate checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          ./scripts/ci-gate.sh pr
          changes main-route changelog generated-types backend frontend frontend-e2e
          frontend-e2e-gate rust rust-gate plugins app-acceptance release-preflight pty-compatibility

  acceptance:
    name: Acceptance
    if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    needs:
      - changes
      - main-route
      - changelog
      - generated-types
      - backend
      - pty-compatibility
      - frontend
      - frontend-e2e
      - frontend-e2e-gate
      - rust
      - rust-gate
      - plugins
      - app-acceptance
      - release-preflight
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Aggregate exact-SHA acceptance
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          ./scripts/ci-gate.sh acceptance
          changes main-route changelog generated-types backend frontend frontend-e2e
          frontend-e2e-gate rust rust-gate plugins app-acceptance release-preflight pty-compatibility

  branch-health:
    name: Report branch health
    if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    needs: acceptance
    permissions:
      contents: read
      issues: write
    concurrency:
      group: branch-health-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Update branch-health issue
        id: branch-health-issue
        continue-on-error: true
        env:
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
          BRANCH_HEALTH_ASSIGNEE: victorarias
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          ./scripts/ci-branch-health.sh "$ACCEPTANCE_RESULT"
          "${{ github.ref_name }}" "${{ github.sha }}" "$RUN_URL"

      - name: Report issue-update failure
        if: steps.branch-health-issue.outcome == 'failure'
        run: >-
          echo "::warning title=Branch health reporting failed::Acceptance is
          authoritative; the branch-health issue could not be updated."
