name: Release
run-name: ${{ github.event.client_payload.tag }}

env:
  GH_TOKEN: ${{ github.token }}

on:
  repository_dispatch:
    types: [release]

concurrency:
  group: release-${{ github.event.client_payload.tag }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate accepted tag
    outputs:
      release_sha: ${{ steps.validate.outputs.release_sha }}
      release_version: ${{ steps.version.outputs.version }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate accepted release tag
        id: validate
        env:
          RELEASE_TAG_INPUT: ${{ github.event.client_payload.tag }}
        run: ./scripts/release-tag-gate.sh "$RELEASE_TAG_INPUT"

      - name: Read the release version
        id: version
        env:
          RELEASE_TAG_INPUT: ${{ github.event.client_payload.tag }}
        run: |
          if ! [[ "$RELEASE_TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG_INPUT"
            exit 1
          fi
          echo "version=${RELEASE_TAG_INPUT#v}" >> "$GITHUB_OUTPUT"

  macos-app:
    name: macOS app
    needs: validate-tag
    permissions:
      contents: write
    uses: ./.github/workflows/release-macos-app.yml
    with:
      version: ${{ needs.validate-tag.outputs.release_version }}
      ref: ${{ needs.validate-tag.outputs.release_sha }}
      tag: ${{ github.event.client_payload.tag }}
    secrets: inherit

  linux-amd64:
    name: Linux amd64 daemon
    needs: [validate-tag, macos-app]
    permissions:
      contents: write
    runs-on: ubuntu-24.04

    steps:
      - name: Resolve release tag
        env:
          RELEASE_TAG_INPUT: ${{ github.event.client_payload.tag }}
          RELEASE_SHA_INPUT: ${{ needs.validate-tag.outputs.release_sha }}
        run: |
          RELEASE_TAG="$RELEASE_TAG_INPUT"
          RELEASE_SHA="$RELEASE_SHA_INPUT"

          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release SHA: $RELEASE_SHA"
            exit 1
          fi

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go-cgo-cflags

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.0'

      - name: Set up Zig
        uses: ./.github/actions/setup-toolchains
        with:
          zig: 'true'

      - name: Build Linux amd64 daemon
        run: |
          make build-linux-amd64 VERSION="${RELEASE_VERSION}" CHANNEL=release OUTPUT=/tmp/attn-linux-amd64 DAEMON_OUTPUT=/tmp/attnd-linux-amd64

      - name: Validate Linux amd64 daemon
        run: |
          /tmp/attnd-linux-amd64 --version
          file /tmp/attnd-linux-amd64 /tmp/attn-linux-amd64

      - name: Upload Linux amd64 daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${RELEASE_TAG}" /tmp/attnd-linux-amd64 /tmp/attn-linux-amd64 --clobber

      - name: Build Linux amd64 shared PTY host
        run: |
          make build-pty-host-linux-amd64
          cp dist/pty-host/linux_amd64/attn-pty-host /tmp/attn-pty-host-linux-amd64
          file /tmp/attn-pty-host-linux-amd64

      - name: Check the Linux amd64 shared PTY host runs where the daemon runs
        run: scripts/check-binary-glibc.sh /tmp/attnd-linux-amd64 /tmp/attn-linux-amd64 /tmp/attn-pty-host-linux-amd64

      - name: Upload Linux amd64 shared PTY host
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${RELEASE_TAG}" /tmp/attn-pty-host-linux-amd64 --clobber

      - name: Upload Linux amd64 checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd /tmp && sha256sum attnd-linux-amd64 attn-linux-amd64 attn-pty-host-linux-amd64 > SHA256SUMS-linux-amd64)
          gh release upload "${RELEASE_TAG}" /tmp/SHA256SUMS-linux-amd64 --clobber


  linux-arm64:
    name: Linux arm64 daemon
    needs: [validate-tag, macos-app]
    permissions:
      contents: write
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Resolve release tag
        env:
          RELEASE_TAG_INPUT: ${{ github.event.client_payload.tag }}
          RELEASE_SHA_INPUT: ${{ needs.validate-tag.outputs.release_sha }}
        run: |
          RELEASE_TAG="$RELEASE_TAG_INPUT"
          RELEASE_SHA="$RELEASE_SHA_INPUT"

          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release SHA: $RELEASE_SHA"
            exit 1
          fi

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            go-cgo-cflags

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.0'

      - name: Set up Zig
        uses: ./.github/actions/setup-toolchains
        with:
          zig: 'true'

      - name: Build Linux arm64 daemon
        run: |
          make build-linux-arm64 VERSION="${RELEASE_VERSION}" CHANNEL=release OUTPUT=/tmp/attn-linux-arm64 DAEMON_OUTPUT=/tmp/attnd-linux-arm64

      - name: Validate Linux arm64 daemon
        run: |
          /tmp/attnd-linux-arm64 --version
          file /tmp/attnd-linux-arm64 /tmp/attn-linux-arm64

      - name: Upload Linux arm64 daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${RELEASE_TAG}" /tmp/attnd-linux-arm64 /tmp/attn-linux-arm64 --clobber

      - name: Build Linux arm64 shared PTY host
        run: |
          make build-pty-host-linux-arm64
          cp dist/pty-host/linux_arm64/attn-pty-host /tmp/attn-pty-host-linux-arm64
          file /tmp/attn-pty-host-linux-arm64

      - name: Check the Linux arm64 shared PTY host runs where the daemon runs
        run: scripts/check-binary-glibc.sh /tmp/attnd-linux-arm64 /tmp/attn-linux-arm64 /tmp/attn-pty-host-linux-arm64

      - name: Upload Linux arm64 shared PTY host
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${RELEASE_TAG}" /tmp/attn-pty-host-linux-arm64 --clobber

      - name: Upload Linux arm64 checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd /tmp && sha256sum attnd-linux-arm64 attn-linux-arm64 attn-pty-host-linux-arm64 > SHA256SUMS-linux-arm64)
          gh release upload "${RELEASE_TAG}" /tmp/SHA256SUMS-linux-arm64 --clobber


  # Nothing is public until every gate above has passed and every asset is
  # attached. A failure anywhere leaves the draft for inspection: fix it, re-run
  # the workflow on the same tag, and the draft is published only once the whole
  # set is right.
  publish:
    name: Publish release
    needs: [validate-tag, macos-app, linux-amd64, linux-arm64]
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Resolve release tag
        env:
          RELEASE_TAG_INPUT: ${{ github.event.client_payload.tag }}
          RELEASE_SHA_INPUT: ${{ needs.validate-tag.outputs.release_sha }}
        run: |
          RELEASE_TAG="$RELEASE_TAG_INPUT"
          RELEASE_SHA="$RELEASE_SHA_INPUT"

          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release SHA: $RELEASE_SHA"
            exit 1
          fi

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"

      - name: Recheck immutable release tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ACTUAL_SHA="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
          if [ "$ACTUAL_SHA" != "$RELEASE_SHA" ]; then
            echo "$RELEASE_TAG moved to $ACTUAL_SHA, expected $RELEASE_SHA"
            exit 1
          fi

      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./scripts/publish-release.sh "$RELEASE_TAG"
