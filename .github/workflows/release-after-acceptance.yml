name: Release accepted main

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    branches: [reviewed]

concurrency:
  group: release-accepted-main
  cancel-in-progress: false

jobs:
  release:
    name: Release accepted main
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tag and dispatch the newest reviewed release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./scripts/release-after-acceptance.sh
