name: PTY upgrade

env:
  GH_TOKEN: ${{ github.token }}
  ATTN_TEST_HISTORY_DIR: /tmp/attn-test-history

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string

jobs:
  pty-upgrade:
    name: ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report runner class
        run: ./scripts/ci-runner-class.sh
      - uses: ./.github/actions/setup-toolchains
        with:
          go: 'true'
          go-cache: 'false'
      - name: Resolve Go cache paths
        id: go-cache-paths
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - name: Restore Go build cache
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.build }}
            ${{ steps.go-cache-paths.outputs.modules }}
          key: go-build-github-hosted-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'go-cgo-cflags') }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Ensure ghostty-vt artifacts
        uses: ./.github/actions/cache-ghostty-vt
      - name: Ensure the attn CLI
        uses: ./.github/actions/cache-attn-cli
        with:
          out: ${{ runner.temp }}/attn-cli-out/attn

      - name: Build host and native terminal library
        run: make build-pty-host
      - name: Install listener discovery tool
        if: runner.os == 'Linux'
        run: command -v lsof >/dev/null || (sudo apt-get update && sudo apt-get install -y lsof)
      - name: Install fish for the login shell check
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update && sudo apt-get install -y fish
          else
            brew install fish
          fi
      - name: Allow the private PID namespace that shared host tests create
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify old daemon and mixed host generations
        run: bash scripts/test-pty-upgrade.sh
      - name: Verify shared host protocol and lifecycle
        run: ATTN_TEST_PTY_HOST="$PWD/pty-host/target/release/attn-pty-host" go test -race ./internal/ptybackend -run '^Test(SharedHost_|MigratingHost_)' -count=1
      - name: Verify shared host output and resize order on the daemon wire
        run: ATTN_TEST_WIRE_ON_PTY_HOST=1 ATTN_TEST_PTY_HOST="$PWD/pty-host/target/release/attn-pty-host" go test ./internal/daemon -run '^(TestAClientAttachingMidFloodContinuesFromItsSnapshotWithoutAGapOrARepeat|TestAPtyResizeIsEchoedOnceInStreamOrderKeepingTheCellSizeWhenPixelsAreUnusable|TestAProgramReadsThePixelGeometryOfItsLastResize|TestAPasteAProgramIsNotReadingLeavesOtherPanesResponsiveAndArrivesWhole|TestInputBeyondTheQueueLimitIsRefusedNamingTheLimit|TestEmptyInputLeavesTheTerminalTakingInput|TestAnnotationsTheAgentsTerminalWillNotTakeKeepTheDraft|TestADeliveryAProgramIsNotReadingFailsAndNeverArrivesLater|TestAQuickCaptureTheAgentsTerminalWillNotTakeStaysUnread|TestInputDuringADeliveryIsAnsweredWhileTheDeliveryWaitsForItsTerminal)$' -count=1
      - name: Verify shared host stack tests on macOS
        if: runner.os == 'macOS'
        run: ATTN_TEST_PTY_HOST="$PWD/pty-host/target/release/attn-pty-host" go test -race ./cmd/attnd -run '^(TestInstanceClean.*SharedHost|TestBufferedEscapeSequencesKeepOutputEventsBoundedAndTheScreenExact|TestAProgramInAShellTile|TestShellProgramTitleInsideHeavyOutputIsKept|TestAgentsUseTheChosenLaunchMode|TestTheLaunchExperimentChanges|TestRestartNowLetsARunningTurnFinish|TestASharedCodexTerminalOpenedAfterADaemonRestart|TestTheSharedHostCanBeEnabledWhileGitCommandsAreRunning)' -count=1
      - name: Save Go build cache
        if: >-
          always() && steps.go-cache.outcome == 'success' &&
          steps.go-cache.outputs.cache-hit != 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.build }}
            ${{ steps.go-cache-paths.outputs.modules }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
