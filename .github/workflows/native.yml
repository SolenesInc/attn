name: Native

env:
  GH_TOKEN: ${{ github.token }}
  ATTN_TEST_HISTORY_DIR: /tmp/attn-test-history

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string

jobs:
  native:
    name: ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    env:
      CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/native/target
      RUSTUP_TOOLCHAIN: 1.99.1
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Report runner class
        working-directory: .
        run: ./scripts/ci-runner-class.sh

      - name: Install Linux window and Vulkan libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev mesa-vulkan-drivers

      - name: Set up Go
        uses: ./.github/actions/setup-toolchains
        with:
          go: 'true'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: clippy, rustfmt

      - name: Ensure ghostty-vt artifacts
        uses: ./.github/actions/cache-ghostty-vt

      - name: Ensure native VT library
        working-directory: .
        run: ./scripts/build-libghostty-vt.sh

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Native parity
        run: ../scripts/native-parity

      - name: Cargo fmt
        run: cargo fmt --all --check

      - name: Cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Cargo test
        run: go tool test-history capture cargo -- --locked --no-fail-fast --workspace

      - name: Ensure ghostty-vt artifacts
        if: runner.os == 'Linux'
        uses: ./.github/actions/cache-ghostty-vt

      - name: Ensure native VT library
        if: runner.os == 'Linux'
        working-directory: .
        run: ./scripts/build-libghostty-vt.sh

      - name: Read the repository's Rust pin
        if: runner.os == 'Linux'
        id: root-rust
        working-directory: .
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      # The attn CLI builds with the repository's pin, not the native workspace's.
      - name: Ensure the attn CLI
        if: runner.os == 'Linux'
        uses: ./.github/actions/cache-attn-cli
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.root-rust.outputs.channel }}
        with:
          out: ${{ runner.temp }}/attn-cli-out/attn

      - name: Build the native app for stack tests
        if: runner.os == 'Linux'
        run: cargo build --locked -p attn-app

      - name: Native app stack tests
        if: runner.os == 'Linux'
        working-directory: .
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.root-rust.outputs.channel }}
          ATTN_NATIVE_APP_BIN: ${{ github.workspace }}/native/target/debug/attn-app
        run: ./scripts/test-go.sh --packages -run '^TestTheNativeApp' -v ./cmd/attnd

      - name: Upload test receipts
        if: always()
        uses: ./.github/actions/upload-test-receipts
        with:
          name: native-${{ inputs.os }}
