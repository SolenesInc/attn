name: Native

env:
  GH_TOKEN: ${{ github.token }}
  ATTN_TEST_HISTORY_DIR: /tmp/attn-test-history

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string

jobs:
  native:
    name: ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    env:
      CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/native/target
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Report runner class
        working-directory: .
        run: ./scripts/ci-runner-class.sh

      - name: Install Linux window and Vulkan libraries
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-app-deps
        with:
          build-on-miss: 'true'

      - name: Set up Go
        uses: ./.github/actions/setup-toolchains
        with:
          go: 'true'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.0'
          components: clippy, rustfmt

      - name: Ensure ghostty-vt artifacts
        uses: ./.github/actions/cache-ghostty-vt

      - name: Ensure native VT library
        working-directory: .
        run: ./scripts/build-libghostty-vt.sh

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Node.js
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-toolchains
        with:
          node: 'true'

      - name: Install pnpm
        if: runner.os == 'Linux'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Check the browser runtime
        if: runner.os == 'Linux'
        working-directory: .
        run: make check-browser-runtime

      - name: Native host reads
        run: ../scripts/native-host-reads

      - name: Cargo fmt
        run: cargo fmt --all --check

      - name: Cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Cargo test
        run: go tool test-history capture cargo -- --locked --no-fail-fast --workspace

      - name: Wire suite acting as Linux
        if: runner.os == 'Linux'
        env:
          RUNE_PLATFORM: linux
        run: go tool test-history capture cargo --shard linux-platform -- --locked --no-fail-fast -p attn-app --test wire

      - name: Ensure ghostty-vt artifacts
        if: runner.os == 'Linux'
        uses: ./.github/actions/cache-ghostty-vt

      - name: Ensure native VT library
        if: runner.os == 'Linux'
        working-directory: .
        run: ./scripts/build-libghostty-vt.sh

      - name: Ensure the attn CLI
        if: runner.os == 'Linux'
        uses: ./.github/actions/cache-attn-cli
        with:
          out: ${{ runner.temp }}/attn-cli-out/attn

      - name: Build the native app for stack tests
        if: runner.os == 'Linux'
        run: cargo build --locked -p attn-app

      - name: Native app stack tests
        if: runner.os == 'Linux'
        working-directory: .
        env:
          ATTN_NATIVE_APP_BIN: ${{ github.workspace }}/native/target/debug/attn-app
        run: ./scripts/test-go.sh --packages -run '^TestTheNativeApp' -v ./cmd/attnd

      - name: Upload test receipts
        if: always()
        uses: ./.github/actions/upload-test-receipts
        with:
          name: native-${{ inputs.os }}
