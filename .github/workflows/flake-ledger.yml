# Keeps a single tracking issue in sync with what CI's test receipts show about
# flaky tests. The report distinguishes a flake (the test also passed on the
# commit where it failed) from an unresolved failure (it did not), and marks a
# flake dormant once the test has passed on enough later commits, so a landed
# fix is visible rather than assumed. It reads only CI's own receipt artifacts.
name: Flake ledger

on:
  schedule:
    # Daily, after the overnight runs have settled.
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many recent CI runs to scan'
        required: false
        default: '400'

permissions:
  actions: read
  issues: write

concurrency:
  group: flake-ledger
  cancel-in-progress: false

jobs:
  ledger:
    name: Update flake ledger
    runs-on: ubuntu-latest
    steps:
      # The report orders receipts by their commits' place in main's history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchains
        with:
          go: 'true'

      # Uploaded artifacts never change, so the report's on-disk cache carries
      # across days and only new artifacts cost downloads. It is saved even
      # when the report fails, so a run that hits the API rate limit keeps
      # what it downloaded for the next one.
      # Literal on both sides: a ~ in an env: value reaches the script
      # unexpanded and the cache lands in a directory named '~'.
      - name: Restore receipt cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/attn-ci-receipts
          key: flake-ledger-receipts-${{ github.run_id }}
          restore-keys: flake-ledger-receipts-

      - name: Generate ledger
        env:
          GH_TOKEN: ${{ github.token }}
          ATTN_FLAKE_CACHE: ${{ runner.temp }}/attn-ci-receipts
        run: |
          ./scripts/ci-flake-report.sh \
            --repo "$GITHUB_REPOSITORY" \
            --limit "${{ github.event.inputs.limit || '400' }}" \
            --format markdown > ledger.md
          echo "--- ledger preview ---"
          head -20 ledger.md

      - name: Save receipt cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/attn-ci-receipts
          key: flake-ledger-receipts-${{ github.run_id }}

      - name: Publish to the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="CI flake ledger"

          # One issue, found by title, reused forever. Creating it on first run
          # keeps the workflow self-installing.
          number="$(gh issue list --state open --limit 100 \
            --search "$title in:title" \
            --json number,title \
            --jq "[.[] | select(.title == \"$title\")] | first | .number // empty")"

          if [ -z "$number" ]; then
            number="$(gh issue create --title "$title" --body-file ledger.md \
              | grep -oE '[0-9]+$')"
            echo "created tracking issue #$number"
            exit 0
          fi

          # Compare the active set against what the issue already shows, so a
          # newly-appearing flake gets an actual notification instead of quietly
          # landing in an edited issue body nobody re-reads.
          gh issue view "$number" --json body --jq .body > previous.md || : > previous.md
          active_tests() {
            awk '/^## Active/ { on = 1; next } /^## /  { on = 0 } on && /^\| [0-9]/ {
              n = split($0, cells, /\|/); gsub(/^ +| +$/, "", cells[n - 1]); print cells[n - 1]
            }' "$1" | sort -u
          }
          active_tests ledger.md > active-now.txt
          active_tests previous.md > active-before.txt
          comm -23 active-now.txt active-before.txt > newly-active.txt

          gh issue edit "$number" --body-file ledger.md
          echo "updated tracking issue #$number"

          if [ -s newly-active.txt ]; then
            {
              echo "New flaky test(s) detected in the latest scan:"
              echo
              sed 's/^/- `/; s/$/`/' newly-active.txt
              echo
              echo "A failure is counted as a flake only when the test also passed on the commit where it failed, so these are not ordinary red builds."
            } > comment.md
            gh issue comment "$number" --body-file comment.md
            echo "commented with $(wc -l < newly-active.txt) new entries"
          fi
