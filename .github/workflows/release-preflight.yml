name: Release Preflight

env:
  GH_TOKEN: ${{ github.token }}

on:
  workflow_call:
  workflow_dispatch:

jobs:
  linux-daemon-preflight:
    name: Linux daemon (${{ matrix.label }})
    permissions:
      contents: read
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: amd64
            runs_on: ubuntu-24.04
            goarch: amd64
            output: /tmp/attn-linux-amd64
            daemon_output: /tmp/attnd-linux-amd64
            pty_output: /tmp/attn-pty-host-linux-amd64
            artifact: attn-linux-amd64
          - label: arm64
            runs_on: ubuntu-24.04-arm
            goarch: arm64
            output: /tmp/attn-linux-arm64
            daemon_output: /tmp/attnd-linux-arm64
            pty_output: /tmp/attn-pty-host-linux-arm64
            artifact: attn-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go and Zig
        uses: ./.github/actions/setup-toolchains
        with:
          go: 'true'
          zig: 'true'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'

      - name: Build daemon
        env:
          VERSION: preflight-${{ github.sha }}
        run: |
          make build-linux-${{ matrix.goarch }} VERSION="${VERSION}" OUTPUT=${{ matrix.output }} DAEMON_OUTPUT=${{ matrix.daemon_output }}

      - name: Validate daemon
        env:
          EXPECTED_VERSION: preflight-${{ github.sha }}
        run: |
          actual_version="$(${{ matrix.daemon_output }} --version)"
          if [ "$actual_version" != "$EXPECTED_VERSION" ]; then
            echo "Version mismatch: got '$actual_version', want '$EXPECTED_VERSION'"
            exit 1
          fi
          file ${{ matrix.daemon_output }} ${{ matrix.output }}

      - name: Build shared PTY host
        run: |
          make build-pty-host-linux-${{ matrix.goarch }}
          cp dist/pty-host/linux_${{ matrix.goarch }}/attn-pty-host ${{ matrix.pty_output }}
          file ${{ matrix.pty_output }}

      - name: Check the CLI and shared PTY host run where the daemon runs
        run: scripts/check-binary-glibc.sh ${{ matrix.daemon_output }} ${{ matrix.output }} ${{ matrix.pty_output }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.daemon_output }}
            ${{ matrix.output }}
            ${{ matrix.pty_output }}
          if-no-files-found: error
          retention-days: 7
