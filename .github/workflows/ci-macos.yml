name: CI macOS

env:
  GH_TOKEN: ${{ github.token }}
  ATTN_TEST_HISTORY_DIR: /tmp/attn-test-history

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: >-
    ci-macos-${{ github.event.pull_request.number
    || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    && format('full-{0}', github.run_id))
    || (github.ref == 'refs/heads/main'
    && (startsWith(github.event.head_commit.message, 'chore(release): prepare v')
    || (startsWith(github.event.head_commit.message, 'Merge pull request ')
    && contains(github.event.head_commit.message, '/release/v')))
    && github.sha)
    || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Changes
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.full.outputs.macos }}
      carried: ${{ steps.select.outputs.carried }}
      cli: ${{ steps.select.outputs.cli }}
      native_macos: ${{ steps.select.outputs.native_macos }}
      pty_upgrade_macos: ${{ steps.select.outputs.pty_upgrade_macos }}
      app_acceptance: ${{ steps.select.outputs.app_acceptance }}
      native_release: ${{ steps.select.outputs.native_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether every macOS job runs
        id: full
        env:
          BEFORE: ${{ github.event.before }}
          FULL_EVENT: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/v')) }}
          MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          macos="$FULL_EVENT"
          if [ "$MAIN_PUSH" = true ] && [ -n "$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- .github/release-candidate.yml)" ]; then
            macos=true
          fi
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          echo "full run: $macos"

      - name: Compute inputs keys
        id: keys
        if: steps.full.outputs.macos != 'true'
        run: |
          if keys="$(scripts/ci-pass-records keys)"; then
            tr ' ' '=' <<<"$keys" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Pass records unread::No inputs key could be computed, so every macOS job runs."
          fi

      - name: Look up cli's macOS pass record
        if: steps.keys.outputs.cli
        uses: ./.github/actions/ci-pass-record
        with:
          group: cli
          key: macos-${{ steps.keys.outputs.cli }}

      - name: Look up native_macos's macOS pass record
        if: steps.keys.outputs.native_macos
        uses: ./.github/actions/ci-pass-record
        with:
          group: native_macos
          key: macos-${{ steps.keys.outputs.native_macos }}

      - name: Look up pty_upgrade_macos's macOS pass record
        if: steps.keys.outputs.pty_upgrade_macos
        uses: ./.github/actions/ci-pass-record
        with:
          group: pty_upgrade_macos
          key: macos-${{ steps.keys.outputs.pty_upgrade_macos }}

      - name: Look up app_acceptance's macOS pass record
        if: steps.keys.outputs.app_acceptance
        uses: ./.github/actions/ci-pass-record
        with:
          group: app_acceptance
          key: macos-${{ steps.keys.outputs.app_acceptance }}

      - name: Look up native_release's macOS pass record
        if: steps.keys.outputs.native_release
        uses: ./.github/actions/ci-pass-record
        with:
          group: native_release
          key: macos-${{ steps.keys.outputs.native_release }}

      - name: Select the groups that run
        id: select
        run: scripts/ci-pass-records carried "$RUNNER_TEMP/ci-pass-records" >> "$GITHUB_OUTPUT"

  pty-compatibility:
    name: PTY upgrade
    needs: changes
    if: needs.changes.outputs.pty_upgrade_macos != 'carried'
    uses: ./.github/workflows/pty-upgrade.yml
    with:
      os: macos-15

  native:
    name: Native
    needs: changes
    if: needs.changes.outputs.native_macos != 'carried'
    permissions:
      contents: read
    uses: ./.github/workflows/native.yml
    with:
      os: macos-15

  attn-cli:
    name: CLI
    needs: changes
    if: needs.changes.outputs.cli != 'carried'
    permissions:
      contents: read
    uses: ./.github/workflows/attn-cli.yml
    with:
      os: macos-15

  app-acceptance-macos:
    name: App acceptance macOS (native)
    needs: changes
    if: needs.changes.outputs.app_acceptance != 'carried'
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 40
    env:
      ATTN_INSTANCE: app-acceptance
      ATTN_HARNESS_INSTANCE: app-acceptance
      ATTN_HARNESS_PARK_VISIBLE_PX: '0'
      SCENARIOS: native-terminal-core native-quick-capture native-browser
    steps:
      - name: Configure artifact directory
        run: echo "ATTN_REAL_APP_ARTIFACTS_DIR=$RUNNER_TEMP/attn-real-app-harness" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Report runner class
        run: ./scripts/ci-runner-class.sh

      - name: Build the App acceptance tree
        id: build-app
        uses: ./.github/actions/build-app-acceptance
        with:
          instance: ${{ env.ATTN_INSTANCE }}

      - name: Install the App acceptance tree
        uses: ./.github/actions/install-app-acceptance
        with:
          instance: ${{ env.ATTN_INSTANCE }}
          archive: ${{ steps.build-app.outputs.archive }}

      - name: Run the macOS-only scenarios
        run: |
          scenario_args=(); for scenario in $SCENARIOS; do scenario_args+=(--scenario "$scenario"); done
          pnpm --dir app run real-app:serial-matrix -- "${scenario_args[@]}"

      - name: Upload test receipts
        if: always()
        uses: ./.github/actions/upload-test-receipts
        with:
          name: app-acceptance-macos-native

      - name: Require executed macOS coverage
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const { results } = JSON.parse(fs.readFileSync(`${process.env.ATTN_REAL_APP_ARTIFACTS_DIR}/last-matrix.json`, 'utf8'));
          assert.deepEqual(
            results.map(({ id, code, skipped = false }) => ({ id, code, skipped })),
            process.env.SCENARIOS.split(' ').map((id) => ({ id, code: 0, skipped: false })),
          );
          NODE

      - name: Collect daemon and worker logs
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/attn-real-app-harness
        run: |
          data_dir="$(./attn instance resolve --field dataDir 2>/dev/null || true)"
          mkdir -p "$EVIDENCE_DIR/daemon"
          if [ -d "$data_dir" ]; then
            find "$data_dir" -name '*.log' -exec cp {} "$EVIDENCE_DIR/daemon/" \;
          fi
          app_debug_dir="$(./attn instance resolve --field appLocalDataDir 2>/dev/null || true)/debug"
          mkdir -p "$EVIDENCE_DIR/app"
          for file in ui-automation-server.log ui-diagnostics.jsonl; do
            if [ -f "$app_debug_dir/$file" ]; then
              cp "$app_debug_dir/$file" "$EVIDENCE_DIR/app/"
            fi
          done

      - name: Upload macOS acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-acceptance-macos-native-evidence-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/attn-real-app-harness/**/*.txt
            ${{ runner.temp }}/attn-real-app-harness/**/*.png
            ${{ runner.temp }}/attn-real-app-harness/**/*.mp4
            ${{ runner.temp }}/attn-real-app-harness/**/*.json
            ${{ runner.temp }}/attn-real-app-harness/**/app-launch-*.log
            ${{ runner.temp }}/attn-real-app-harness/**/native-*.log
            ${{ runner.temp }}/attn-real-app-harness/daemon/*.log
            ${{ runner.temp }}/attn-real-app-harness/app/*

      - name: Clean instance
        if: always()
        run: ./attn instance clean "$ATTN_INSTANCE"

  native-release-preflight:
    name: Native release preflight
    needs: changes
    if: needs.changes.outputs.native_release != 'carried'
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: ./.github/actions/setup-toolchains
        with:
          go: 'true'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'

      - name: Install the native workspace's Rust
        working-directory: native
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal

      - name: Build each Rust workspace in its target, which the Rust cache keeps
        run: echo 'CARGO_BUILD_BUILD_DIR={workspace-root}/target' >> "$GITHUB_ENV"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-release-profile
          workspaces: |
            native
            pty-host
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the native release app
        env:
          MACOS_CODESIGN_IDENTITY: '-'
        run: make build-app CHANNEL=release

      - name: Check the native release app
        run: |
          version="$(bash ./scripts/version.sh)"
          ./scripts/check-macos-release-app.sh native/target/staged/attn.app "$version"

  full-macos:
    name: Full macOS run
    needs: [changes, pty-compatibility, native, attn-cli, app-acceptance-macos, native-release-preflight]
    if: always() && needs.changes.outputs.full == 'true'
    permissions: {}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every macOS job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS_JSON"

  pr-gate:
    name: macOS PR gate
    if: always() && github.event_name == 'pull_request'
    needs: [changes, pty-compatibility, native, attn-cli, app-acceptance-macos, native-release-preflight, full-macos]
    permissions: {}
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS_JSON"

  acceptance:
    name: macOS acceptance
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [changes, pty-compatibility, native, attn-cli, app-acceptance-macos, native-release-preflight, full-macos]
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
      JOB_GROUPS: >-
        {"attn-cli": ["cli"],
        "native": ["native_macos"],
        "pty-compatibility": ["pty_upgrade_macos"],
        "app-acceptance-macos": ["app_acceptance"],
        "native-release-preflight": ["native_release"]}
    steps:
      - uses: actions/checkout@v4

      - name: Aggregate exact-SHA macOS acceptance
        env:
          CARRIED_JSON: ${{ needs.changes.outputs.carried }}
        run: ./scripts/ci-acceptance.sh full-macos

      - name: Choose the pass records to write
        id: passed
        if: '!cancelled()'
        run: scripts/ci-pass-records passed | tr ' ' '=' >> "$GITHUB_OUTPUT"

      - name: Record cli's macOS pass
        if: '!cancelled() && steps.passed.outputs.cli'
        uses: ./.github/actions/ci-pass-record
        with:
          group: cli
          key: macos-${{ steps.passed.outputs.cli }}
          write: 'true'

      - name: Record native_macos's macOS pass
        if: '!cancelled() && steps.passed.outputs.native_macos'
        uses: ./.github/actions/ci-pass-record
        with:
          group: native_macos
          key: macos-${{ steps.passed.outputs.native_macos }}
          write: 'true'

      - name: Record pty_upgrade_macos's macOS pass
        if: '!cancelled() && steps.passed.outputs.pty_upgrade_macos'
        uses: ./.github/actions/ci-pass-record
        with:
          group: pty_upgrade_macos
          key: macos-${{ steps.passed.outputs.pty_upgrade_macos }}
          write: 'true'

      - name: Record app_acceptance's macOS pass
        if: '!cancelled() && steps.passed.outputs.app_acceptance'
        uses: ./.github/actions/ci-pass-record
        with:
          group: app_acceptance
          key: macos-${{ steps.passed.outputs.app_acceptance }}
          write: 'true'

      - name: Record native_release's macOS pass
        if: '!cancelled() && steps.passed.outputs.native_release'
        uses: ./.github/actions/ci-pass-record
        with:
          group: native_release
          key: macos-${{ steps.passed.outputs.native_release }}
          write: 'true'

  branch-health:
    name: Report branch health
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [changes, acceptance]
    permissions:
      contents: read
      issues: write
    concurrency:
      group: branch-health-${{ github.ref_name }}-${{ needs.changes.outputs.full == 'true' && 'full-run' || 'macos' }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Update branch-health issue
        id: branch-health-issue
        continue-on-error: true
        env:
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
          BRANCH_HEALTH_ASSIGNEE: victorarias
          RECORD: ${{ needs.changes.outputs.full == 'true' && 'full run' || 'macOS' }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          ./scripts/ci-branch-health.sh "$ACCEPTANCE_RESULT"
          "${{ github.ref_name }}" "${{ github.sha }}" "$RUN_URL" "$RECORD"

      - name: Report issue-update failure
        if: steps.branch-health-issue.outcome == 'failure'
        run: >-
          echo "::warning title=Branch health reporting failed::macOS acceptance is
          authoritative; the branch-health issue could not be updated."
