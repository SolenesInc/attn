name: TestFlight

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'internal/protocol/schema/home_gateway.tsp'
      - 'ghostty-vt.pin'
      - 'app/src/components/GhosttyWebGlRenderer.ts'
      - 'app/src/components/Markdown/mermaidRender.ts'
      - 'app/src/components/gardenBoardModel.ts'
      - 'app/src/components/terminalColor.ts'
      - 'app/src/components/terminalGlyphFont.ts'
      - 'app/src/components/terminalGlyphProgram.ts'
      - 'app/src/components/terminalGraphemeMode.ts'
      - 'app/src/components/terminalVertexBuffer.ts'
      - 'app/src/homeGateway/decode.ts'
      - 'app/src/ghostty/abi.ts'
      - 'app/src/ghostty/callback.ts'
      - 'app/src/ghostty/index.ts'
      - 'app/src/ghostty/input.ts'
      - 'app/src/ghostty/keyEncoder.ts'
      - 'app/src/ghostty/terminal.ts'
      - 'app/src/ghostty/wasm.ts'
      - 'app/src/shortcuts/platform.ts'
      - 'app/src/types/homeGatewayGenerated.ts'
      - 'app/src/types/homeGatewayVersion.ts'
      - 'app/src/utils/ghosttyScroll.ts'
      - 'app/src/utils/kittyImageFormat.ts'
      - 'app/src/utils/supportInputTrace.ts'
      - 'app/src/utils/terminalSizing.ts'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions: {}

jobs:
  decide:
    name: Decide whether to upload
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload every push and dispatch, and a schedule only when the newest upload is old
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            mobile/scripts/testflight-due.sh >> "$GITHUB_OUTPUT"
          else
            echo due=true >> "$GITHUB_OUTPUT"
          fi

  upload:
    name: Upload to TestFlight
    needs: decide
    if: needs.decide.outputs.due == 'true'
    runs-on: macos-15
    environment: testflight
    concurrency:
      group: testflight
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}
      failure: ${{ steps.failure.outputs.reason }}
    steps:
      - name: Check out the newest main, which holds every push this build replaced
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: ./.github/actions/setup-toolchains
        with:
          node: 'true'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build, sign and upload
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          GH_TOKEN: ${{ github.token }}
          TESTFLIGHT_FAILURE_FILE: ${{ runner.temp }}/testflight-failure
        run: mobile/scripts/testflight.sh

      - name: Keep the build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: mobile/ios/App/build/testflight-*/*.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Give the alert the reason
        id: failure
        if: failure()
        env:
          FAILURE_FILE: ${{ runner.temp }}/testflight-failure
        run: |
          [ ! -s "$FAILURE_FILE" ] || echo "reason=$(tr '\n' ' ' <"$FAILURE_FILE")" >> "$GITHUB_OUTPUT"

  alert:
    name: Alert Discord
    needs: [decide, upload]
    if: failure()
    runs-on: ubuntu-latest
    environment: testflight
    steps:
      - name: Post what failed and the run's link
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DECIDE_RESULT: ${{ needs.decide.result }}
          REASON: ${{ needs.upload.outputs.failure }}
          COMMIT: ${{ needs.upload.outputs.commit || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$DECIDE_RESULT" = failure ]; then
            what="TestFlight did not build ${COMMIT:0:9}: deciding whether to upload failed."
          else
            what="TestFlight build of ${COMMIT:0:9} failed: ${REASON:-The build stopped before it gave a reason.}"
          fi
          jq -n --arg what "${what:0:1800}" --arg url "$RUN_URL" '{content: "\($what)\n\($url)"}' \
            | curl -sS --fail-with-body -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK"
