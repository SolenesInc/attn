# Named argument types. `json` is the JSON Schema of the value in a tool's input
# schema, `placeholder` is how CLI usage prints the value, and `doc` describes
# the value wherever an arg of this type has no doc of its own.
types:
  seed:
    json: {type: string, minLength: 1}
    doc: "A seed's id, such as s-7k3f9m, or its slug. A slug two seeds share is refused, listing each match."
    placeholder: "<id>"
  check_id:
    json: {type: string, pattern: "^C[1-9][0-9]*$"}
    doc: "A check's id, such as C1."
    placeholder: "<C#>"
  check_definition:
    json: {type: string, minLength: 1}
    doc: "A statement the seed must prove; attn picks the id unless C#= names it, as in C5=Retries pass."
    placeholder: '"[C#=]<statement>"'
  relation:
    json: {type: string, enum: [blocks, part-of, discovered-from]}
    doc: "How a relates to b."
    placeholder: "<blocks|part-of|discovered-from>"
  duration:
    json: {type: string, minLength: 1}
    doc: "A duration from now, such as 20m, 2h or 1h30m."
    placeholder: "<duration>"
  window:
    json: {type: string, minLength: 1}
    doc: "A window of time, such as 72h or 14d."
    placeholder: "<d>"
  time:
    json: {type: string, format: date-time}
    doc: "An RFC3339 time, such as 2026-11-05T09:00:00+01:00."
    placeholder: "<time>"
  bookmark:
    json: {type: integer, minimum: 0}
    doc: "The bookmark an earlier read printed."
    placeholder: "<bookmark>"
  count:
    json: {type: integer, minimum: 1}
    placeholder: "<n>"
  version:
    json: {type: integer, minimum: 1}
    doc: "A body version, as the edit entries in notes show it."
    placeholder: "<version>"
  markdown:
    json: {type: string, minLength: 1}
    doc: "Markdown."
    placeholder: "<body>"
  text:
    json: {type: string, minLength: 1}
    placeholder: "<text>"
  name:
    json: {type: string, minLength: 1}
    placeholder: "<name>"
  path:
    json: {type: string, minLength: 1}
    doc: "A path on this machine. A relative path resolves against the working directory."
    placeholder: "<path>"
  url:
    json: {type: string, format: uri}
    placeholder: "<url>"
  revision:
    json: {type: string, minLength: 1}
    placeholder: "<rev>"
  review_id:
    json: {type: string, minLength: 1}
    placeholder: "<review-id>"
  entry_kind:
    json: {type: string, minLength: 1}
    placeholder: "<kind>"
  bool:
    json: {type: boolean}
  plot:
    json:
      type: object
      properties:
        title: {type: string, minLength: 1}
        body: {type: string}
        part_of: {type: string, description: "A plot to plant this plot under, by id or slug."}
        discovered_from: {type: string, description: "The seed whose work turned up this plot, by id or slug."}
        checks:
          type: array
          items: {$ref: "#/$defs/check"}
        children:
          type: array
          items:
            type: object
            properties:
              title: {type: string, minLength: 1}
              body: {type: string}
              checks:
                type: array
                items: {$ref: "#/$defs/check"}
              after:
                type: array
                items: {type: string}
                description: "The siblings this child waits for, by step slug or full title."
            required: [title]
      required: [title]
      $defs:
        check:
          type: object
          properties:
            id: {type: string}
            text: {type: string, minLength: 1}
            shared: {type: boolean}
          required: [text]
    doc: "A plot payload."
    placeholder: "<path>"
  callout_steps:
    json:
      type: array
      items:
        type: object
        properties:
          anchor: {type: string, minLength: 1, description: "A fixed anchor such as garden, agent:<who> or desktop:<which>."}
          text: {type: string, minLength: 1, maxLength: 160}
        additionalProperties: false
        required: [anchor, text]
    doc: "Each step's anchor and its text."
    placeholder: "<anchor> <text>"
  clearable:
    json: {type: string}
    clears: true
    doc: "Text; an empty value clears it."
    placeholder: "<text>"
  role_target:
    json: {type: string, minLength: 1}
    doc: "A role id, or role/alternative for one of the role's alternatives."
    placeholder: "<role>[/<alt>]"
  builtin_role:
    json: {type: string, enum: [pathfinder, builder, reviewer, orchestrator, prototyper]}
    placeholder: "<pathfinder|builder|reviewer|orchestrator|prototyper>"
  table_revision:
    json: {type: integer, minimum: 0}
    doc: "A revision of the delegation table."
    placeholder: "<revision>"
  delegation_table:
    json:
      type: object
      properties:
        revision: {type: integer, minimum: 0}
        enabled: {type: boolean}
        workflow_skill_enabled: {type: boolean}
        roles: {type: array, items: {type: object}}
        fallback: {type: object}
      required: [revision, roles, fallback]
    doc: "The delegation table, as delegate_roles_show returns it in preferences."
    placeholder: "<file|->"
  seed_id:
    json: {type: string, pattern: "^s-"}
    doc: "A seed's id, such as s-7k3f9m."
    placeholder: "<seed-id>"
  file_line:
    json: {type: string, pattern: "^.+:[0-9]+$"}
    doc: "A file and a line in it, as path:line."
    placeholder: "<path>:<line>"
  vent_kind:
    json: {type: string, enum: [attn, tools]}
    doc: "What the vent is about: attn for attn itself, including attn blocked inside your harness, or tools for your other tooling (skills, other CLIs or MCP servers, harness permissions)."
    placeholder: "attn|tools"
