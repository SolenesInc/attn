# The open family: one bare command. Write each doc for both surfaces, as
# seed.yaml says.
groups:
  - name: open
    summary: "show the user a markdown document"
    map:
      rows:
        - {need: "Show the user a markdown document or a seed", tools: [open], references: [markdown]}
    flags:
      - {name: session, placeholder: "<id>", doc: "open the tile next to this session (defaults to the current session)"}
      - {name: profile, placeholder: "<name|id>", doc: "the garden a seed id belongs to; required outside attn when several profiles exist"}
    reference:
      name: markdown
      title: "Markdown"
      intro: |
        To show the user a markdown document, open it in a tile next to the current session. Edit the file instead of opening it again. To open the tile next to another session, add `--session <id>`. Outside attn, a seed id needs `--profile <name|id>` when several profiles exist.

        `attn skill --reference showing` says what the tile renders and how to write a document a reader understands on the first read.

        The user can mark up the document and send their notes to you as one message.
    sections:
      - title: Opening a document
        commands: [open]

commands:
  - name: open
    summary: show the user a markdown document or a seed in a tile
    runs: home
    grant: full
    effect: record
    upfront: true
    doc: |
      Opens the markdown file at `path`, or the seed `seed` (pass one of the two), in a tile next to your session. The tile reloads whenever the file changes. With `code_review_enabled` on, a review document's problems come back as `problems`, each with its line; with `views_enabled` on, so do a view's. The tile opens anyway. A view's `run=` commands and its own `:::commands`, each own one with its `name`, come back as `commands`: none runs until the user starts them on the tile, and a change to a command or its script stops it until the user starts it again.
    args:
      - {name: path, type: path, cli: pos, one_of: target, placeholder: "<file.md>", doc: "the markdown file to show"}
      - {name: seed, type: seed_id, cli: pos, one_of: target, doc: "the seed to show, by its id"}
    result: OpenResult
    errors:
      - {code: no_target, usage: true, fix: "Pass {path} or {seed}."}
    examples:
      - {path: notes/plan.md}
      - {seed: s-7k3f9m}
