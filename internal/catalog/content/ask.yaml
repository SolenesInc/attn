# The ask family: an agent asking the user something they answer from attn.
# ask runs on the caller's machine, because it reads the images the markdown
# shows there; the home keeps the asks.
groups:
  - name: ask
    usage: "[list|show|amend|close]"
    summary: "ask the user something they answer from attn"
    map:
      rows:
        - {need: "Ask the user a decision only they can make", tools: [ask, ask_list, ask_amend, ask_close]}
    flags:
      - {name: session, placeholder: "<id>", doc: "session id (defaults to the current session)"}
    doc: |
      Ask the user what you cannot settle alone. They answer from attn, without opening your terminal.

      After you ask, carry on with work that does not depend on the answer, then end your turn. Your session stays open, so the user can find you, talk to you and run commands in your terminal, and attn types the answer as the user's message into the conversation of whoever tends the ask's seed by then, or into this one for an ask about no seed. While any of your asks is open, attn refuses a standby that would close your session, and an `attn agent close --self` that would leave the answer with no agent, and names each ask.

      You can also read and withdraw the asks of the agents you oversee: the agents below you in your delegation chain, or every agent in your profile when you are the Chief. They are not your asks, and only the user answers them.
    reference:
      name: ask
      title: "Asks"
      intro: "{ask_reference_rules}"
    sections:
      - title: Asking
        commands: [ask, ask list, ask show, ask amend, ask close]

commands:
  - name: ask
    summary: open an ask in the user's queue; it returns at once
    runs: here
    grant: own
    effect: record
    tool: true
    doc: |
      Opens an ask in the user's queue and returns its id at once. {ask_rules}

      The ask is markdown. Question blocks in it ask the user something; an ask without one just tells them something: `:::question` (pick one choice), `:::question-multi` (pick any number of choices), `:::question-text` (write an answer) and `:::question-file` (attach a screenshot or a file), each closed by `:::`. A block's first line is the question; the rest is context. Choices are "- [ ] label" or "- [ ] label — why"; "Recommended: <label>" marks yours, with the label alone, not its why. In one `:::question` of an ask, "Default: <label> after <duration>", such as "Default: Job queue after 2h", names the choice you go with when no answer has come by then: attn tells you once, the ask stays open, and a later answer reaches you as usual. A question that asks permission takes no default.

      {ask_details}
    args:
      - {name: markdown, type: markdown, required: true, piped: true, cli: "--file", placeholder: "<path>", doc: "the ask's markdown, required"}
      - {name: subject, type: text, cli: "--subject", doc: "the ask's subject (defaults to its first question)"}
      - {name: seed, type: seed, cli: "--seed", doc: "a seed you tend that the ask is about (defaults to the seed your delegation assigned you)"}
      - {name: re, type: text, cli: "--re", placeholder: "<id>", doc: "the earlier ask this one follows up; the user sees its question and their answer above this one"}
      - {name: base_dir, type: path, cli: internal, doc: "the folder the markdown's image paths resolve against: the working directory, or beside the file"}
    result: Ask
    receipt: [id, subject, seed_id, seed_slug]

  - name: ask list
    summary: your open asks and those about seeds you tend, then the open asks of the agents you oversee
    runs: home
    grant: own
    effect: read
    doc: |
      Lists your open asks and those about seeds you tend, then, apart from yours, the open asks of the agents you oversee.
    result: AskListResult

  - name: ask show
    summary: one ask, with who asked, its seed, its age and text
    runs: home
    grant: own
    effect: read
    upfront: true
    doc: |
      Prints one open ask you hold or oversee: who asked, its seed, its age and its text.
    args:
      - {name: ask, type: text, required: true, cli: pos, placeholder: "<id>", doc: "the ask's id"}
    result: AskShowResult

  - name: ask amend
    summary: add to an open ask when the facts change; the user keeps its place and their answer so far
    runs: here
    grant: own
    effect: record
    doc: |
      Adds markdown to the end of an open ask you hold or oversee, when something it says has changed. The user sees the addition as an update with its time, and keeps the ask's place in their queue and the answer they have started. Closing the ask and asking again would throw both away.

      An amendment renders markdown as the ask does, diagrams, tables and local images included, and carries no question blocks, so the ask's questions stay as they are; to ask something new, open another ask. Images resolve as they do when you open an ask, against the folder the ask was opened from; from another folder, name each image by its absolute path. An ask's images never change once saved: save a new picture under a new name, because attn refuses an amendment that names a saved image's path with different bytes. attn refuses an amendment to an ask the user already answered.
    args:
      - {name: ask, type: text, required: true, cli: pos, placeholder: "<id>", doc: "the ask's id"}
      - {name: markdown, type: markdown, required: true, piped: true, cli: "--file", placeholder: "<path>", doc: "the markdown to add, required"}
      - {name: base_dir, type: path, cli: internal, doc: "the folder the markdown's image paths resolve against: the working directory, or beside the file"}
    result: Ask
    receipt: [id, subject, seed_id, seed_slug]

  - name: ask close
    summary: withdraw an ask you no longer need answered
    runs: home
    grant: own
    effect: act
    upfront: true
    doc: |
      Withdraws an ask you no longer need answered. To withdraw an ask of an agent you oversee, say why in `reason`: attn notes the reason on the ask's seed and tells the agent that asked, so it does not wait for an answer.
    args:
      - {name: ask, type: text, required: true, cli: pos, placeholder: "<id>", doc: "the ask's id"}
      - {name: reason, type: text, cli: "-m", placeholder: '"<why>"', doc: "why you withdraw an ask of an agent you oversee; required for those, and sent to the asker"}
    result: AskCloseResult