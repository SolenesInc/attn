# The ask family: an agent asking the user something they answer from attn.
# ask runs on the caller's machine, because it reads the images the markdown
# shows there; the home keeps the asks.
groups:
  - name: ask
    usage: "[list|show|close]"
    summary: "ask the user something they answer from attn"
    map:
      rows:
        - {need: "Ask the user a decision only they can make", tools: [ask, ask_list, ask_close]}
    flags:
      - {name: session, placeholder: "<id>", doc: "session id (defaults to the current session)"}
    doc: |
      Ask the user what you cannot settle alone. They answer from attn, without opening your terminal.

      After you ask, carry on with work that does not depend on the answer, then end your turn. Your session stays open, so the user can find you, talk to you and run commands in your terminal, and attn types the answer into this conversation as the user's message. While any of your asks is open, attn refuses a standby that would close your session, and names each ask.

      You can also read and withdraw the asks of the agents you oversee: the agents below you in your delegation chain, or every agent in your profile when you are the Chief. They are not your asks, and only the user answers them.
    sections:
      - title: Asking
        commands: [ask, ask list, ask show, ask close]

commands:
  - name: ask
    summary: open an ask in the user's queue; it returns at once
    core: true
    runs: here
    grant: own
    doc: |
      Opens an ask in the user's queue and returns its id at once. The user reads it cold, without this conversation: say in a few short sentences what the decision affects, what you know, why you recommend a choice, what waits on the answer, and what you will do if it stays unanswered. Ask only what you cannot settle yourself, a few questions at a time. To ask permission for a risky action, name the exact action and its target in the question, such as the command, branch or environment. The answer approves only what the question names.

      The ask is markdown. Question blocks in it ask the user something; an ask without one just tells them something: `:::question` (pick one choice), `:::question-multi` (pick any number of choices) and `:::question-text` (write an answer), each closed by `:::`. A block's first line is the question; the rest is context. Choices are "- [ ] label" or "- [ ] label — why"; "Recommended: <label>" marks yours.

      When a delegation assigned you a seed, the ask is about that seed; `seed` makes it about another seed you tend. The user sees which seed it concerns. The answer goes to whoever tends the seed by then. The seed stays open until the user answers: attn refuses an agent's harvest and names the open ask. Harvest after you act on the answer. Withering the seed withdraws its open asks.

      Images (![alt](path)) resolve against the folder the session started in; from the CLI, against the working directory, or beside the file the ask is read from. Name an image elsewhere by its absolute path. attn copies them when the ask opens, at most 5 MiB in all, so the user sees them as they were. An image that cannot be read refuses the ask.

      Carry on with work that does not depend on the answer; when none is left, end your turn, and do not wait or poll. While any of your asks is open, attn refuses a standby that would close your session. Withdraw an ask that no longer matters with `ask_close`. When the user answers, attn types the answer into the conversation as their message, approvals included. By then they have likely moved on and will not read what you write back there. If their answer asks you something, reply with a new ask. If you still need them, ask again.
    args:
      - {name: markdown, type: markdown, required: true, piped: true, cli: "--file", placeholder: "<path>", doc: "the ask's markdown, required; the CLI reads it from this file, or from stdin without one"}
      - {name: subject, type: text, cli: "--subject", doc: "the ask's subject (defaults to its first question)"}
      - {name: seed, type: seed, cli: "--seed", doc: "a seed you tend that the ask is about (defaults to the seed your delegation assigned you)"}
      - {name: base_dir, type: path, cli: internal, doc: "the folder the markdown's image paths resolve against: the working directory, or beside the file"}
    result: Ask

  - name: ask list
    summary: your open asks and those about seeds you tend, then the open asks of the agents you oversee
    runs: home
    grant: own
    read_only: true
    doc: |
      Lists your open asks and those about seeds you tend, then, apart from yours, the open asks of the agents you oversee.
    result: AskListResult

  - name: ask show
    summary: one ask, with who asked, its seed, its age and text
    runs: home
    grant: own
    read_only: true
    doc: |
      Prints one open ask you hold or oversee: who asked, its seed, its age and its text.
    args:
      - {name: ask, type: text, required: true, cli: pos, placeholder: "<id>", doc: "the ask's id"}
    result: AskShowResult

  - name: ask close
    summary: withdraw an ask you no longer need answered
    runs: home
    grant: own
    doc: |
      Withdraws an ask you no longer need answered. To withdraw an ask of an agent you oversee, say why in `reason`: attn notes the reason on the ask's seed and tells the agent that asked, so it does not wait for an answer.
    args:
      - {name: ask, type: text, required: true, cli: pos, placeholder: "<id>", doc: "the ask's id"}
      - {name: reason, type: text, cli: "-m", placeholder: '"<why>"', doc: "why you withdraw an ask of an agent you oversee; required for those, and sent to the asker"}
    result: AskCloseResult
