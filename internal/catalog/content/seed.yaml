  - name: seed check reopen
    summary: clear the report and verdict
    runs: home
    grant: full
    effect: act
    doc: |
      Clears the report and verdict.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: id, type: check_id, required: true, cli: pos}
      - {name: reason, type: text, cli: "-m", stdin: true, placeholder: '"<why>"', doc: "why, saved on the check move"}
