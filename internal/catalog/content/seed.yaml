      Defines a statement the seed must prove and prints its id, which the body cites. attn picks the next free id in the plot tree; `id` names one instead. On a plot, `shared` puts the check on each seed below the plot that has no children, and each of those seeds proves it with its own report. Removed ids are never reused.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: id, type: check_id, cli: pos}
      - {name: statement, type: text, required: true, cli: "-m", stdin: true, placeholder: '"<statement>"', doc: "what the seed must prove"}
      - {name: shared, type: bool, cli: "--shared", doc: "each seed below this plot that has no children proves the check with its own report"}
      - {name: ring, type: bool, cli: "--ring", doc: "give the current tender and watchers a seed update after this check move lands, and print who gets it"}
    result: SeedCheckResult

