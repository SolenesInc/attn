  - name: seed watch
    summary: watch this seed and its descendants
    runs: home
    grant: full
    effect: act
    doc: |
      Subscribes this session to the seed and its descendants, including children planted later. Delegation starts the same watch on the seed it binds. Tending a plot already covers its descendants until the claim ends. A crew member's watch belongs to the member and lasts across the member's sessions. `seed_show` names the subscriptions that still cover a seed. Restarting or resuming the same delegation does not restore a removed watch.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
    result: SeedWatchResult

  - name: seed unwatch
    summary: remove this seed's subscription
    runs: home
    grant: full
    effect: act
    doc: |
      Removes this seed's subscription. It also drops a queued update only when the session is not a current tender, not a covering tender, and not covered by another watch. Separate child watches remain, and an ancestor watch can still cover the seed. `seed_show` and this command name those subscriptions and the commands that remove them.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
    result: SeedWatchResult

  - name: seed remind
    summary: set a reminder that posts a message to the seed's mailbox
    runs: home
    grant: full
    effect: act
    doc: |
      Sets a reminder: at that time attn posts `message` to the seed's mailbox, which delivers it to whoever tends the seed then. When nobody tends it, the message waits for the next tender, who reads it with `agent_inbox`. `in` counts from now; `at` takes an RFC3339 time; one of them is required unless `clear`. attn checks once a minute, so a message can arrive up to a minute late. A seed holds one reminder, and a new one replaces it. The reminder ends when attn posts the message, when `clear` removes it, and when the seed is harvested or withered. `seed_show` and `seed_ls` print it until then. While someone tends the seed, only the tender, sessions above it in the delegation chain, the profile's chief and the user can set or clear its reminder; anyone can while nobody holds the claim, and nobody can force it.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: in, type: duration, cli: "--in", one_of: when, unless: clear, doc: "how long from now until the reminder: 20m, 2h or 1h30m"}
      - {name: at, type: time, cli: "--at", one_of: when, unless: clear, doc: "the time of the reminder, as an RFC3339 time such as 2026-11-05T09:00:00+01:00"}
      - {name: message, type: text, cli: "-m", stdin: true, placeholder: '"<message>"', unless: clear, doc: "the message to post; required unless --clear"}
      - {name: clear, type: bool, cli: "--clear", doc: "remove the reminder"}
    result: SeedReminderResult
    receipt: [changed, seed.id, seed.step_slug, seed.reminder.at]
    errors:
      - {code: clear_with_reminder, usage: true, fix: 'Pass {clear} alone.'}
      - {code: needs_time, usage: true, fix: 'Pass one of {in} or {at}, or {clear}.'}
      - {code: needs_message, usage: true, fix: 'Pass what the reminder says in {message}.'}
    examples:
      - {seed: s-7k3f9m, in: 20m, message: "Check the rollout of the new build"}
      - {seed: s-7k3f9m, at: "2026-11-05T09:00:00+01:00", message: "Ask for the review"}
      - {seed: s-7k3f9m, clear: true}

  - name: seed standby
    summary: wait for seed mail with this session closed
    runs: home
    grant: full
    effect: act
    upfront: true
    doc: |
      Puts a seed you tend on standby with `next`, a note saying what to do next, and closes this session. When mail reaches the seed, attn resumes the session and delivers the note; for a crew member it starts a session. `in` and `at` also set the seed's reminder to that time, with the note as its message, as `seed_remind` does. When the session can compact, attn compacts it before closing; end your turn right after the command. `stay` keeps this session open.

      attn refuses while the seed has mail you have not read; read it with `agent_inbox` first. attn also refuses to close the session while it has an open ask, about this seed, another seed or none, and names each ask: a wait on the user keeps the session open, so ask with `ask` and end your turn. When the user tells you to close while an ask about the seed is open, put the seed on standby with `stay`, then run `{attn agent close --self}`: the seed stays on standby, and the answer resumes you. When `garden_v2_enabled` is on, attn also refuses without `stay` while this session still tends another growing seed that is not on standby, leaving this seed unchanged: finish or park the others first, or pass `stay` on earlier seeds before putting the last one on standby to close.

      Only the seed's tender sets standby, from its own session, and the seed stays claimed while the session is closed. A new standby replaces the note. Standby ends once you have read all of the seed's mail, and when the seed is parked, harvested, withered or gets a new tender. If the session closes before reading the mail, the mail resumes it again. `clear` ends standby and leaves the reminder.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: next, type: text, cli: "-m", stdin: true, placeholder: '"<what to do next>"', unless: clear, doc: "what to do when the session resumes; required unless --clear"}
      - {name: in, type: duration, cli: "--in", one_of: when, doc: "also resume after this long: 20m, 2h or 1h30m"}
      - {name: at, type: time, cli: "--at", one_of: when, doc: "also resume at this time, as an RFC3339 time such as 2026-11-05T09:00:00+01:00"}
      - {name: stay, type: bool, cli: "--stay", doc: "keep this session open on standby"}
      - {name: clear, type: bool, cli: "--clear", doc: "end standby; the reminder stays"}
    result: SeedStandbyResult
    receipt: [changed, seed.id, seed.step_slug, seed.status, seed.reminder.at, seed.standby.set_at, seed.standby.pull_requests, seed.standby.resume_blocked, close.target_session_id, close.pending_compact]
    errors:
      - {code: clear_with_standby, usage: true, fix: 'Pass {clear} alone.'}
      - {code: in_and_at, usage: true, fix: 'Pass {in} or {at}, not both.'}
      - {code: needs_next, usage: true, fix: 'Pass what to do when mail resumes you in {next}.'}
    examples:
      - {seed: s-7k3f9m, at: "2026-11-13T09:00:00+01:00", next: "The user asked to pick this up Friday: rerun the backfill, then report the counts."}
      - {seed: s-7k3f9m, next: "Review is pending on #123. When it is approved, merge (the user approved this up front), then follow the deploy."}
      - {seed: s-7k3f9m, next: "Waiting for the user to try the build.", stay: true}
      - {seed: s-7k3f9m, clear: true}

  - name: seed export
    summary: write the raw body to a file for editing
    runs: home
    grant: full
    effect: read
    doc: |
      Exports the raw body with a first-line stamp naming this seed and its body hash. Edit it with any tool, keep its first line, then pass the whole text to `seed_edit`.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: out, type: path, cli: "--out", cli_only: true, doc: "file to write, <id>.md in the current directory by default; - writes to stdout"}
    result: SeedExportResult

  - name: seed edit
    summary: save an edited body
    runs: home
    grant: full
    effect: act
    doc: |
      Saves an exported body after editing the file with any tool. Keep the first stamp line: it names the body the edit started from. If the body changed since export, export again and reapply. Empty bodies are refused. Each edit saves a numbered version and a log entry; `note` adds what changed to that entry.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: body, type: markdown, required: true, cli: "-m", stdin: true, placeholder: "-", doc: "the exported text, edited, with its first stamp line"}
      - {name: note, type: text, cli: "--note", placeholder: '"<what changed>"', doc: "what changed, saved on the edit entry"}
    result: SeedEditResult
    receipt: [body_version, previous_bytes, new_bytes, seed.id, seed.step_slug]
    errors:
      - {code: not_exported, usage: true, fix: 'Export the seed, edit the file, and pass its whole text as {body}.'}
      - {code: not_stamped, fix: 'Pass the exported text whole as {body}, its first stamp line included.'}
      - {code: other_seed, fix: 'Export the seed you name in {seed}, reapply your change to that export, and pass it as {body}.'}
      - {code: invalid_body, fix: 'Keep text below the stamp line, within the body size limit.'}

  - name: seed rollback
    summary: restore an earlier body
    runs: home
    grant: full
    effect: act
    doc: |
      Restores the body before the newest version, or the numbered `version`. The restored body becomes a new version, so rollback can itself be rolled back. Edit entries in `seed_notes` show the versions and size changes.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: version, type: version, cli: pos}
    result: SeedRollbackResult
    receipt: [restored_version, body_version, previous_bytes, new_bytes, seed.id, seed.step_slug]

  - name: seed authorization
    summary: set, clear or print the task's authorization
    runs: home
    grant: own
    effect: act
    doc: |
      Sets, clears or prints the task's authorization: the steps agents take beyond the project's guidance and the steps they stop before, written as instructions. Set only what the user allowed. Delegation openings deliver the words. When someone other than the seed's tender changes the words, attn types the change into the tender's conversation as the user's message, waiting while the tender needs approval. With neither `words` nor `clear`, prints them and the state of the last typed update. Who may change them follows seed moves: the tender, sessions above it in the delegation chain, and the profile's chief; anyone in the profile while nobody holds the seed.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: words, type: text, cli: pos, one_of: change, placeholder: '"<words>"', doc: "the instructions"}
      - {name: clear, type: bool, cli: "--clear", one_of: change, doc: "remove the authorization"}
    result: SeedAuthorizationResult
    receipt: [changed, caller_tends, update, seed.id, seed.step_slug, seed.authorization]
    errors:
      - {code: empty_words, usage: true, fix: 'Pass the words, or {clear} to remove the authorization.'}
      - {code: words_and_clear, usage: true, fix: 'Pass the words or {clear}, not both.'}

  - name: seed attach
    summary: give the seed a file or a document to keep
    runs: home
    grant: full
    effect: act
    upfront: true
    doc: |
      Puts a local regular file in durable seed-owned storage, or records a document that stays where it lives. For a local file, `mode` is required: move transfers the file and leaves one editable canonical file, which is the recommended choice; copy keeps an independent source snapshot. Git-tracked files must use copy. A file the seed already has by that name is replaced, and `seed_show` marks check evidence replaced after its report; re-attaching an unchanged file changes nothing. A `path` in a `repo`, a `notebook` document and a `url` remain associations, and `note` goes on the log with them.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: path, type: path, cli: "--path", one_of: document, placeholder: "<file>", doc: "the local file; with `repo`, a path in that repository"}
      - {name: notebook, type: text, cli: "--notebook", one_of: document, placeholder: "<id>", doc: "a Notebook document"}
      - {name: url, type: url, cli: "--url", one_of: document, doc: "anything reachable by URL"}
      - {name: mode, type: text, cli: "--move|--copy", values: [move, copy], doc: "move transfers a local file into seed ownership; copy snapshots it"}
      - {name: repo, type: name, cli: "--repo", placeholder: "<repository>", doc: "the repository that path lives in"}
      - {name: note, type: text, cli: "-m", stdin: true, placeholder: '"<note>"', doc: "a note on the log for an association"}
    result: SeedArtifactResult
    receipt: [seed_id, id, operation, operation_id, recovered, replaced, artifact.filename, artifact.kind, artifact.repository, artifact.path, artifact.notebook_document_id, artifact.url, source_path, destination_path, relative_target]
    errors:
      - {code: no_document, fix: 'Name one document with {path}, {notebook} or {url}.'}
      - {code: two_documents, fix: 'Name one document per call.'}
      - {code: transfer_with_note, fix: 'Leave out {note}; a managed transfer records its own receipt.'}
      - {code: transfer_needs_local_path, fix: 'Pass a local {path} without {repo}, or leave out {mode}.'}
      - {code: transfer_needs_mode, fix: 'Pass {mode}: move is recommended, copy keeps the source.'}
    examples:
      - {seed: s-7k3f9m, path: retry.log, mode: move}
      - {seed: s-7k3f9m, path: plan.md, mode: copy}
      - {seed: s-7k3f9m, path: docs/design.md, repo: attn}
      - {seed: s-7k3f9m, url: "https://example.com/spec"}

  - name: seed detach
    summary: move a managed artifact back out, or drop an association
    runs: home
    grant: full
    effect: act
    doc: |
      Moves a managed artifact back out of the seed to `to`, and never overwrites. `reference` removes an old linked path association instead. `repo`, `notebook` and `url` drop the association they name, and `note` goes on the log with it.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: path, type: text, cli: "--path", one_of: document, placeholder: "<filename>", doc: "the managed filename, or the linked path"}
      - {name: notebook, type: text, cli: "--notebook", one_of: document, placeholder: "<id>", doc: "a Notebook document"}
      - {name: url, type: url, cli: "--url", one_of: document, doc: "anything reachable by URL"}
      - {name: to, type: path, cli: "--to", placeholder: "<destination>", doc: "the destination that receives a managed artifact"}
      - {name: reference, type: bool, cli: "--reference", doc: "remove an old linked path association"}
      - {name: repo, type: name, cli: "--repo", placeholder: "<repository>", doc: "the repository that path lives in"}
      - {name: note, type: text, cli: "-m", stdin: true, placeholder: '"<note>"', doc: "a note on the log for an association"}
    result: SeedArtifactResult
    receipt: [seed_id, id, operation, operation_id, recovered, replaced, artifact.filename, artifact.kind, artifact.repository, artifact.path, artifact.notebook_document_id, artifact.url, source_path, destination_path, relative_target]
    errors:
      - {code: reference_needs_path, fix: 'Pass the linked {path} without {repo}.'}
      - {code: no_document, fix: 'Name one document with {path}, {notebook} or {url}.'}
      - {code: two_documents, fix: 'Name one document per call.'}
      - {code: transfer_with_note, fix: 'Leave out {note}; a managed transfer records its own receipt.'}
      - {code: transfer_needs_managed_path, fix: 'Pass the managed filename in {path} without {repo}, or leave out {to}.'}
      - {code: detach_needs_to, fix: 'Pass {to} with the destination, or {reference} to remove an old linked path.'}
    examples:
      - {seed: s-7k3f9m, path: retry.log, to: ./retry.log}
      - {seed: s-7k3f9m, path: notes.md, reference: true}

  - name: seed bed ls
    summary: list the profile's curated beds, their repos and open seed counts
    runs: home
    grant: own
    effect: read
    doc: |
      Lists every curated bed in this profile, alphabetically by name, with its slug, optional note, bound auto-routing repositories, and count of open seeds. Requires `garden_v2_enabled`.
    result: SeedBedListResult

  - name: seed bed add
    summary: create a curated bed
    runs: home
    grant: full
    effect: act
    doc: |
      Creates a curated bed in this profile. Only create a bed when the user asks for one. `repos` binds repository paths or bare repository names so new root seeds planted from those repositories land in this bed automatically. A path belongs to the caller's machine. Use an address such as `build:/work/payments` for a different machine. A bare repository name matches on any machine. A matching path takes precedence over a bare name. Two beds cannot claim the same path on the same machine or the same bare name. Requires `garden_v2_enabled`.
    args:
      - {name: name, type: name, required: true, cli: pos, placeholder: '"<name>"', doc: "the bed's display name (one line, at most 60 characters)"}
      - {name: note, type: text, cli: "-m", stdin: true, placeholder: '"<one-line note>"', doc: "optional one-line description (at most 200 characters)"}
      - {name: repos, type: text, list: true, cli: "--repo", placeholder: "<path|name>", doc: "repository path, machine:/path address, or shared bare repository name; repeats"}
    result: SeedBedResult
    examples:
      - {name: "Payments", note: "Checkout and billing", repos: ["payments-api"]}

  - name: seed bed set
    summary: update a bed's name, note or repos
    runs: home
    grant: full
    effect: act
    doc: |
      Updates an existing bed in this profile by id, name or slug. Only edit a bed when the user asks. Passing `repos` replaces the bed's repository list. Paths use the caller's machine unless qualified as `machine:/path`. Bare names match on any machine. `clear_repos` clears the list. Requires `garden_v2_enabled`.
    args:
      - {name: bed, type: text, required: true, cli: pos, placeholder: "<bed>", doc: "the bed's id, name or slug"}
      - {name: name, type: name, cli: "--name", placeholder: '"<name>"', doc: "new display name"}
      - {name: note, type: text, cli: "-m", stdin: true, one_of: note_change, placeholder: '"<one-line note>"', doc: "new one-line description"}
      - {name: clear_note, type: bool, cli: "--clear-note", one_of: note_change, doc: "remove the bed's note"}
      - {name: repos, type: text, list: true, cli: "--repo", one_of: repo_change, placeholder: "<path|name>", doc: "replace the bed's repository paths, machine:/path addresses, or shared bare names; repeats"}
      - {name: clear_repos, type: bool, cli: "--clear-repos", one_of: repo_change, doc: "remove all auto-routing repositories"}
    result: SeedBedResult
    errors:
      - {code: note_and_clear, usage: true, fix: 'Pass {note} or {clear_note}, not both.'}
      - {code: repos_and_clear, usage: true, fix: 'Pass {repos} or {clear_repos}, not both.'}
      - {code: nothing_to_change, usage: true, fix: 'Pass at least one of {name}, {note}, {clear_note}, {repos} or {clear_repos}.'}

  - name: seed bed rm
    summary: remove a curated bed and leave its seeds unassigned
    runs: home
    grant: full
    effect: act
    doc: |
      Removes a curated bed by id, name or slug. Seeds assigned to that bed keep their state and become unassigned. Only remove a bed when the user asks. Requires `garden_v2_enabled`.
    args:
      - {name: bed, type: text, required: true, cli: pos, placeholder: "<bed>", doc: "the bed's id, name or slug"}
    result: SeedBedDeleteResult

  - name: seed bed assign
    summary: assign a root seed or plot to an existing bed, or clear its bed
    runs: home
    grant: own
    effect: act
    doc: |
      Assigns a root seed or plot to an existing curated bed in this profile, or clears its bed with `clear`. Child seeds inherit their root plot's bed and cannot be assigned separately. Refuses unknown beds and lists the profile's beds. Requires `garden_v2_enabled`.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: bed, type: text, cli: pos, one_of: target, placeholder: "<bed>", doc: "the existing bed's id, name or slug"}
      - {name: clear, type: bool, cli: "--clear", one_of: target, doc: "clear the seed's bed assignment"}
    result: SeedBedAssignResult
    receipt: [changed, seed.id, seed.step_slug, seed.bed, seed.bed_id]
    errors:
      - {code: bed_and_clear, usage: true, fix: 'Pass a bed or {clear}, not both.'}
      - {code: needs_bed, usage: true, fix: 'Pass an existing bed or {clear}.'}
    examples:
      - {seed: s-7k3f9m, bed: "Payments"}
      - {seed: s-7k3f9m, clear: true}

  - name: seed pulse
    summary: set or clear a seed's one-line status pulse
    runs: home
    grant: own
    effect: record
    doc: |
      Sets or clears a seed's current one-line status pulse (single line, at most 160 characters) shown in the Garden without writing a log note. Update it when starting a phase, hitting a milestone, or blocking on something. Who may change it follows seed moves: the tender, sessions above it in the delegation chain, the profile's chief, or anyone while unclaimed. Refused on closed seeds. Requires `garden_v2_enabled`.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: text, type: text, cli: "-m", stdin: true, one_of: change, maxLength: 160, placeholder: '"<one-line status>"', doc: "one-line summary of where the work stands"}
      - {name: clear, type: bool, cli: "--clear", one_of: change, doc: "clear the seed's pulse"}
    result: SeedPulseResult
    receipt: [changed, seed.id, seed.step_slug, seed.pulse]
    errors:
      - {code: text_and_clear, usage: true, fix: 'Pass {text} or {clear}, not both.'}
      - {code: needs_pulse, usage: true, fix: 'Pass a one-line status in {text}, or {clear}.'}
    examples:
      - {seed: s-7k3f9m, text: "Wire tests green; verifying live CLI output"}
      - {seed: s-7k3f9m, clear: true}
