  - name: seed watch
    summary: watch this seed and its descendants
    runs: home
    grant: full
    wrong_args: 'needs exactly one seed id, got {count}: attn seed watch s-7k3f9m'
    doc: |
      Subscribes this session to the seed and its descendants, including children planted later. Delegation starts the same watch on the seed it binds. Tending a plot already covers its descendants until the claim ends. A crew member's watch belongs to the member and lasts across the member's sessions. `seed_show` names the subscriptions that still cover a seed. Restarting or resuming the same delegation does not restore a removed watch.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
    result: SeedWatchResult

  - name: seed unwatch
    summary: remove this seed's subscription
    runs: home
    grant: full
    wrong_args: 'needs exactly one seed id, got {count}: attn seed unwatch s-7k3f9m'
    doc: |
      Removes this seed's subscription. It also drops a queued update only when the session is not a current tender, not a covering tender, and not covered by another watch. Separate child watches remain, and an ancestor watch can still cover the seed. `seed_show` and this command name those subscriptions and the commands that remove them.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
    result: SeedWatchResult

  - name: seed remind
    summary: set a reminder that posts a message to the seed's mailbox
    runs: home
    grant: full
    wrong_args: 'needs exactly one seed id: attn seed remind s-7k3f9m --in 20m -m "Check the rollout"'
    doc: |
      Sets a reminder: at that time attn posts `message` to the seed's mailbox, which delivers it to whoever tends the seed then. When nobody tends it, the message waits for the next tender, who reads it with `attn agent inbox`. `in` counts from now; `at` takes an RFC3339 time; one of them is required unless `clear`. attn checks once a minute, so a message can arrive up to a minute late. A seed holds one reminder, and a new one replaces it. The reminder ends when attn posts the message, when `clear` removes it, and when the seed is harvested or withered. `seed_show` and `seed_ls` print it until then. While someone tends the seed, only the tender, sessions above it in the delegation chain, the profile's chief and the user can set or clear its reminder; anyone can while nobody holds the claim, and nobody can force it.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: in, type: duration, cli: "--in", one_of: when, unless: clear, doc: "how long from now until the reminder: 20m, 2h or 1h30m"}
      - {name: at, type: time, cli: "--at", one_of: when, unless: clear, doc: "the time of the reminder, as an RFC3339 time such as 2026-11-05T09:00:00+01:00"}
      - {name: message, type: text, cli: "-m", stdin: true, placeholder: '"<message>"', unless: clear, doc: "the message to post; required unless --clear"}
      - {name: clear, type: bool, cli: "--clear", doc: "remove the reminder"}
    result: SeedReminderResult
    examples:
      - {seed: s-7k3f9m, in: 20m, message: "Check the rollout of the new build"}
      - {seed: s-7k3f9m, at: "2026-11-05T09:00:00+01:00", message: "Ask for the review"}
      - {seed: s-7k3f9m, clear: true}

  - name: seed standby
    summary: wait for seed mail with this session closed
    runs: home
    grant: full
    wrong_args: 'needs exactly one seed id: attn seed standby s-7k3f9m -m "what to do next"'
    doc: |
      Puts a seed you tend on standby with `next`, a note saying what to do next, and closes this session. When mail reaches the seed, attn resumes the session and delivers the note; for a crew member it starts a session. `in` and `at` also set the seed's reminder to that time, with the note as its message, as `seed_remind` does. When the session can compact, attn compacts it before closing; end your turn right after the command. `stay` keeps this session open.

      attn refuses while the seed has mail you have not read; read it with `attn agent inbox` first. attn also refuses to close the session while it has an open ask, about this seed, another seed or none, and names each ask: a wait on the user keeps the session open, so ask with `attn ask` and end your turn. When the user tells you to close while an ask is open, put the seed on standby with `stay`, then run `attn agent close --self`: the seed stays on standby, and the answer resumes you.

      Only the seed's tender sets standby, from its own session, and the seed stays claimed while the session is closed. A new standby replaces the note. Standby ends once you have read all of the seed's mail, and when the seed is parked, harvested, withered or gets a new tender. If the session closes before reading the mail, the mail resumes it again. `clear` ends standby and leaves the reminder.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: next, type: text, cli: "-m", stdin: true, placeholder: '"<what to do next>"', unless: clear, doc: "what to do when the session resumes; required unless --clear"}
      - {name: in, type: duration, cli: "--in", one_of: when, doc: "also resume after this long: 20m, 2h or 1h30m"}
      - {name: at, type: time, cli: "--at", one_of: when, doc: "also resume at this time, as an RFC3339 time such as 2026-11-05T09:00:00+01:00"}
      - {name: stay, type: bool, cli: "--stay", doc: "keep this session open on standby"}
      - {name: clear, type: bool, cli: "--clear", doc: "end standby; the reminder stays"}
    result: SeedStandbyResult
    examples:
      - {seed: s-7k3f9m, at: "2026-11-13T09:00:00+01:00", next: "The user asked to pick this up Friday: rerun the backfill, then report the counts."}
      - {seed: s-7k3f9m, next: "Review is pending on #123. When it is approved, merge (the user approved this up front), then follow the deploy."}
      - {seed: s-7k3f9m, next: "Waiting for the user to try the build.", stay: true}
      - {seed: s-7k3f9m, clear: true}

  - name: seed export
    summary: write the raw body to a file for editing
    runs: home
    grant: full
    read_only: true
    wrong_args: 'needs exactly one seed id, got {count}: attn seed export s-7k3f9m'
    doc: |
      Writes the raw body with a first-line stamp naming this seed and its body hash. Edit the file with any tool, keep its first line, then submit it with `attn seed edit <id> -m - < <id>.md`. `out` - writes to stdout; the default is <id>.md in the current directory.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: out, type: path, cli: "--out", doc: "file to write; - writes to stdout"}
    result: SeedExportResult

  - name: seed edit
    summary: save an edited body
    runs: home
    grant: full
    wrong_args: 'needs exactly one seed id, got {count}: attn seed edit s-7k3f9m -m -'
    doc: |
      Saves an exported body after editing the file with any tool. Keep the first stamp line: it names the body the edit started from. If the body changed since export, export again and reapply. Empty bodies are refused. Each edit saves a numbered version and a log entry; `note` adds what changed to that entry.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: body, type: markdown, required: true, cli: "-m", stdin: true, placeholder: "-", doc: "the edited file, with its stamp line; - reads stdin"}
      - {name: base, type: text, required: true, cli: stamp}
      - {name: note, type: text, cli: "--note", placeholder: '"<what changed>"', doc: "what changed, saved on the edit entry"}
    result: SeedEditResult

  - name: seed rollback
    summary: restore an earlier body
    runs: home
    grant: full
    wrong_args: 'needs a seed id and optional version: attn seed rollback s-7k3f9m [<version>]'
    doc: |
      Restores the body before the newest version, or the numbered `version`. The restored body becomes a new version, so rollback can itself be rolled back. Edit entries in `seed_notes` show the versions and size changes.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: version, type: version, cli: pos}
    result: SeedRollbackResult

  - name: seed authorization
    summary: set, clear or print the task's authorization
    runs: home
    grant: own
    wrong_args: 'needs a seed id and optional words: attn seed authorization s-7k3f9m "Ask me before pushing."'
    doc: |
      Sets, clears or prints the task's authorization: the steps agents take beyond the project's guidance and the steps they stop before, written as instructions. Set only what the user allowed. Delegation openings deliver the words. When someone other than the seed's tender changes the words, attn types the change into the tender's conversation as the user's message, waiting while the tender needs approval. With neither `words` nor `clear`, prints them and the state of the last typed update. Who may change them follows seed moves: the tender, sessions above it in the delegation chain, and the profile's chief; anyone in the profile while nobody holds the seed.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: words, type: text, cli: pos, one_of: change, placeholder: '"<words>"', doc: "the instructions"}
      - {name: clear, type: bool, cli: "--clear", one_of: change, doc: "remove the authorization"}
    result: SeedAuthorizationResult

  - name: seed attach
    summary: give the seed a file or a document to keep
    runs: home
    grant: full
    wrong_args: 'needs exactly one seed id, got {count}: attn seed attach s-7k3f9m --path docs/plans/thing.md'
    doc: |
      Puts a local regular file in durable seed-owned storage, or records a document that stays where it lives. For a local file, `mode` is required: move transfers the file and leaves one editable canonical file, which is the recommended choice; copy keeps an independent source snapshot. Git-tracked files must use copy. A file the seed already has by that name is replaced, and `seed_show` marks check evidence replaced after its report; re-attaching an unchanged file changes nothing. A `path` in a `repo`, a `notebook` document and a `url` remain associations, and `note` goes on the log with them.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: path, type: path, cli: "--path", one_of: document, placeholder: "<file>", doc: "the local file, or a file in --repo"}
      - {name: notebook, type: text, cli: "--notebook", one_of: document, placeholder: "<id>", doc: "a Notebook document"}
      - {name: url, type: url, cli: "--url", one_of: document, doc: "anything reachable by URL"}
      - {name: mode, type: text, cli: "--move|--copy", values: [move, copy], doc: "move transfers a local file into seed ownership; copy snapshots it"}
      - {name: repo, type: name, cli: "--repo", placeholder: "<repository>", doc: "the repository that path lives in"}
      - {name: note, type: text, cli: "-m", stdin: true, placeholder: '"<note>"', doc: "a note on the log for an association"}
    result: SeedArtifactResult
    examples:
      - {seed: s-7k3f9m, path: retry.log, mode: move}
      - {seed: s-7k3f9m, path: plan.md, mode: copy}
      - {seed: s-7k3f9m, path: docs/design.md, repo: attn}
      - {seed: s-7k3f9m, url: "https://example.com/spec"}

  - name: seed detach
    summary: move a managed artifact back out, or drop an association
    runs: home
    grant: full
    wrong_args: 'needs exactly one seed id, got {count}: attn seed detach s-7k3f9m --path docs/plans/thing.md'
    doc: |
      Moves a managed artifact back out of the seed to `to`, and never overwrites. `reference` removes an old linked path association instead. `repo`, `notebook` and `url` drop the association they name, and `note` goes on the log with it.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: path, type: path, cli: "--path", one_of: document, placeholder: "<filename>", doc: "the managed filename, or the linked path"}
      - {name: notebook, type: text, cli: "--notebook", one_of: document, placeholder: "<id>", doc: "a Notebook document"}
      - {name: url, type: url, cli: "--url", one_of: document, doc: "anything reachable by URL"}
      - {name: to, type: path, cli: "--to", placeholder: "<destination>", doc: "the destination that receives a managed artifact"}
      - {name: reference, type: bool, cli: "--reference", doc: "remove an old linked path association"}
      - {name: repo, type: name, cli: "--repo", placeholder: "<repository>", doc: "the repository that path lives in"}
      - {name: note, type: text, cli: "-m", stdin: true, placeholder: '"<note>"', doc: "a note on the log for an association"}
    result: SeedArtifactResult
    examples:
      - {seed: s-7k3f9m, path: retry.log, to: ./retry.log}
      - {seed: s-7k3f9m, path: notes.md, reference: true}

