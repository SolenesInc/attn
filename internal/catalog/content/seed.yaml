    result: SeedCheckResult
    receipt: [check_id, seed.id, seed.step_slug, seed.status, seed.checks.id, seed.checks.state, seed.checks.removed, seed.checks.report.at, seed.checks.report.evidence.artifact, seed.checks.report.evidence.url, attached, ring_recipients, live_delegate]
