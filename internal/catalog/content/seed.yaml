  - name: seed check report
    summary: record the proof for a check in one call
    core: true
    runs: home
    grant: own
    wrong_args: 'needs the seed id and one check id, got {count} arguments'
    no_args: 'needs the seed id'
    doc: |
      Records the proof for a check in one call: `summary`, one line of at most {max_check_summary_chars} characters that `seed_show` prints, and `detail`, kept in the report's check note. Together they fit in {max_note_kib} KiB. `evidence` is a local file, an artifact on the seed, or an http(s) URL, and can repeat. A local file is copied onto the seed, replacing its file of the same name, unless it already sits in the seed's artifact folder. A refused report lists every problem it found; nothing is recorded. A new report clears the verdict. `seed_show` marks cited evidence replaced after the report. If a check doesn't apply, report that too: say why and cite what shows it. The verdict decides.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: id, type: check_id, required: true, cli: pos}
      - {name: summary, type: text, required: true, cli: "-m", stdin: true, maxLength: 400, placeholder: '"<summary line>[\n\n<detail>]"', doc: "the summary line, then the detail after a blank line; - reads stdin"}
      - {name: detail, type: markdown, cli: "-m+"}
      - {name: evidence, type: text, list: true, cli: "--evidence", placeholder: "<file|artifact|url>", doc: "a local file to copy onto the seed, an artifact on the seed, or an http(s) URL; repeats"}
      - {name: commit, type: revision, cli: "--commit", doc: "the commit the evidence came from, resolved with git rev-parse in the current directory"}
      - {name: ring, type: bool, cli: "--ring", doc: "give the current tender and watchers a seed update after this check move lands, and print who gets it"}
    result: SeedCheckResult
    examples:
      - {seed: s-7k3f9m, id: C1, summary: "Retries pass", evidence: [retry.log]}

