# The seed family. Write each doc for both surfaces: name an arg by its tool
# name in backticks (`summary`) and another command by its tool name in
# backticks (`seed_show`). The CLI's help and the garden reference print them as
# the flag (`-m`) and the command (`attn seed show`).
groups:
  - name: seed
    summary: |
      A seed is the unit of work: one document, one short id, one slug made of the title's key words, planted in the garden. Commands take the id or the slug; a slug two seeds share is refused, listing each match. Anything worth handing off, parking, or attributing is a seed.
    flags:
      - {name: profile, placeholder: "<name|id>", doc: "the garden of this profile; required outside attn when several profiles exist"}
      - {name: session, placeholder: "<id>", doc: "the session asking (defaults to the current session)"}
    reference:
      name: garden
      title: "The garden: seeds, plots, and reporting"
      intro: |
        The garden is where work lives, inside your session's profile. Seeds belong to their planting profile for life. Lists, relationships, claims and delegations stay in that profile. Outside attn, seed commands require `--profile <name|id>` when several profiles exist. Run `attn seed prime` for working rules.

        Before you write a plot, read `attn seed guide` for body authoring, a complete plot example and completion checks. `attn seed --help` lists every command, and `attn seed <command> --help` gives one command's syntax and flags.
    sections:
      - title: Speaking the user's language
        text: |
          Garden words have Jira-style equivalents: seed = ticket, ready = todo, plot = epic, harvested = done. Use the Garden word by default. When the user uses one of those Jira words, mirror it for that concept for the rest of the exchange. Do not correct them or switch the other concepts unless they do.
      - title: Speaking of seeds
        text: |
          Every command prints a seed as `id  slug  title`. `attn seed`, `attn delegate --seed` and `attn ask --seed` take either the id or the slug. `attn open` and `attn agent msg` take the id. Give other agents the id, because attn refuses a slug that two seeds share and the refusal lists each match. To the user, say the slug: `mermaid-rendered-grid` (`s-7k3f9m`) on the first mention, then the slug alone. Never make a person decode an id.
      - title: Planting work
        text: |
          Track work that outlives this turn in seeds, not in markdown TODO lists or your harness's todo tool, because those end with the session. Examples are a bug you found, a follow-up you are not doing now, and a piece you split off. Search before you plant, so you find work that already exists instead of planting it twice. Plant work before you start it, so the claim and the log exist while you work. Under a plot, plant with `--part-of <plot>` so the new seed stays with the plot's plan. If you discover work while tending another seed, add `--discovered-from <seed>` so the origin is on record. Before your turn ends, plant what is still undone.

          Every seed body, including the body of a plot child, is a work prompt for someone without this conversation. WRITING A BODY in `attn seed guide` says what the prompt contains.
        commands: [seed search, seed plant]
      - title: Planting a plot
        text: |
          Keep the shared plan in the parent. In each child, name the child's own work. Also name each parent section, sibling result, or artifact the child needs, and say why. The agent that tends the child reads those sources before it starts, because a delegation does not include related bodies automatically. The example in `attn seed guide` shows complete bodies and dependencies.
        commands: [seed plot, seed link, seed unlink]
      - title: Finding and reading work
        text: |
          Every change to a seed adds an entry to the seed's log: notes, handoffs, moves, links, edits, checks, attachments and answers. `attn seed show <id>` prints a bookmark under the seed's header, `bookmark  attn seed show <id> --since <N>`, then the newest entries. `attn seed notes <id>` lists the whole log and ends with its own bookmark line. Run a bookmark later to get only the entries saved after N, on the seed and every seed below it, each labeled with its seed. That read ends with a new bookmark. Keep the bookmark from your last read and read since that bookmark, instead of reading the whole seed again. When a bookmark is older than the entries the event log keeps, the read says so and gives the full seed instead.
        commands: [seed ready, seed ls, seed show, seed notes, seed prime, seed guide]
      - title: Tending a seed
        text: |
          The moves are tend, park, harvest, wither and replant. A move needs no `--force` when the actor is one of these:

          - the claim's tender
          - a session above the tender in the delegation chain
          - the profile's chief

          A move also needs no `--force` after the tender's session ends, because a session's claim lapses when the session ends, unless the seed is on standby. The claim holds again if the session resumes. A crew member's claim lasts across the member's sessions.

          Everyone else needs `--force`, and the log records that they used it. A call without a live session has no standing. A move records who acted and whose claim ended, and prints the audit note and the sessions attn rang. A delegate hears the move through the delegate's delegation watch.

          Repeating a move to the same state succeeds without rewriting the seed or ringing anyone. A different reason goes on the seed's log as a quiet note. To move between harvested and withered, run `attn seed replant <id>` first.
        commands: [seed tend, seed note, seed park, seed replant, seed wither, seed send-to-chief]
      - title: Closing a seed or a plot
        text: |
          Harvest and wither refuse on a plot while any direct child is planted, growing or parked, even with `--force` or `--when-merged`. The refusal names each open child. To close the plot, first close each open child or move its follow-ups out. To give up your claim on the plot without closing it, run `attn seed replant <plot>`. When the last open child closes, attn adds a ringing note to the plot and names the plot in the output. The plot keeps its state.

          When the only thing left on a seed is a pull request merging, say so once with `attn seed harvest <id> --when-merged` and let attn close it. A seed you were growing is parked, and attn releases your claim. Every surface then shows `harvests when owner/repo#n merges`. When the merge lands, attn harvests the seed as the member `attn`, with your reason. If a pull request closes without merging, attn clears the arming and rings instead, and the seed stays where it was. If the seed has gained open children or an open ask, attn clears the arming at the merge and explains why. Use `--when-merged` only when the merge is genuinely the last step. Review notes to answer, docs to write, and evidence to attach are work, and work belongs to a tender.

          An ask about the seed keeps it open, and its answer comes to whoever tends the seed. The user's own harvest and any wither withdraw the seed's open asks, and the command names them.
        commands: [seed harvest]
      - title: Checks
        text: |
          A check is a numbered statement (C1) that a seed must prove. attn stores the check on the seed as data, with its latest report and verdict. Cite the check by id in the body. Define checks with `checks` in plot JSON, with `--check "<statement>"` on plant, or later with `attn seed check add`. Each gives the check the next free id in the plot tree and prints that id. A plot check marked shared applies to every seed below the plot that has no children, and each of those seeds needs its own report for it. `attn seed show` lists a seed's checks, including inherited ones, as open, reported, confirmed or rejected.

          Whoever does the work reports each check, as Report each check as you prove it (`attn skill --reference delegated-agent`) describes. Whoever judges the work confirms or rejects. Checks never block a move. The harvest command lists the checks that are still open or rejected. Add `--ring` to a check command when the other side must act now.
        commands: [seed check add, seed check edit, seed check remove, seed check restore, seed check report, seed check confirm, seed check reject, seed check uncheck, seed check reopen]
      - title: Rings and watches
        text: |
          A plot's tender hears updates from every seed under the plot, including grandchildren, without a watch. When the claim ends, that coverage ends and attn withdraws unread updates unless a watch still covers them. Lifecycle moves ring current and covering tenders and watching sessions, and print who they rang. Harvesting or withering a blocker also rings the parties of each seed it was blocking, unless another open blocker still holds that seed. Notes stay quiet unless you add `--ring`. A successful action never rings the session that caused it. Automation acceptance is quiet, and its bell waits until the work is ready or the attempt needs attention.

          A bell carries the seed, what moved, and the read that shows it: `attn seed show <id> --since <N>`, where N is the bookmark just before the first change the bell covers. Later changes join the unread bell, and the same read returns them too. Any `show` or `notes` of the seed resets the bell for the next meaningful move. You cannot recall updates already read or handed to an agent.
        commands: [seed watch, seed unwatch]
      - title: Reminders and standby
        text: |
          Standby closes your session for a wait that needs nobody in it: a time, a pull request, another seed or another agent. If you tend no seed for the work, plant one first. A wait on the user is different. Ask with `attn ask` and end your turn. Your session stays open, so the user can find you, talk to you and run commands in your terminal, and attn types the answer into this conversation.

          Seed mail is a reminder, a message sent with `attn agent msg <seed-id>`, an answer to an ask about the seed, or an update from a PR watch on the seed. The setting `garden.tender_resume` chooses which mail resumes a session: `any` (the default), `watches` (PR watches and reminders) or `off`. attn resumes a tender at most 48 times per seed in 24 hours. When it cannot resume one, it notes the reason on the seed and notifies the user, and the mail stays unread.

          The note is the first thing the resumed session reads, so write down anything the user approved up front, such as "merge once approved". The resumed session should act without waiting for the user: go on standby again, harvest, ask with `attn ask`, or report on the seed.
        commands: [seed remind, seed standby]
      - title: Bodies and authorization
        text: |
          To change a body, export it, edit the file, and submit it with `attn seed edit`. EDITING A BODY in `attn seed guide` gives the steps and explains how to roll back an edit.
        commands: [seed export, seed edit, seed rollback, seed authorization]
      - title: Artifacts
        text: |
          To bring a local file into durable seed ownership, choose Move or Copy explicitly. Prefer Move. Tracked Git files must use Copy. Repository, Notebook and URL documents remain links where they already live.

          When you name a seed's artifact to the next agent, say which copy is canonical. For a repository document, the Git file is canonical, so name its branch and introducing commit in the brief. For a Notebook document, the Notebook file is canonical. Notes on the seed record meaningful edits, renames and deletions, and tell you when to read the plan again.

          The Garden labels old path associations as linked files. Bring a linked file into seed ownership explicitly with Move or Copy. A failed transfer leaves the link alone.
        commands: [seed attach, seed detach]
      - title: Garden review
        commands: [seed review start, seed review show, seed review cancel, seed review retry, seed review keep]
      - title: Packets
        text: |
          A packet is a plot flagged as a template with declared variables. attn cannot yet create seeds from a packet. `attn seed show` says `packet yes`, and `attn seed ready` skips the packet's subtree.

  - name: seed check
    summary: define, report, or judge what a seed must prove
    doc: |
      Define, report, or judge what a seed must prove. Each move has its own --help. Checks never block a move. harvest lists the checks still open or rejected.

  - name: seed review
    summary: an advisory Garden review
    doc: |
      Start an advisory Garden review, inspect its progressive results, cancel unfinished classification, retry one failed or changed item, or keep one seed growing and review it again after seven quiet days. The review never changes a seed's state.

commands:
  - name: seed search
    summary: find seeds by words, closed ones included
    runs: home
    grant: own
    read_only: true
    wrong_args: 'needs something to look for: `attn seed search <words>`'
    doc: |
      Finds seeds by words across your profile's garden, harvested and withered included: titles, bodies and log entries. Words match as stemmed prefixes; identifier parts match too. Seeds carrying some words also appear. Ranks by title coverage, word coverage, relevance and recency, with a boost for open seeds. Prints status, last active and an original matching line. Search before you plant, so a duplicate is found instead of created.
    args:
      - {name: words, type: text, required: true, cli: rest, placeholder: "<words>", doc: "the words to find"}
      - {name: limit, type: count, cli: "--limit", doc: "how many hits to answer with (default {default_results}, at most {max_results})"}
    result: SeedSearchResult
    examples:
      - {words: "retry uploader"}

  - name: seed plant
    summary: plant a seed and print its id, slug and title
    runs: home
    grant: own
    wrong_args: 'needs exactly one title, got {count}: attn seed plant "what this is" [-m "the detail"]'
    doc: |
      Plants a seed and prints its id, slug and title. `body` takes markdown; if the seed gains children, that body is the plot's plan. `part_of` plants it under a plot. `checks` defines what the seed must prove; attn numbers each check unless C#= names the id, and prints each id. Lists up to 3 similar open seeds in your profile, leaving out that plot. Planting always proceeds. If one is the same work, wither the new seed.
    args:
      - {name: title, type: text, required: true, cli: pos, placeholder: '"<title>"', doc: "the seed's title"}
      - {name: body, type: markdown, cli: "-m", stdin: true, doc: "markdown, or - to read stdin; empty stdin is refused"}
      - {name: part_of, type: seed, cli: "--part-of", placeholder: "<plot>", doc: "plant under a plot"}
      - {name: discovered_from, type: seed, cli: "--discovered-from", placeholder: "<seed>", doc: "record the seed this work came from"}
      - {name: checks, type: check_definition, list: true, cli: "--check", doc: "a check the seed must prove; attn picks the id unless C#= names it; repeats"}
    result: Seed
    examples:
      - {title: "Retry the uploader on 503", part_of: s-p4k2m1, checks: ["A 503 is retried three times"]}

  - name: seed plot
    summary: plant a whole plot in one move from a JSON payload
    runs: home
    grant: full
    wrong_args: 'takes no arguments, got {first}; the plot is JSON on stdin or at -f <path>'
    doc: |
      Plants a whole plot in one move from a JSON payload, read from the `plot` file, or from stdin when the file is - or omitted: {"title": …, "body": …, "checks": [{"id": "C5", "text": …, "shared": true}], "part_of": "<plot>", "discovered_from": "<seed>", "children": [{"title": …, "body": …, "checks": […], "after": ["<sibling step slug>"]}]}.

      Children are parallel by default; `after` names the siblings a child waits for, by step slug or full title. `part_of` plants the plot inside another plot, and `discovered_from` records the seed whose work turned up the plot; give each by id or slug. A shared check is proven by each seed below the plot that has no children. The plot, its children and their edges commit together. Prints the plot's id and each child's id and step slug, then up to 3 similar open seeds across all planted titles, each naming the new seed it resembles. Planting always proceeds; wither a new seed if a suggestion is the same work.
    args:
      - {name: plot, type: plot, required: true, cli: "-f", file: true, doc: "the plot payload to read; - or omitted reads stdin"}
    result: SeedPlotResult

  - name: seed link
    summary: relate two seeds
    runs: home
    grant: full
    wrong_args: 'reads as a sentence: `attn seed link s-7k3f9m blocks s-2p4qxv`, where the kind is blocks or part-of or discovered-from'
    doc: |
      Relates two seeds. "a blocks b" keeps b out of ready until a closes. "a part-of b" puts a under b; b is then a plot. "a discovered-from b" records where work came from without ordering it. A structural cycle is refused, naming both seeds and the edge to remove.
    args:
      - {name: a, type: seed, required: true, cli: pos, placeholder: "<a>"}
      - {name: relation, type: relation, required: true, cli: pos}
      - {name: b, type: seed, required: true, cli: pos, placeholder: "<b>"}
    result: SeedLinkResult
    examples:
      - {a: s-7k3f9m, relation: blocks, b: s-p4k2m1}

  - name: seed unlink
    summary: remove an edge between two seeds
    runs: home
    grant: full
    wrong_args: 'reads as a sentence: `attn seed unlink s-7k3f9m blocks s-2p4qxv`, where the kind is blocks or part-of or discovered-from'
    doc: |
      Removes the edge "a relation b". Every link has an unlink.
    args:
      - {name: a, type: seed, required: true, cli: pos, placeholder: "<a>"}
      - {name: relation, type: relation, required: true, cli: pos}
      - {name: b, type: seed, required: true, cli: pos, placeholder: "<b>"}
    result: SeedLinkResult

  - name: seed ready
    summary: what you can tend right now
    runs: home
    grant: own
    read_only: true
    wrong_args: 'takes no arguments, got {first}; scope it with --plot <plot> or --all'
    doc: |
      Lists what you can tend right now, oldest first: nothing open blocks it, nobody is holding it, and it is not a plot, because a plot's work is its children. With neither `plot` nor `all` the scope is your profile's garden, unless this session was dispatched at a plot, and then that plot; `all` steps back out to the garden.
    args:
      - {name: plot, type: seed, cli: "--plot", placeholder: "<plot>", one_of: scope, doc: "keep to this plot"}
      - {name: all, type: bool, cli: "--all", one_of: scope, doc: "the whole garden, overriding a dispatched session's plot"}
    result: SeedReadyResult

  - name: seed ls
    summary: the garden, newest first, with children nested under their plot
    runs: home
    grant: own
    read_only: true
    wrong_args: 'takes no arguments, got {first}; to read one seed use `attn seed show <id>`'
    doc: |
      Lists the garden, newest first, with children nested under their plot, without bodies or checks; `seed_show` reads one seed whole. `plot` lists every child of one plot, oldest first, harvested and withered included. `stale` narrows to open seeds whose log has not moved for `window` (default {stale_window}): a query for your judgment, never a reaper. `standby` narrows to seeds on standby, each with the pull requests it watches and their readiness, its reminder, and why a resume is blocked when one is.
    args:
      - {name: plot, type: seed, cli: "--plot", placeholder: "<plot>", one_of: filter, doc: "list every child of this plot"}
      - {name: stale, type: bool, cli: "--stale", one_of: filter, doc: "only open seeds whose log has not moved"}
      - {name: window, type: window, cli: "--window", doc: "the stale window, like 72h or 14d (with --stale)"}
      - {name: standby, type: bool, cli: "--standby", one_of: filter, doc: "only seeds on standby"}
      - {name: flat, type: bool, cli: "--flat", doc: "print a listing without nesting"}
    result: SeedListResult

  - name: seed show
    summary: one seed, news first
    core: true
    runs: home
    grant: own
    read_only: true
    wrong_args: 'needs exactly one seed id, got {count}: attn seed show s-7k3f9m'
    doc: |
      Reads one seed, news first: its state, who tends it and a bookmark; the newest entries on its log, and where the freshest handoff is when it is older than those; every edge that touches it, with seeds discovered from it folded to a count and the open ones; the outline of the plot it is part of; a plot's open children as a board, each with what it waits for, its checks and its newest entry, closed children folded into one line; checks and artifacts; the body last.

      `since` returns only the log entries saved after a bookmark, on this seed and every seed below it, newest first and labeled by seed, then a new bookmark. `section` returns one part of the body: the section under a heading, or every item that starts with an id like D3.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: since, type: bookmark, cli: "--since", one_of: part, doc: "only the log entries saved after the bookmark an earlier read printed, on this seed and every seed below it"}
      - {name: section, type: text, cli: "--section", one_of: part, placeholder: "<heading|id>", doc: "only the body's section under this heading (exact, or its start), or the items that start with this id, like D3"}
    result: SeedShowResult
    examples:
      - {seed: s-7k3f9m, since: 3618073}

  - name: seed notes
    summary: the whole log, newest first
    runs: home
    grant: own
    read_only: true
    wrong_args: 'needs exactly one seed id, got {count}: attn seed notes s-7k3f9m'
    doc: |
      Lists the whole log, newest first; `seed_show` renders the newest few and says how many more are here. The last line is a bookmark. `since` lists every entry saved after a bookmark, on this seed and every seed below it, labeled by seed. `kind` keeps one kind of entry, such as handoff or answer.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: since, type: bookmark, cli: "--since", doc: "only the log entries saved after the bookmark an earlier read printed, on this seed and every seed below it"}
      - {name: kind, type: entry_kind, cli: "--kind", doc: "only log entries of this kind: {entry_kinds}"}
      - {name: limit, type: count, cli: "--limit", doc: "how many log entries to read"}
    result: SeedNotesResult
    examples:
      - {seed: s-7k3f9m, kind: handoff}

  - name: seed prime
    summary: the standing garden contract and this session's garden position
    runs: home
    grant: own
    read_only: true
    wrong_args: 'takes no arguments, got {first}'
    doc: |
      Prints the standing garden contract and this session's live garden position.

  - name: seed guide
    summary: the craft of writing seeds
    runs: here
    grant: any
    wrong_args: 'takes no arguments'
    doc: |
      Prints the craft: writing a body, deliverable types and what "done" is for each, a complete plot example, artifacts, and handoffs and steering.

  - name: seed tend
    summary: claim the seed and start growing it
    runs: home
    grant: own
    wrong_args: 'needs exactly one seed id, got {count}: attn seed tend s-7k3f9m'
    doc: |
      Claims the seed and starts growing it. The freshest handoff prints on the claim, so picking a seed up primes you. Tending your own claim again changes nothing and rings nobody. `for` assigns the seed to a crew member instead; the user never claims a seed, so a tend from outside an attn session needs it.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: reason, type: text, cli: "-m", stdin: true, placeholder: '"<why>"', doc: "why, saved on the move"}
      - {name: for, type: name, cli: "--for", doc: "the crew member to assign the seed to"}
      - {name: force, type: bool, cli: "--force", doc: "act even though somebody else holds the seed; the log records it"}
    result: SeedTransitionResult

  - name: seed note
    summary: append to the seed's log
    core: true
    runs: home
    grant: own
    wrong_args: 'needs exactly one seed id, got {count}: attn seed note s-7k3f9m -m "what happened"'
    doc: |
      Appends to the seed's log: what happened and what you learned, for whoever tends it next. `handoff` addresses it to your successor on this seed: `seed_tend` prints the freshest one on the claim, so it is read before any work, and `seed_show` points at it once newer entries bury it. `ring` tells current and covering plot tenders and watchers to look; ordinary notes stay quiet.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: text, type: markdown, required: true, cli: "-m", stdin: true, placeholder: '"<what happened>"', doc: "markdown, or - to read stdin; empty stdin is refused"}
      - {name: handoff, type: bool, cli: "--handoff", doc: "write a note to whoever tends the seed next"}
      - {name: ring, type: bool, cli: "--ring", doc: "give the current tender and watchers a seed update after this note lands, and print who gets it"}
    result: SeedNote
    examples:
      - {seed: s-7k3f9m, text: "The parser change passes focused checks. Integration verification remains."}

  - name: seed park
    summary: pause the seed and let go of it
    runs: home
    grant: own
    wrong_args: 'needs exactly one seed id, got {count}: attn seed park s-7k3f9m'
    doc: |
      Pauses the seed deliberately: it is parked and lets go of its tender. An optional `reason` lands on the log in the same move. Tending it again picks it back up. Parking it again keeps the state and adds only the reason. Moves print who they rang.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: reason, type: text, cli: "-m", stdin: true, placeholder: '"<where you left it>"', doc: "where you left it, saved on the move"}
      - {name: force, type: bool, cli: "--force", doc: "act even though somebody else holds the seed; the log records it"}
    result: SeedTransitionResult

  - name: seed replant
    summary: put the seed back in the pool
    runs: home
    grant: full
    wrong_args: 'needs exactly one seed id, got {count}: attn seed replant s-7k3f9m'
    doc: |
      Puts the seed back in the pool: planted, unclaimed, ready for whoever is free. Reopens a closed seed, takes a parked one off hold, and hands back one being grown. Replanting an already planted seed changes nothing and rings nobody. Moves print who they rang.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: reason, type: text, cli: "-m", stdin: true, placeholder: '"<why>"', doc: "why, saved on the move"}
      - {name: force, type: bool, cli: "--force", doc: "act even though somebody else holds the seed; the log records it"}
    result: SeedTransitionResult

  - name: seed wither
    summary: close the seed as abandoned
    runs: home
    grant: full
    wrong_args: 'needs exactly one seed id, got {count}: attn seed wither s-7k3f9m'
    doc: |
      Closes the seed as abandoned: nobody is picking this up. Repeating it keeps the earlier reason and adds a different reason to the log. A harvested seed must be replanted first. A plot refuses while any direct child is open. Closing a plot's last child leaves a ringing note on the plot and names the plot in the output. Withering withdraws the seed's open asks from the user and names them in the output. Moves print who they rang.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: reason, type: text, cli: "-m", stdin: true, placeholder: '"<why>"', doc: "why, saved on the move"}
      - {name: force, type: bool, cli: "--force", doc: "act even though somebody else holds the seed; the log records it"}
    result: SeedTransitionResult

  - name: seed send-to-chief
    summary: give the seed to the Chief to decide its next working context
    runs: home
    grant: full
    wrong_args: 'needs exactly one seed id, got {count}: attn seed send-to-chief s-7k3f9m'
    doc: |
      Gives this seed to the Chief to decide its next working context. The saved folder, branch and placement problem are recorded automatically; `guidance` adds an exception such as a special branch or directory.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: guidance, type: text, cli: "-m", stdin: true, placeholder: '"<optional guidance>"', doc: "an exception for the Chief, such as a special branch or directory"}
    result: SeedSendToChiefResult

  - name: seed harvest
    summary: close the seed as done
    runs: home
    grant: own
    wrong_args: 'needs exactly one seed id, got {count}: attn seed harvest s-7k3f9m'
    doc: |
      Closes the seed as done, with a required `reason` unless `when_merged` is set. Repeating a harvest succeeds with the earlier reason; a different reason goes on its log. A withered seed must be replanted first. A plot refuses while any direct child is open. A seed with an ask the user has not answered refuses and names the ask: end your turn, harvest after you act on the answer, or withdraw the ask with `attn ask close`. Closing a plot's last child leaves a ringing note on the plot and names the plot in the output. Moves print who they rang.

      `when_merged` releases your claim and harvests the seed with your `reason` when the pull request merges. Without a reason it uses "PR #N merged: <title>". This command merges nothing. With no `pr` it takes this session's single open pull request, and names the pull requests when there is more than one; `when_merged` with `clear` takes the arming back.
    args:
      - {name: seed, type: seed, required: true, cli: pos}
      - {name: pr, type: url, cli: pos, placeholder: "<pr-url>", doc: "the pull request to wait for (with --when-merged)"}
      - {name: reason, type: text, cli: "-m", stdin: true, placeholder: '"<what got done>"', doc: "what got done, saved as the harvest reason"}
      - {name: when_merged, type: bool, cli: "--when-merged", doc: "harvest the seed when its pull request merges"}
      - {name: clear, type: bool, cli: "--clear", doc: "take back the harvest condition (with --when-merged)"}
      - {name: force, type: bool, cli: "--force", doc: "act even though somebody else holds the seed; the log records it"}
    result: SeedTransitionResult
    examples:
      - {seed: s-7k3f9m, when_merged: true, reason: "Retries land; the wire test covers a 503"}
      - {seed: s-7k3f9m, when_merged: true, clear: true}

  - name: seed check add
