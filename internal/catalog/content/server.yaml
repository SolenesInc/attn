# The MCP server attn serves at /mcp. `description` is the one line a harness
# shows before it reads the server's instructions, and the instructions of the
# deferred server Codex lists (Codex shows a deferred server's first line, cut
# at 250 characters). The instructions are the intent map: `intro`, then a
# table of every group's `map.rows`, then each group's `map.notes`. A group that
# offers tools needs a map, and each core tool needs a row. Claude Code keeps
# the first 4,096 characters, so the generator refuses a longer map and names
# each file's share.
server:
  name: attn
  description: attn's tools for the work you share with the user and the agents beside you. Reach for them to track, report or hand off work, and before you tell the user attn can't do something.
  intro: |
    attn runs you beside the user's other agents. These tools are attn's. Each tool's description holds its rules: read it before the first call. Find a tool by the words in this map.
