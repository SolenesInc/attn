# The MCP server attn serves at /mcp. `description` is the one line a harness
# shows before it reads the server's instructions. The instructions are the
# intent map: `intro`, then a list of every group's `map.rows`, then each
# group's `map.notes`. A group that offers tools needs a map. `do` and `read`
# are the tools that run a script: `text` is the tool's description and
# `script` its argument's. `do.text` is followed by the signature of every
# command marked `upfront`. Commands marked `tool` are served as tools of their
# own. Claude Code cuts the instructions and each description at 4,096
# characters, so the generator refuses a longer one.
server:
  name: attn
  description: attn's commands to track, report or hand off work, and to reach the user and other agents.
  intro: |
    attn runs the commands below. Call them as functions in a script: `attn_do` runs any of them, `attn_read` those that only read. `ask` and `skill` are also tools of their own. Find a command by the words below. A row's parentheses name its reference: read it with `skill({reference: "…"})` before you first call the row's commands; for `guide X`, call `guide({topic: "X"})`.
  split: "This server, attn-core, holds {core}. The server attn holds every other tool."
  do:
    title: Run attn commands
    script: the script, in JavaScript
    text: |
      Runs a script of attn's commands and answers with what it returns or logs, then with what it changed. Each command is a function that takes one object of named arguments and returns its result:

      const plan = seed_plant({title: "Retry uploads", body: `Retry the upload twice.`});
      for (const id of ["s-7k3f9m", "s-2w4x8p"]) {
        try {
          seed_harvest({seed: id, reason: "Shipped"});
        } catch (e) {
          console.log(id, e.code, e.message);
        }
      }
      return plan.id;

      - A result is the object that `attn <command> --json` prints, or a string when the command answers with text. `return` or console.log what you want to read. A script that does neither answers with each read's result.
      - The script is plain JavaScript, with no files, network, timers or modules. Put long text in a template literal.
      - A refused command throws a Refusal with `code`, `message`, `fix` and `command`. When nothing catches it, the script ends there. A script is not a transaction: the commands before the refusal stand, so run only the rest again.
      - The answer ends with `changed:` and a line for each command that changed something, with the values it sent. Check that they are what you meant, above all values the script cut out of other text.
      - One call runs at most 1,000 commands and 50 s.

      The commands agents call most, with ? on an optional argument, are below. Every other attn command is a function too. `skill({command: "seed_park"})` prints a command's rules and `skill({command: "crew"})` a family's signatures. A refusal about arguments names them all, so call a command you know without reading about it first.

  read:
    title: Read with attn commands
    script: the script, in JavaScript
    text: |
      Runs a script as attn_do does, with the same functions, but refuses a command that changes something. It needs no permission, so read with it: `return seed_show({seed: "s-7k3f9m"})`. Read several things in one script, and return only the parts you need once you know a result's fields.
