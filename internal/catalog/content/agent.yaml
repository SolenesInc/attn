# The agent family. A command acts as its caller: the session the terminal
# shows, or the session --source-session (or --session) names from a shell.
# `anyone` lets a terminal that shows no session run a read that acts as nobody.
groups:
  - name: agent
    usage: "<command>"
    summary: "see what other agents are doing, message one, close or reload one"
    doc: |
      See what other agents are doing, message one, read your inbox, close or reload one.
    map:
      rows:
        - {need: "Message, watch or close other agents; read your inbox", tools: [agent_msg, agent_peek, agent_close, agent_inbox]}
    flags:
      - {name: source-session, placeholder: "<id>", doc: "the session acting (defaults to the current session)"}
      - {name: session, placeholder: "<id>", doc: "the same as --source-session"}
      - {name: profile, placeholder: "<name|id>", doc: "the profile whose crew to address outside a session"}

commands:
  - name: agent list
    summary: the address book of every session on this daemon
    runs: home
    grant: full
    read_only: true
    anyone: true
    doc: |
      The address book: every session on this daemon with its short id, name, profile, state, and whether a turn is owed. Inside attn it lists your session's profile. Read-only.
    result: AgentListResult

  - name: agent peek
    summary: observe a session without interrupting it
    runs: home
    grant: own
    read_only: true
    anyone: true
    doc: |
      Observes a session without interrupting it: state, last assistant message, and the rendered screen. On a Claude session, says when the composer holds Claude's suggestion and not typed text. Passive: the observed agent never notices. `target` is a crew name, a full session id, or a unique session id prefix. A crew member between sessions stays between sessions.
    args:
      - {name: target, type: text, required: true, cli: pos, placeholder: "<session-or-member>", doc: "a crew name, full session id, or unique id prefix"}
    result: AgentPeekResult
    errors:
      - {code: session_not_found, fix: "Pass a session id agent_list names, or the name of a crew member in session."}
      - {code: ambiguous_session, fix: "Give more of the id; agent_list carries full ids."}
      - {code: crew_member_asleep, fix: "Start the member with crew_start first, or message it with agent_msg, which starts it."}

  - name: agent msg
    summary: send a session, crew member or seed a message
    core: true
    runs: home
    grant: own
    caller: sender
    doc: |
      Sends a session, crew member or seed a message. By default the message waits until the recipient's turn ends: the body stays in the inbox and the recipient gets a generic inbox notification at its next safe prompt. `steer` puts the message into a working recipient's running turn at its next step, without stopping the turn. `interrupt` stops a working recipient's turn now and makes the message its next prompt. A recipient that is not working gets the message right away either way. A harness that cannot take a steer or an interrupt keeps the message queued, and the result says why. `as_user` delivers the text as the user's own words, without the sender's name; use it only to pass on words the user gave you to pass on. The result says queued, notified, steered, interrupted, or refused. attn starts a session for a member between sessions before the notification is placed. A seed id reaches its current or next tender, waiting when none is reachable. In the CLI, a message that starts with - goes after --, as: attn agent msg -- <target> "-text".
    args:
      - {name: target, type: text, required: true, cli: pos, placeholder: "<session-or-member-or-seed>", doc: "a session id or unique prefix, a crew member's name, or a seed id"}
      - {name: text, type: text, required: true, cli: pos, placeholder: '"<text>"', doc: "the message"}
      - {name: steer, type: bool, cli: "--steer", doc: "put the message into the recipient's running turn at its next step, without stopping the turn"}
      - {name: interrupt, type: bool, cli: "--interrupt", doc: "stop the recipient's turn now and make the message its next prompt"}
      - {name: as_user, type: bool, cli: "--as-user", doc: "deliver the text as the user's words, without your name; only to pass on what the user said"}
    result: AgentMsgResult
    errors:
      - {code: no_sender, usage: true, fix: "Pass {session}, or run it inside an attn session."}
      - {code: steer_and_interrupt, usage: true, fix: "Pass {steer} or {interrupt}, not both."}
      - {code: as_user_with_steer, usage: true, fix: "A steer cannot be the user's words. Drop {steer}, or pass {interrupt}."}
      - {code: session_or_crew_member_not_found, fix: "Pass a session id agent_list names, a crew member's name, or a seed id."}
      - {code: ambiguous_session, fix: "Give more of the id; agent_list carries full ids."}

  - name: agent close
    summary: close a session for good, with a reason
    runs: home
    grant: own
    doc: |
      Closes a session for good. A session may close itself and agents below it in its delegation chain, including delegates of delegates; the profile's Chief may close any agent of that profile. The reason is required: the session row stays in the ledger, and the reason is what the next reader gets. Without `compact` it is immediate, so say what you have to say first. A seed id closes whoever tends it, and the seed keeps its tender with a note about the close. `self` closes the caller without its id and takes no target.

      `compact` goes only with `self`: attn waits for your turn to end, compacts your conversation through the harness, then closes the session. End your turn right after: you get no turn after the compact. When the compact fails, the session still closes, and the reason says the compact did not run. Only a Claude session with the Claude mod and a Codex session on the shared Codex app server compact, on the home machine or an outpost, and a Sigma session on the home machine; attn refuses any other session and says why. Compact only a session that will resume as itself, as a seed's tender does when its standby resumes it. A crew member's next session starts fresh.
    args:
      - {name: target, type: text, cli: pos, placeholder: "<session-or-seed>", doc: "the session id or unique prefix, or the seed whose tender to close"}
      - {name: reason, type: text, required: true, cli: "-m", placeholder: '"<reason>"', doc: "why this session is done"}
      - {name: self, type: bool, cli: "--self", doc: "close the calling session"}
      - {name: compact, type: bool, cli: "--compact", doc: "compact the conversation after this turn, then close (with self)"}
    result: AgentCloseResult
    errors:
      - {code: no_sender, usage: true, fix: "Pass {session}, or run it inside an attn session."}
      - {code: close_reason_required, usage: true, fix: "Pass {reason}: why this session is done."}
      - {code: session_not_found, fix: "Pass a session id agent_list names, or {self} to close yourself."}

  - name: agent reload
    summary: interrupt and reload agents in place
    runs: home
    grant: full
    doc: |
      Interrupts and reloads agents in place, as "Reload this agent" does. Running work is interrupted and non-persistent state may be lost. Full ids, unique prefixes and names of crew members in session work; a member between sessions stays between sessions. A member whose saved harness matches its session reloads with its saved model and effort. A session may reload itself and descendants; the profile's chief may reload any agent in that profile. `all` is chief-only, includes the chief and crew, and excludes shells. Chief and crew close protections do not prevent reload. Each target reports an outcome; failures leave successful reloads in place. Repeated targets reload once. Exited agents use 80x24. The caller reloads last if selected; a self reload may interrupt the command before its result arrives.
    args:
      - {name: targets, type: text, list: true, cli: rest, placeholder: "<session-or-member>", unless: all, doc: "the sessions or crew members to reload"}
      - {name: all, type: bool, cli: "--all", doc: "every agent in the caller's profile (chief only)"}
    result: AgentReloadResult
    errors:
      - {code: no_sender, usage: true, fix: "Pass {session}, or run it inside an attn session."}

  - name: agent inbox
    summary: read your unread notifications, or one message by id
    runs: home
    grant: own
    doc: |
      Reads up to 20 unread notifications in FIFO order, or one notified user or peer message by `message`. Each returned item gets its durable read receipt. `limit` can be 1 through {max_inbox}.
    args:
      - {name: message, type: text, cli: pos, placeholder: "<message-id>", doc: "one notified message to read"}
      - {name: limit, type: count, cli: "--limit", doc: "how many unread items to read (default 20)"}
      - {name: render, type: bool, cli: internal, doc: "answer the text the CLI prints too"}
    result: AgentInboxBatchResult
    errors:
      - {code: no_session, usage: true, fix: "Pass {session}, or run it inside an attn session."}
      - {code: message_not_found, fix: "Pass the id of a message your inbox notified you about."}
      - {code: message_not_notified, fix: "Read it after its notification lands."}

  - name: agent msg-status
    summary: whether a message you sent is queued, notified or read
    runs: home
    grant: own
    read_only: true
    doc: |
      Inspects a message you sent as queued, notified, or read, and says whether a running turn took it as a steer or an interrupt, still holds it, or it arrived as the next prompt instead, and whether you sent it as the user. A message the recipient's harness holds for its running turn reads as notified until the harness places it.
    args:
      - {name: message, type: text, required: true, cli: pos, placeholder: "<message-id>", doc: "the id agent_msg answered"}
    result: AgentPeerMessage
    errors:
      - {code: no_session, usage: true, fix: "Pass {session}, or run it inside an attn session."}
      - {code: message_not_found, fix: "Pass the id agent_msg answered for a message you sent."}

  - name: agent attachment
    summary: download a file the user attached to a message
    runs: here
    grant: own
    doc: |
      Downloads a saved user file from this session's profile to `out`, then you can inspect it. Older messages quote a quick capture id before the attachment id; that form still works, and the second id is the attachment. Outside a session, choose the profile when more than one profile exists.
    args:
      - {name: attachment, type: text, required: true, cli: pos, placeholder: "<attachment-id>", doc: "the attachment to download"}
      - {name: quoted_attachment, type: text, cli: pos, cli_only: true, placeholder: "<attachment-id>", doc: "the attachment, when a quick capture id comes first"}
      - {name: out, type: path, required: true, cli: "--out", placeholder: "<path>", doc: "where to write the file; it must not exist yet"}
