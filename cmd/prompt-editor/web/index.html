<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prompt editor</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/sheet/sheet.css">
  <script type="module" src="/sheet/dist/sheet.js"></script>
</head>
<body>
  <header class="top">
    <span class="brand">Prompt editor</span>
    <button id="open" class="open" type="button" title="Open a situation, scenario or event (Ctrl K)">
      <span id="title-kind" class="title-kind"></span>
      <span id="title-id" class="title-id">Open…</span>
      <span id="title-count" class="title-count"></span>
      <kbd>Ctrl K</kbd>
    </button>
    <span class="diff-controls">
      <button id="diff" class="diff" type="button" aria-pressed="false" title="Show changes against the base (Ctrl Shift D)">Diff <kbd>Ctrl ⇧ D</kbd></button>
      <select id="base" aria-label="Diff base"></select>
      <span id="base-commit" class="base-commit"></span>
    </span>
    <span id="save-state" class="save-state">All saved</span>
    <select id="theme" aria-label="Appearance">
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </header>
  <p id="description" class="description"></p>
  <p id="notice" class="notice" role="status" aria-live="polite"></p>
  <main id="document" class="sheet" aria-busy="true">
    <p id="missing" class="empty">This page is not built yet. Run <code>make prompt-editor</code>.</p>
  </main>
</body>
</html>
